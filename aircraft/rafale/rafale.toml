# The gear where the three-view draws its wheels (the axles 4.86 and 9.61 m
# behind the nose tip): twin 0.38 m nose wheels, single 0.76 m mains on a
# 3.05 m track, every leg folding forward (Safran); standing on it the
# fin's tip is 5.23 m up.
[[gear]]
name = "Nose Gear"
position = [4.860, 0.0, -1.980]
steerable = true
max_steer = 60
wheel_diameter = 0.38
wheel_width = 0.14
wheels = 2
retractable = true
retract = "forward"
static_deflection = 0.12
attach = [4.860, 0.000, -0.400]

