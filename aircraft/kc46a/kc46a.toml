# Pratt & Whitney PW4062: 62,000 lbf (the USAF's KC-46A figure), bypass
# ratio 4.8, 9,420 lb dry (the PW4000-94 family, Pratt & Whitney); take-off
# fuel flow about 0.33 lb/lbf/h and throttle ratio 1.05 (estimate); its core
# nozzle 0.95 m across (estimate)
[[engine]]
name = "PW4062"
type = "turbofan"
mirror = true
thrust_dry_kn = 275.8
bypass_ratio = 4.8
tsfc_dry = 0.33
throttle_ratio = 1.05
design_mach = 0.85
position = [18.150, 7.900, 2.300]
inlet_x = 15.65
mass = 4273
[engine.nozzle]
position = [22.100, 7.900, 2.300]
diameter = 0.95
length = 0.60
petal_open_deg = 0.0

# The gear (the 767-300F's): the nose gear 4.55 m behind the nose, the main
# gear's bogies 19.69 m behind it and 9.30 m apart (Boeing); each main gear a
# four-wheel bogie on 46x18 tyres, its axles 1.45 m apart (estimate); the
# nose gear folds forward, the mains inward into the wing's root, into open
# wells (hangar's doors for an inward swing split fore and aft, where a
# bogie's ends pass)
[[gear]]
name = "Nose Gear"
position = [4.550, 0.0, -0.150]
steerable = true
max_steer = 65
wheels = 2
wheel_diameter = 0.940
wheel_width = 0.360
retractable = true
retract = "forward"
door_reach = 1.2              # a long leg folding forward: its doors swing well clear
door_deg = 120
static_deflection = 0.15
attach = [4.550, 0.0, 2.950]

[[gear]]
name = "Main Gear"
mirror = true
position = [24.240, 4.650, -0.150]
wheels = 2
wheel_diameter = 1.170
wheel_width = 0.460
axles = 2
axle_spacing = 1.45
retractable = true
retract = "inward"
wheel_turn = "flat"
doors = false
static_deflection = 0.15
attach = [24.240, 4.300, 3.250]

# Fly-by-wire only for the boom: the 767's controls are hydraulically
# boosted, with its yaw damper
[flight_control]
type = "direct"
yaw_damper = true

[reference]
area = 283.3                  # m2: 3,050 ft2, published (the reference trapezoid)
span = 47.57                  # m
chord = 6.81                  # m: the reference trapezoid's mean aerodynamic chord
aero_point = [22.20, 0.0, 4.10]   # at the loaded CG

[mass]
empty = 82377                 # kg: 181,610 lb (USAF, Boeing)
empty_cg = [23.30, 0.0, 4.10] # estimate: placed from the neutral point the aero stage finds
# radii of gyration (estimate): a twin-engined jet transport's (Roskam)
gyration = [0.25, 0.37, 0.45]
[mass.component]              # kg, estimates: jet-transport weight fractions of the take-off weight (Roskam)
wing = 18800
htail = 1900
fin = 1300
fuselage = 20700
"belly fairing" = 500
nacelle = 3200
"refuelling pod" = 900
boom = 1500
"Nose Gear" = 900
"Main Gear" = 6600
