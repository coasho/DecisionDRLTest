# Lockheed Martin F-35A Lightning II, built by hangar from public data. The
# real one flies to 50 deg angle of attack; past about 21 deg this model finds
# its stalled stabilators too weak to bring the nose down, so its limiter
# holds 20 deg.
#
# Frame: metres, x aft from the nose tip, y right, z up from the wing's chord
# plane. Sources: USAF fact sheet, Lockheed Martin and Jane's (dimensions,
# weights, performance); Pratt & Whitney (F135-PW-100). The shape is measured
# off the JSF program office's side, top and front views (www.jsf.mil, public
# domain, one scale: 178 px/m); the wheelbase and track off Virginia Tech's
# planform analysis of the F-35A (19.75 ft, 14.24 ft).

[aircraft]
name = "f35a"
description = "Lockheed Martin F-35A Lightning II (hangar build)"
category = "fighter"

[analysis]
speed = 240.0

# The wing: 42.7 m2 (460 ft2), span 10.70 m, 34 deg leading edge, -14 deg
# trailing edge (root 6.48 m, tip 1.54 m to the centre line), no dihedral.
# The CG sits 2 % of the MAC behind the neutral point hangar finds: near
# neutral, as the F-35's relaxed stability is described.
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [6.460, 0.000, 0.000], chord = 6.480, airfoil = "naca64a205" },
  { le = [10.060, 5.350, 0.000], chord = 1.540, airfoil = "naca64a204" },
]
controls = [
  { name = "flaperon", channel = "aileron", mix = { flap = 1.0 }, span = [0.28, 0.78], chord_fraction = 0.24, limits = [-30, 30] },
]
# leading-edge flaps over the whole exposed span, on the angle-of-attack
# schedule (the F-16's law stands in)
leading = [
  { name = "leading-edge flap", span = [0.27, 0.97], chord_fraction = 0.14, limits = [-3, 30] },
]

# The chined forebody runs into a sharp leading-edge extension ahead of the
# wing root: its vortex carries the F-35's high angles of attack
[[surface]]
name = "lex"
kind = "strake"
airfoil = "plate"
sections = [
  { le = [5.960, 1.200, 0.050], chord = 2.300 },
  { le = [8.000, 2.340, 0.000], chord = 0.050 },
]

# All-moving stabilators, 11 m2 exposed, their edges parallel to the wing's
# (34 deg, -14 deg), reaching aft past the nozzle beside it; the surface runs
# on inside the fuselage to the centre line, as the body carries the tail's
# lift across
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca64a004"
sections = [
  { le = [11.700, 0.000, -0.030], chord = 2.300 },
  { le = [12.170, 0.700, -0.030], chord = 1.830 },
  { le = [12.380, 1.000, -0.020], chord = 3.330 },
  { le = [14.180, 3.650, 0.120], chord = 0.850 },
]
controls = [
  { name = "stabilator", channel = "elevator", mix = { aileron = 0.3 }, span = [0.19, 1.0], chord_fraction = 1.0, pivot = 0.35, limits = [-30, 30] },
]

# Twin vertical tails canted 20 deg outboard, 2 x 3.6 m2, their trailing
# edges swept too
[[surface]]
name = "fin"
kind = "fin"
mirror = true
airfoil = "naca64a004"
sections = [
  { le = [11.680, 1.490, 0.300], chord = 2.100 },
  { le = [13.340, 2.250, 2.360], chord = 1.440 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.05, 0.65], chord_fraction = 0.30, limits = [-30, 30] },
]

