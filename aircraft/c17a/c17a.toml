# The main gear's sponsons, low on each side from 17 to 28.3 m, out to 5.3 m
# and down to 0.37 m off the ground (the drawing): the fuselage and they are
# one body to the air (kind nacelle: merged with the fuselage they stand on).
# Their ends are as wide as they are tall: the mesher's fillet with the
# fuselage (0.65 m) grows phantom material off a thin one.
[[body]]
name = "sponson"
kind = "nacelle"
mirror = true
stations = [
  { x = 16.80, y = 3.60, w = 0.20, top = 1.600, bottom = 1.400, n = 2.0 },
  { x = 17.50, y = 3.90, w = 1.40, top = 2.600, bottom = 0.850, n = 2.2 },
