# Four F108-CF-100 (CFM56-2B1): 96.2 kN (21,634 lbf), bypass ratio 6.0, no
# afterburner and no thrust reversers
[[engine]]
name = "F108 inboard"
type = "turbofan"
mirror = true
thrust_dry_kn = 96.2
bypass_ratio = 6.0
tsfc_dry = 0.37               # lb/(lbf h), static (0.65 in cruise)
throttle_ratio = 1.05         # Mattingly's TR for a high-bypass engine (estimate)
design_mach = 0.85
position = [15.700, 8.280, -0.350]
mass = 2137                   # installed: the 2,120 kg engine and its accessories (Raymer 15.3.2's W_ec)
inlet_x = 13.7
[engine.nozzle]
position = [17.400, 8.280, -0.350]  # the core nozzle at the nacelle's end
diameter = 0.95
length = 0.45
petal_open_deg = 0.0          # a fixed nozzle

[[engine]]
name = "F108 outboard"
type = "turbofan"
mirror = true
thrust_dry_kn = 96.2
bypass_ratio = 6.0
tsfc_dry = 0.37
throttle_ratio = 1.05
design_mach = 0.85
position = [20.200, 14.050, 0.200]
mass = 2137
inlet_x = 18.2
[engine.nozzle]
position = [21.900, 14.050, 0.200]
diameter = 0.95
length = 0.45
petal_open_deg = 0.0

# The gear where the T.O. drawing puts it: the nose wheels 5.48 m behind the
# radome's tip, the main bogies' centres 45 ft 8 in behind them, 22 ft 1 in
# apart, each bogie's two axles 1.51 m apart. The nose gear folds forward,
# the main legs inward into the belly, as the C-135's do. The contacts stand
# a static deflection below the parked ground line.
[[gear]]
name = "Nose Gear"
position = [5.480, 0.0, -2.230]
steerable = true
max_steer = 60
wheel_diameter = 0.965
wheel_width = 0.280
wheels = 2
retractable = true
retract = "forward"
static_deflection = 0.12
attach = [5.480, 0.0, -0.450]

[[gear]]
name = "Main Gear"
mirror = true
position = [19.380, 3.366, -2.260]
wheel_diameter = 1.245
wheel_width = 0.430
wheels = 2
axles = 2                     # the four-wheel bogie
axle_spacing = 1.51
retractable = true
retract = "inward"
doors = false                 # open wells: hangar's doors for an inward swing split fore and aft,
                              # where a four-wheel bogie's ends pass (the real ones close)
wheel_turn = "flat"
static_deflection = 0.15
attach = [19.380, 2.950, 0.200]    # the trunnion inboard of the wheels: the leg splays out 13 deg

[flight_control]
type = "direct"               # hydraulically boosted controls
yaw_damper = true             # the C-135's own yaw damper

[mass]
empty = 54080                 # 119,231 lb, KC-135R (FAS)
mtow = 146284                 # 322,500 lb
# The C-135's empty CG is aft: the KC-135T's averages 35.3 % of the MAC and
# Boeing has 3,500 lb of fuel kept in the forward body tank as ballast
# (Morrison, "Reballasting the KC-135 Fleet for Fuel Efficiency", AFIT 2010).
# Here 36 % of the MAC, 0.8 m above the wing root's chord plane (estimate).
empty_cg = [18.900, 0.0, 0.800]
# Structure by Raymer's cargo/transport equations (15.25-15.31) at 322,500 lb
# and a 2.5 g limit, rounded; the systems (a tanker's fuel plumbing, the
# boom's hydraulics, avionics, air conditioning ...) make up the rest of the
# empty mass
[mass.component]
wing = 12750
htail = 1300
fin = 1080
fuselage = 9900
"Nose Gear" = 500
"Main Gear" = 4180
"inboard nacelle" = 660       # both sides
"outboard nacelle" = 660
"inboard pylon" = 310
"outboard pylon" = 310
boom = 1100                   # estimate
"boom pod" = 150
"gear fairing" = 300
[[mass.payload]]
name = "pilot"
mass = 100
position = [2.900, -0.500, 1.700]
[[mass.payload]]
name = "co-pilot"
mass = 100
position = [2.900, 0.500, 1.700]
[[mass.payload]]
name = "boom operator"
mass = 100
position = [29.500, 0.0, 0.100]
# 200,000 lb of fuel (90.7 t): the wing tanks (inboard, outboard and reserve
