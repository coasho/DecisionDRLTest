[[engine]]
name = "AL-31FN"
type = "turbofan"
thrust_dry_kn = 79.4          # 8,100 kgf military
thrust_wet_kn = 122.6         # 12,500 kgf afterburner
bypass_ratio = 0.57
tsfc_dry = 0.75
tsfc_wet = 1.92
design_mach = 2.2
position = [12.200, 0.0, 0.550]
mass = 1538
inlet_x = 3.5
[engine.nozzle]
position = [15.520, 0.0, 0.550]
diameter = 0.70               # m, as drawn
length = 1.17

# The gear where the three-view draws its wheels (the axles 4.78 and 9.43 m
# behind the radome tip): twin 0.39 m nose wheels under the intake, aft of
# its mouth, folding aft; single 0.73 m mains on a 2.67 m track, folding
# forward into the fuselage; standing on it the fin's tip is 5.71 m up.
[[gear]]
name = "Nose Gear"
position = [4.780, 0.0, -1.700]
steerable = true
max_steer = 50
wheel_diameter = 0.39
wheel_width = 0.14
wheels = 2
retractable = true
retract = "aft"
static_deflection = 0.12
attach = [4.780, 0.000, -0.150]

[[gear]]
name = "Main Gear"
mirror = true
position = [9.430, 1.335, -1.740]
wheel_diameter = 0.73
wheel_width = 0.24
retractable = true
retract = "forward"
static_deflection = 0.16
attach = [9.300, 0.620, -0.080]

[reference]
aero_point = [8.866, 0.0, 0.0]    # at the CG

[flight_control]
type = "fbw"
n_max = 9.0
n_min = -3.0
alpha_max_deg = 30.0
roll_rate_deg_s = 270.0

[mass]
empty = 9750                  # J-10A (estimates)
# empty: as far aft as a 15 deg tip-back over the main wheels allows;
# loaded, 9 % of the MAC behind the neutral point hangar finds
