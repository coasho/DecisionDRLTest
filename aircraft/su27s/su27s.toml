[[engine]]
name = "AL-31F"
type = "turbofan"
mirror = true
thrust_dry_kn = 74.5          # 7,600 kgf military
thrust_wet_kn = 122.6         # 12,500 kgf afterburner
bypass_ratio = 0.59
tsfc_dry = 0.75
tsfc_wet = 1.92
design_mach = 2.35
position = [17.300, 1.150, -0.500]
mass = 1520
inlet_x = 9.9
[engine.nozzle]
position = [20.100, 1.150, -0.500]

# The gear where the Su-30's three-view draws its wheels (the axles 7.90 and
# 13.77 m behind the radome tip: the published 5.88 m wheelbase), the 4.34 m
# track and the tyres (680x260, 1030x350); standing on it the fins' tips are
# the published 5.93 m up. The legs fold forward, the mains turning their
# wheels flat into the nacelles' sides.
[[gear]]
name = "Nose Gear"
position = [7.900, 0.0, -2.237]
steerable = true
max_steer = 45
wheel_diameter = 0.68
wheel_width = 0.26
retractable = true
retract = "forward"
static_deflection = 0.15
attach = [7.800, 0.0, -0.250]

[[gear]]
name = "Main Gear"
mirror = true
position = [13.770, 2.170, -2.267]
wheel_diameter = 1.03
wheel_width = 0.35
retractable = true
retract = "forward"
wheel_turn = "flat"
static_deflection = 0.18
attach = [13.400, 1.500, -0.450]

[reference]
aero_point = [12.830, 0.0, 0.0]    # 0.30 MAC

[flight_control]
type = "fbw"
n_max = 9.0
n_min = -3.0
alpha_max_deg = 26.0
roll_rate_deg_s = 270.0

[mass]
empty = 16380                 # Su-27S (Jane's)
empty_cg = [12.840, 0.0, -0.450]
# no published inertia: radii of gyration like the F-15's (the same class,
# layout and size)
gyration = [0.265, 0.430, 0.550]
[[mass.payload]]
name = "pilot"
mass = 100
position = [6.300, 0.0, 0.750]
[[mass.payload]]
name = "gun ammunition"       # GSh-30-1, 150 rounds
mass = 70
position = [10.190, 1.000, 0.000]
[[mass.tank]]
name = "fuselage forward"     # the normal fuel load: 5,270 kg of 9,400
position = [10.690, 0.0, -0.200]
capacity = 2000
[[mass.tank]]
name = "fuselage centre"
position = [13.190, 0.0, -0.150]
capacity = 2200
[[mass.tank]]
name = "fuselage aft"
position = [15.690, 0.0, -0.100]
capacity = 1070

[dimensions]                  # published, overall, gear down (Sukhoi):
length = 21.94                 # m
span = 14.70
height = 5.93

[targets]
# Su-27S, normal take-off weight, published
max_mach = 2.35               # at 11 km, full afterburner
max_mach_altitude_ft = 36000
max_speed_ktas = 756          # 1,400 km/h at sea level
climb_rate_fpm = 59000        # 300 m/s
service_ceiling_ft = 60700    # 18.5 km
