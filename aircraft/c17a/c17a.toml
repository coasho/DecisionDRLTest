position = [22.650, -14.000, 5.450]
capacity = 22000
[[mass.tank]]
name = "right outboard"
position = [22.650, 14.000, 5.450]
capacity = 22000

[dimensions]                  # published, overall, gear down (the flight manual)
length = 53.04                # m: 174 ft
span = 51.76                  # m: 169 ft 10 in over the winglets
height = 16.79                # m: 55 ft 1 in

[targets]
# Published: cruise Mach 0.74-0.77 (450 kt at 28,000 ft), maximum Mach 0.875
# at 28,000 ft, ceiling 45,000 ft (USAF; Boeing)
max_mach = 0.875
max_mach_altitude_ft = 28000
operational_ceiling_ft = 45000  # FL450 (USAF): a clearance
