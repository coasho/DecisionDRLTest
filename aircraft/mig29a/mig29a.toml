# Mikoyan MiG-29A (9.12, Fulcrum-A), built by hangar from public data.
#
# Frame: metres, x aft from the radome tip, y right, z up from the wing's
# chord plane. Sources: Jane's All the World's Aircraft, Mikoyan data
# (dimensions, weights, performance), Klimov (RD-33). Like the Su-27: a
# lifting centre body between two engine nacelles. The shape is measured off
# a three-view scaled by its span (11.36 m: 16.3 m from the radome to the
# tail, the published 17.32 m with the nose probe); its wheels stand 3.60 m
# apart, the published wheelbase 3.645 m.

[aircraft]
name = "mig29a"
description = "Mikoyan MiG-29A Fulcrum-A (hangar build)"
category = "fighter"

[analysis]
speed = 250.0

# The wing: 38 m2 reference, span 11.36 m, 42.6 deg leading edge, taper 0.22
# (root 5.44 m, tip 1.22 m to the centre line, MAC 3.78 m). Its 30 % MAC
# point is the aerodynamic reference; the CG sits 0.5 m ahead of the main
# wheels (15 deg to tip back on the tall gear; a short wheelbase: 3.645 m,
# the nose wheels behind the cockpit).
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [6.260, 0.000, 0.000], chord = 5.440, airfoil = "naca64a005" },
  { le = [11.490, 5.680, -0.130], chord = 1.220, airfoil = "naca64a004" },
]
controls = [
  { name = "aileron", channel = "aileron", span = [0.64, 0.95], chord_fraction = 0.24, limits = [-20, 20] },
  { name = "flap", channel = "flap", span = [0.30, 0.62], chord_fraction = 0.24, limits = [0, 25] },
]
# leading-edge flaps outboard of the root extension, scheduled with angle
# of attack (the F-16's law stands in)
leading = [
  { name = "leading-edge flap", span = [0.34, 0.97], chord_fraction = 0.13, limits = [-2, 20] },
]

# The leading-edge root extensions, 75 deg, from beside the cockpit
[[surface]]
name = "lerx"
kind = "strake"
airfoil = "plate"
sections = [
  { le = [3.700, 0.000, 0.050], chord = 3.000 },
  { le = [3.700, 0.580, 0.050], chord = 4.500 },
  { le = [7.700, 1.660, 0.000], chord = 0.050 },
]

# All-moving horizontal tails on the booms, 50 deg leading edge, their
# trailing edges swept 26 deg; the surface runs on inside the nacelles and
# the centre body to the centre line, as the body carries the tail's lift
# across
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca64a004"
sections = [
  { le = [10.800, 0.000, -0.300], chord = 3.300 },
  { le = [11.500, 0.600, -0.185], chord = 2.800 },
  { le = [12.380, 1.350, -0.185], chord = 2.220 },
  { le = [12.850, 1.750, -0.185], chord = 1.750 },
  { le = [13.020, 1.900, -0.185], chord = 2.280 },
  { le = [15.260, 3.810, -0.185], chord = 0.960 },
]
controls = [
  { name = "stabilator", channel = "elevator", mix = { aileron = 0.4 }, span = [0.50, 1.0], chord_fraction = 1.0, pivot = 0.35, limits = [-35, 15] },
]

# Twin vertical tails canted 6 deg outboard, 2 x 5.1 m2, 47 deg
[[surface]]
name = "fin"
kind = "fin"
mirror = true
airfoil = "naca64a004"
sections = [
  { le = [11.570, 1.720, 0.500], chord = 3.220 },
  { le = [14.120, 1.950, 2.550], chord = 0.650 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.10, 0.75], chord_fraction = 0.28, limits = [-25, 25] },
]

[[body]]
name = "fuselage"
kind = "fuselage"
stations = [
  { x = 0.00, w = 0.00, top = -0.280, bottom = -0.320 },
  { x = 0.50, w = 0.38, top = -0.040, bottom = -0.420, n = 2.0 },
  { x = 1.00, w = 0.68, top = 0.160, bottom = -0.520, n = 2.0 },
  { x = 1.50, w = 0.82, top = 0.280, bottom = -0.540, n = 2.0 },
  { x = 2.00, w = 0.88, top = 0.400, bottom = -0.570, n = 2.1 },
  { x = 2.50, w = 0.92, top = 0.510, bottom = -0.550, n = 2.1 },
  { x = 3.00, w = 1.08, top = 0.580, bottom = -0.490, n = 2.2 },
  { x = 4.00, w = 1.30, top = 0.640, bottom = -0.450, n = 2.3 },
  { x = 5.50, w = 1.50, top = 0.700, bottom = -0.450, n = 2.5 },
  { x = 7.00, w = 1.60, top = 0.850, bottom = -0.480, n = 2.6 },
  { x = 8.00, w = 1.60, top = 0.680, bottom = -0.470, n = 2.8 },
  { x = 9.00, w = 1.50, top = 0.530, bottom = -0.440, n = 2.8 },
  { x = 10.00, w = 1.40, top = 0.420, bottom = -0.440, n = 2.8 },
  { x = 11.00, w = 1.30, top = 0.350, bottom = -0.440, n = 2.8 },
  { x = 13.00, w = 1.20, top = 0.280, bottom = -0.420, n = 2.6 },
  { x = 14.19, w = 0.60, top = 0.150, bottom = -0.350, n = 2.4 },
]

# The engine nacelles under the leading-edge extensions, their intakes
# wedge inlets whose mouths are raked far back from the top lip
[[intake]]
name = "nacelle"
mirror = true
lip = 0.035
rake = 66
duct = 1.8
duct_rise = 0.2
duct_taper = 0.85
stations = [
  { x = 6.60, y = 0.930, w = 0.850, top = -0.450, bottom = -1.150, n = 4.5 },
  { x = 8.00, y = 0.930, w = 0.880, top = -0.100, bottom = -1.140, n = 4.0 },
  { x = 10.00, y = 0.930, w = 0.880, top = 0.050, bottom = -1.070, n = 3.6 },
  { x = 12.00, y = 0.930, w = 0.860, top = 0.100, bottom = -0.990, n = 3.2 },
  { x = 14.00, y = 0.930, w = 0.820, top = 0.100, bottom = -0.880, n = 2.8 },
  { x = 14.60, y = 0.930, w = 0.800, top = 0.050, bottom = -0.850, n = 2.4 },
]

# The wing roots' fairings outboard of the nacelles, deep enough for the
# main wheels lying flat
[[body]]
name = "wing root"
kind = "pod"
mirror = true
aero = false
stations = [
  { x = 7.00, y = 1.520, w = 0.300, top = 0.100, bottom = -0.100, n = 2.4 },
  { x = 7.60, y = 1.520, w = 1.100, top = 0.220, bottom = -0.300, n = 3.4 },
  { x = 10.60, y = 1.520, w = 1.100, top = 0.220, bottom = -0.300, n = 3.4 },
  { x = 11.60, y = 1.520, w = 0.000, top = 0.080, bottom = -0.080 },
]

# The tail booms outboard of the engines: they carry the fins and the
# stabilators' spindles
[[body]]
name = "boom"
kind = "boom"
mirror = true
stations = [
  { x = 10.50, y = 1.700, w = 0.200, top = 0.200, bottom = -0.100, n = 2.6 },
  { x = 12.00, y = 1.700, w = 0.400, top = 0.550, bottom = -0.350, n = 2.6 },
  { x = 14.00, y = 1.700, w = 0.400, top = 0.550, bottom = -0.350, n = 2.6 },
  { x = 14.60, y = 1.700, w = 0.000, top = 0.200, bottom = -0.150 },
]

# The framed windscreen and the canopy behind it
[[body]]
name = "canopy"
kind = "pod"
frames = [3.90]
frame_width = 0.07
stations = [
  { x = 3.000, w = 0.00, top = 0.660, bottom = 0.620 },
  { x = 3.500, w = 0.60, top = 0.930, bottom = 0.580, n = 2.0 },
  { x = 4.000, w = 0.76, top = 1.160, bottom = 0.600, n = 2.0 },
  { x = 4.600, w = 0.80, top = 1.230, bottom = 0.620, n = 2.0 },
  { x = 5.300, w = 0.74, top = 1.150, bottom = 0.650, n = 2.0 },
  { x = 6.000, w = 0.56, top = 1.010, bottom = 0.680, n = 2.0 },
  { x = 6.800, w = 0.00, top = 0.870, bottom = 0.720 },
]

# The pitot probe on the radome: 17.32 m overall with it
[[body]]
name = "probe"
kind = "pod"
aero = false
stations = [
  { x = -1.040, w = 0.000, top = -0.290, bottom = -0.310 },
  { x = -1.000, w = 0.030, top = -0.285, bottom = -0.315 },
  { x = -0.300, w = 0.040, top = -0.280, bottom = -0.320 },
  { x = 0.100, w = 0.120, top = -0.240, bottom = -0.360 },
]

[[engine]]
name = "RD-33"
type = "turbofan"
mirror = true
thrust_dry_kn = 49.4          # 5,040 kgf military
thrust_wet_kn = 81.4          # 8,300 kgf afterburner
bypass_ratio = 0.49
tsfc_dry = 0.77
tsfc_wet = 2.05
design_mach = 2.25
position = [12.300, 0.930, -0.380]
mass = 1055
inlet_x = 6.6
[engine.nozzle]
position = [14.730, 0.930, -0.380]

# The gear where the three-view draws its wheels (the axles 6.16 and 9.76 m
# behind the radome tip), the 3.09 m track and the tyres (twin 570x140,
# 840x290); standing on it the fins' tips are the published 4.73 m up. The
# main legs fold forward into the wing roots, their wheels turned to lie flat
# above them; the nose legs fold aft between the intakes (MiG Alley).
[[gear]]
name = "Nose Gear"
position = [6.160, 0.0, -2.320]
steerable = true
max_steer = 30
wheel_diameter = 0.57
wheel_width = 0.14
retractable = true
retract = "aft"
static_deflection = 0.14
attach = [6.100, 0.0, -0.300]
wheels = 2

[[gear]]
name = "Main Gear"
mirror = true
position = [9.760, 1.545, -2.340]
wheel_diameter = 0.84
wheel_width = 0.29
retractable = true
static_deflection = 0.16
attach = [10.080, 1.450, -0.050]
retract = "forward"
retract_axis = [0.0, 1.0, 0.0]  # straight forward, level when stowed
retract_deg = 83
wheel_turn = "flat"

[reference]
aero_point = [9.450, 0.0, 0.0]     # 0.30 MAC

[flight_control]
type = "fbw"
n_max = 9.0
n_min = -3.0
alpha_max_deg = 26.0
roll_rate_deg_s = 240.0

[mass]
empty = 11000                 # MiG-29A (Jane's)
empty_cg = [9.262, 0.0, -0.350]
# no published inertia: radii of gyration of the class (F-16 and F-15)
gyration = [0.255, 0.405, 0.520]
[[mass.payload]]
name = "pilot"
mass = 100
position = [4.700, 0.0, 0.650]
[[mass.payload]]
name = "gun ammunition"       # GSh-30-1, 150 rounds
mass = 70
position = [6.762, -1.200, 0.000]
[[mass.tank]]
name = "fuselage 1"           # internal fuel, 3,500 kg
position = [7.562, 0.0, -0.100]
capacity = 1200
[[mass.tank]]
name = "fuselage 2"
position = [9.562, 0.0, -0.100]
capacity = 1400
[[mass.tank]]
name = "fuselage 3"
position = [11.562, 0.0, -0.050]
capacity = 900

[dimensions]                  # published, overall, gear down (Mikoyan):
length = 17.32                 # m
span = 11.36
height = 4.73

[targets]
# MiG-29A, published
max_mach = 2.25               # at 11 km, full afterburner
max_mach_altitude_ft = 36000
max_speed_ktas = 810          # 1,500 km/h at sea level
climb_rate_fpm = 65000        # 330 m/s
service_ceiling_ft = 59000    # 18 km
