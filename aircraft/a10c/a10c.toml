[[engine]]
name = "TF34-GE-100A"
type = "turbofan"
mirror = true
thrust_dry_kn = 40.32         # 9,065 lbf (GE Aviation)
bypass_ratio = 6.2            # the CF34-3's 6.2 (its civil derivative; estimate for the TF34)
tsfc_dry = 0.371              # lb/(lbf h) (GE Aviation)
throttle_ratio = 1.05         # estimate
design_mach = 0.6
position = [11.300, 1.580, 1.160]
mass = 653                    # 1,440 lb dry (GE Aviation)
inlet_x = 9.68
[engine.nozzle]
position = [13.050, 1.580, 1.160]
diameter = 1.000              # the fan's exhaust (estimate: the three-view)
length = 0.300

# The gear where the three-view has its wheels: the main axles 8.28 m and the
# nose axle 3.12 m behind the muzzle, the published 5.25 m track. The nose
# wheel stands right of the centre line, where the gun's barrel is (Wikipedia):
# 0.22 m here, the drawing's 0.36 m leaving the model no room for the bay's
# right-hand door. Tyres
# 36x11 and 24x7.7 (estimate). Every leg folds forward, the main wheels half
# out of their pods, in open wells without doors (Wikipedia).
[[gear]]
name = "Nose Gear"
position = [3.120, 0.220, -2.030]
steerable = true
max_steer = 60
wheel_diameter = 0.610
wheel_width = 0.195
retractable = true
retract = "forward"
static_deflection = 0.09
attach = [3.600, 0.220, -0.350]

[[gear]]
name = "Main Gear"
mirror = true
position = [8.280, 2.625, -2.030]
wheel_diameter = 0.914
wheel_width = 0.280
retractable = true
retract = "forward"
retract_axis = [0.0, 1.0, 0.0]
retract_deg = 96
wheel_turn = 0
doors = false
static_deflection = 0.09
attach = [7.930, 2.625, -0.400]

# Direct controls: the A-10 flies through hydraulic boosters, with a
# mechanical manual reversion, and a stability augmentation system - its yaw
# damper modelled, its pitch damper not. Its limit load factor, 7.33 g,
# sizes the structure (Raymer's weights).
[flight_control]
type = "direct"
n_max = 7.33
yaw_damper = true

[mass]
empty = 11321                 # 24,959 lb (Wikipedia, A-10C)
empty_cg = [8.090, 0.0, 0.250]  # estimate: placed from the neutral point (see the checks)
[[mass.item]]
name = "GAU-8/A and its drum"  # the gun 281 kg, its drum and feed (estimate: the 1,830 kg loaded system less its rounds)
mass = 980
position = [4.000, -0.050, -0.150]
[[mass.item]]
name = "titanium cockpit tub"  # 1,200 lb of armour
mass = 544
position = [2.900, 0.0, 0.300]
[[mass.payload]]
name = "pilot"
mass = 100
position = [2.900, 0.0, 0.600]
[[mass.payload]]
name = "gun ammunition"       # 1,174 rounds of 30 mm, 0.7 kg each (estimate)
mass = 820
position = [4.600, 0.0, -0.100]
[[mass.tank]]
name = "forward main"          # 11,000 lb internal (Wikipedia); the split is an estimate
position = [6.300, 0.0, 0.450]
capacity = 1700
[[mass.tank]]
name = "aft main"
position = [8.600, 0.0, 0.550]
capacity = 1700
[[mass.tank]]
name = "left wing"
position = [7.900, -1.800, 0.050]
capacity = 795
[[mass.tank]]
name = "right wing"
position = [7.900, 1.800, 0.050]
capacity = 795

[dimensions]                  # published (USAF; Wikipedia): overall, gear down
length = 16.26
span = 17.53
height = 4.47

[targets]
# A-10C, clean (Wikipedia: Jenkins 1998). The top speed is published at sea
# level: calibrate fits the extra drag area to it (flown at 100 m)
max_mach = 0.576              # 381 kt
max_mach_altitude_ft = 0
max_speed_ktas = 381          # at sea level, clean
