# The hump behind the canopy, falling to the tail
[[body]]
name = "spine"
kind = "pod"
aero = false                  # part of the fuselage's top: the tables leave it out
stations = [
  { x = 8.200, w = 0.000, top = 1.000, bottom = 0.850 },
  { x = 9.000, w = 0.800, top = 1.120, bottom = 0.400, n = 2.2 },
