# Bitcraze Crazyflie 2.0 - the identified nano quadrotor:
#   LN   C. Luis, J. Le Ny, "Design of a Trajectory Tracking Controller for a Nanoquadcopter",
#        arXiv:1608.05786, 2016 - table 2.3.1 (after J. Foerster's identification, "System
#        Identification of the Crazyflie 2.0 Nano Quadrocopter", ETH Zurich, 2015): mass, arm,
#        rotor radius, inertia, C_T, C_D; eq. 2.6.1: rpm = 0.2685 PWM + 4070.3.
#   KB   J. E. Kooi, R. Babuska, "Inclined Quadrotor Landing using Deep Reinforcement Learning",
#        arXiv:2103.09043, 2021 - eq. 5: a motor's thrust answers its command as 1/(1 - 0.9695404 z^-1)
#        at 500 Hz (Foerster's identification): a lag of 64.7 ms.
#   GPD  gym-pybullet-drones (Panerati et al., MIT licence), assets/cf2x.urdf - the rotor drag and
#        the ground effect, the rotors' layout and turning senses.
#   DS   Bitcraze, "Datasheet Crazyflie 2.1", rev. 3 - 27 g (the 2.1: 29 g).
#   BC   Bitcraze store, "Crazyflie 2.0": one 240 mAh LiPo, a 7 minute flight time on it, 27 g.
# SI units. Frame: x forward, y left, z up (the sources'), from the c.g.

[aircraft]
name = "cf2"
kind = "multirotor"
category = "multirotor"
description = "Bitcraze Crazyflie 2.0 - 27 g quadrotor, brushed coreless motors (Foerster 2015)"

[mass]
mass_kg = 0.027                    # LN, DS
ixx = 1.395e-5                     # kg m2, LN
iyy = 1.436e-5
izz = 2.173e-5

[battery]
# one 240 mAh LiPo cell (BC) at 3.7 V: 0.888 Wh. Its 7 minute flight time (BC), taken as a hover's - the
# power it draws there, 7.6 W, and the rotors' physics (their power as their speed cubed) away from it
capacity_wh = 0.888
hover_endurance_min = 7.0

[rotors]
arm_m = 0.03973                    # centre to rotor, LN (d); the rotors sit on the diagonals
radius_m = 0.0231348               # LN
height_m = 0.0
# FLU corners (x, y signs) and turning sense seen from above: GPD's cf2x (0 and 2 counter-clockwise)
layout = [["front right", 1, -1, "ccw"], ["rear right", -1, -1, "cw"], ["rear left", -1, 1, "ccw"], ["front left", 1, 1, "cw"]]
thrust_n_per_rpm2 = 3.1582e-10     # C_T, LN eq. 2.3.4
torque_nm_per_rpm2 = 7.9379e-12    # C_D, LN eq. 2.3.7
max_rpm = 21666.0                  # LN eq. 2.6.1 at PWM 65535
lag_up_s = 0.0647                  # KB eq. 5: -0.002 s / ln(0.9695404)
lag_down_s = 0.0647
drag_xy = 9.1785e-7                # GPD: F = -k (sum of the rotors' rad/s) v
drag_z = 10.311e-7
ground_effect = 11.36859           # GPD: thrust gain k (r / 4h)^2 per rotor

[ground]
# it stands on its motor mounts: the feet under the rotors, the motors' length below the board (their
# springs and dampers are hangar's, sized for the platform's step)
leg_height_m = 0.018
leg_spread = 1.0
top_m = 0.001              # the battery's top: the flight model's top contact, besides the rotors' hubs

[envelope]
# the bounds of the platform's commands: design choices
bank_max_deg = 30.0
pitch_min_deg = -30.0
pitch_max_deg = 30.0
roll_rate_max_deg_s = 400.0

[targets]
hover_rpm = 14468.0                # GPD's hover rpm (its kf 3.16e-10)
thrust_to_weight = 2.25            # GPD

[model]
# What is drawn: the rotors from the flight model's own rotor data ([rotors]), their look below;
# the airframe from Bitcraze's drawing of the board from the top (the getting-started guide's
# "frontCF.png": 9.11 px/mm by its expansion headers' 2 mm pitch; its arms reach 40.0 mm from the
# centre, LN's 39.73 mm arm - the rotors' axes - at the motor mounts) and its product photograph
# for the heights: the props 6 mm above the board, the motor mounts' feet 12 mm below it (the
# flight model's legs, 18 mm under the rotors); Bitcraze's 92 x 92 x 29 mm spans the mounts
cell_m = 0.00015                   # the mesher's cell: 0.15 mm

[model.propeller]
blades = 2
chord_m = 0.0065                   # the widest, at mid-span; the plan below as fractions of it
chords = [[0.12, 0.55], [0.3, 1.0], [0.55, 1.1], [0.8, 0.95], [0.95, 0.6], [1.0, 0.35]]
airfoil = "naca4404"               # a thin cambered moulding
pitch_m = 0.017                    # Bitcraze's 47-17 propellers
root = 0.14
hub = "propeller"
hub_radius = 0.0022
colour = "#161616"
tip_fraction = 0.0

