# Dassault Rafale C, built by hangar from public data. A close-coupled
# canard delta, unstable in pitch at subsonic speeds.
#
# Frame: metres, x aft from the nose tip, y right, z up from the wing's
# root chord plane. Sources: Dassault Aviation and Jane's (dimensions,
# weights, performance); Safran (M88-2, the landing gear). The shape is
# measured off a three-view of the two-seat Rafale B whose length and span
# are Dassault's (15.27 m, 10.90 m), the gear where it draws the wheels; the
# canopy and the spine behind it off a profile of the single-seat Rafale C
# (Wikimedia Commons, RafaleCprovence.jpg), scaled nose to fin tip.

[aircraft]
name = "rafale"
description = "Dassault Rafale C (hangar build)"
category = "fighter"

[analysis]
speed = 250.0

# The wing as drawn: 45.4 m2 to the centre line (45.7 m2 published), a
# cropped delta, 45 deg leading edge, its trailing edge swept 4 deg
# forward, its chord plane 3.3 deg down to the tips. The balance is not
# published: the CG sits 10.6 % of the MAC behind the neutral point hangar
# finds, a sixth of the weight on the nose wheel; further aft full nose-down
# control would not reach far past its 29 deg limit.
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [5.860, 0.000, 0.000], chord = 7.200, airfoil = "naca64a005" },
  { le = [11.180, 5.250, -0.300], chord = 1.480, airfoil = "naca64a003" },
]
controls = [
  { name = "inner elevon", channel = "elevator", mix = { aileron = 1.0 }, span = [0.16, 0.52], chord_fraction = 0.20, limits = [-25, 25] },
  { name = "outer elevon", channel = "elevator", mix = { aileron = 1.0 }, span = [0.52, 0.94], chord_fraction = 0.24, limits = [-25, 25] },
]
# leading-edge slats, inboard and outboard, drawn as flaps turning down,
# on the angle-of-attack schedule (the F-16's law stands in)
leading = [
  { name = "inner slat", span = [0.22, 0.58], chord_fraction = 0.11, limits = [-2, 25] },
  { name = "outer slat", span = [0.58, 0.97], chord_fraction = 0.11, limits = [-2, 25] },
]

# All-moving canards, close-coupled over the intakes, 2.3 m2 exposed, 41 deg
# leading edge, 8 deg dihedral; the surface runs on inside the fuselage to
# the centre line, as the body carries their lift across
[[surface]]
name = "canard"
kind = "canard"
airfoil = "naca64a004"
sections = [
  { le = [4.090, 0.000, 0.370], chord = 2.090 },
  { le = [5.300, 1.400, 0.370], chord = 1.290 },
  { le = [6.390, 2.650, 0.540], chord = 0.560 },
]
controls = [
  { name = "canard", channel = "elevator", gain = -1.0, span = [0.53, 1.0], chord_fraction = 1.0, pivot = 0.35, limits = [-50, 20] },
]

# The fin, 55 deg leading edge, its rudder the whole trailing edge
[[surface]]
name = "fin"
kind = "fin"
airfoil = "naca64a004"
sections = [
  { le = [10.710, 0.000, 0.720], chord = 3.340 },
  { le = [13.510, 0.000, 2.750], chord = 1.450 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.05, 0.98], chord_fraction = 0.30, limits = [-30, 30] },
]

