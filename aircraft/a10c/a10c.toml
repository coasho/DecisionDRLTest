stations = [
  { x = 5.850, y = 2.650, w = 0.100, top = -0.300, bottom = -0.380, n = 2.0 },
  { x = 6.150, y = 2.650, w = 0.500, top = -0.080, bottom = -0.620, n = 2.2 },
  { x = 6.700, y = 2.650, w = 0.700, top = 0.020, bottom = -0.760, n = 2.4 },
  { x = 7.800, y = 2.650, w = 0.720, top = 0.020, bottom = -0.760, n = 2.4 },
  { x = 8.300, y = 2.650, w = 0.560, top = 0.040, bottom = -0.500, n = 2.3 },
  { x = 8.650, y = 2.650, w = 0.300, top = 0.080, bottom = -0.180, n = 2.0 },
  { x = 8.850, y = 2.650, w = 0.100, top = 0.100, bottom = 0.060, n = 2.0 },
