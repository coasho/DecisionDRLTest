# The pylons: blades from the nacelles' crowns up into the wing
[[strut]]
name = "pylon"
from = [14.300, 4.850, -0.950]
to = [14.900, 4.850, -0.380]
chord = 3.200
thickness = 0.350

# Two CFM56-7B27A: 121.4 kN (27,300 lbf), bypass ratio 5.1
[[engine]]
name = "CFM56-7B27A"
type = "turbofan"
mirror = true
thrust_dry_kn = 121.4
bypass_ratio = 5.1
tsfc_dry = 0.37               # lb/(lbf h), static (estimate)
throttle_ratio = 1.05         # Mattingly's TR for a transport's turbofan (estimate)
design_mach = 0.8
position = [13.200, 4.850, -1.780]
mass = 2600                   # installed: the 2,370 kg engine and its accessories (estimate)
inlet_x = 10.6
[engine.nozzle]
position = [15.700, 4.850, -1.780]  # the core nozzle at the nacelle's end
diameter = 0.72
length = 0.40
petal_open_deg = 0.0          # a fixed nozzle

# The gear, off the side view: the nose wheels 4.08 m behind the nose,
# folding forward; the main wheels 12.82 m behind them, 5.72 m apart (the
# 737-700's track), folding inward, their wheels stacked in the belly and
# open to it, as the 737's are (no doors over them). Tyres: 27x7.75 nose,
# 44.5x16.5 main (the 737 NG's).
[[gear]]
name = "Nose Gear"
position = [4.080, 0.0, -3.140]
steerable = true
max_steer = 60
wheels = 2
wheel_diameter = 0.690
wheel_width = 0.200
retractable = true
retract = "forward"
static_deflection = 0.10
attach = [4.080, 0.0, -1.200]

[[gear]]
name = "Main Gear"
mirror = true
position = [16.900, 2.860, -3.140]
wheels = 2
wheel_diameter = 1.130
wheel_width = 0.420
retractable = true
retract = "inward"
doors = false                 # the 737's wheels close its wells themselves
static_deflection = 0.12
attach = [16.900, 2.550, -1.100]

[flight_control]
type = "direct"               # the 737's hydraulic controls
yaw_damper = true             # the 737's own yaw damper

[mass]
empty = 46606                 # kg (Wikipedia)
mtow = 77565                  # RAAF
# Estimate: 7 % of the loaded weight on the nose wheel, as a 737 carries
# it; hangar's neutral point, 65 % of the MAC, leaves a 32 % margin there
# (likely too far aft, as it put the KC-46A's)
empty_cg = [16.000, 0.0, 0.200]
[mass.component]              # kg, estimates: a 737-700's weight fractions, the MESA's own
wing = 5800
htail = 650
fin = 450
fuselage = 7500
MESA = 2500
"top hat" = 400
"ventral fin" = 120
"wing fairing" = 400
nacelle = 900                 # both sides
"ESM pod" = 150
"Nose Gear" = 350
"Main Gear" = 2200
[[mass.payload]]
name = "flight crew"
mass = 200
position = [3.000, 0.0, 0.600]
[[mass.payload]]
name = "mission crew"
mass = 1000                   # ten at the consoles
position = [15.000, 0.0, 0.300]
# The 737-700's 26,020 l of fuel (20.9 t): the centre tank under the cabin
# floor, the main tanks in the wings (the split and where each sits,
# estimates). Flown 60 % full: 60.5 t.
[[mass.tank]]
name = "centre"
position = [15.500, 0.0, -1.250]
capacity = 10360
fill = 0.6
[[mass.tank]]
name = "left main"
position = [16.500, -7.000, -0.400]
capacity = 5267
fill = 0.6
[[mass.tank]]
name = "right main"
position = [16.500, 7.000, -0.400]
capacity = 5267
fill = 0.6

[dimensions]                  # published, overall (RAAF)
length = 33.63                # the fuselage's: the stabilizer's tips reach 1.5 m past it (the drawing)
span = 34.31
height = 12.57

[targets]
# The published 460 kt (853 km/h) has no altitude: flown at 35,000 ft,
# Mach 0.80 (estimate), under the 737's limit Mach 0.82
max_mach = 0.80
max_mach_altitude_ft = 35000
operational_ceiling_ft = 41000  # Wikipedia
