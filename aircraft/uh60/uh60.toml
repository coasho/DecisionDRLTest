# Sikorsky UH-60A Black Hawk - flown by NASA's mathematical model of it:
#   TM   K. B. Hilbert, "A Mathematical Model of the UH-60 Helicopter", NASA TM-85890, 1984 -
#        table 1 (the aircraft), table 2 (the control system's gains), table 3 (the T700s),
#        table 4 (level-flight trim, 1 to 140 kt), the fuselage's wind-tunnel regressions (p. 2-3),
#        the stabilator schedule (figure 10) and the pitch bias actuator (figure 11).
#   BASE P. D. Talbot, B. E. Tinling, W. A. Decker, R. T. N. Chen, "A Mathematical Model of a
#        Single Main Rotor Helicopter for Piloted Simulation", NASA TM-84281, 1982 - the model TM
#        revises: the stabilizer's and fin's lift and drag through 360 deg (appendix E).
# Every number is the source's unless the note says otherwise. Frame: stations (in, aft), butt
# lines (in, right), water lines (in, up). Senses here: stick + forward and + right, pedal +
# right, collective + up; cyclic + tilts the thrust forward or right. (TM-84281's longitudinal
# stick is + aft: its gains are converted and the conversion noted.)

[aircraft]
name = "uh60"
kind = "helicopter"
category = "helicopter"
description = "Sikorsky UH-60A Black Hawk - four blades, articulated, canted tail rotor, stabilator (NASA TM-85890)"

[mass]
weight_lb = 16400.0                # TM table 1
cg_in = [360.4, 0.0, 247.2]
ixx = 5629.0                       # slug ft2
iyy = 40000.0
izz = 37200.0
ixz = 1670.0

[rotor.main]
radius_ft = 26.83
chord_ft = 1.73
blades = 4
rpm = 257.83                       # 27.0 rad/s
lift_slope = 5.73
twist_deg = -18.0                  # -0.3142 rad
hinge_offset_ft = 1.25             # e = 0.04659 R
lock = 8.1936
hub_in = [341.2, 0.0, 315.0]
mast_tilt_deg = 3.0                # 0.05236 rad, forward
sense = "ccw"
# TM-73254's classical forms are for an untwisted-equivalent teetering blade; with this rotor's
# 18 deg of twist and 4.7 % hinge offset JSBSim's own forms match TM's trims (table 4) far more
# closely (docs/rotorcraft.md, the UH-60A's validation)
force_model = "heffley"
tip_loss = 1.0
inflow_lag_s = 0.1

[rotor.tail]
radius_ft = 5.5
blades = 4
solidity = 0.1875
rpm = 1190.0                       # 124.62 rad/s; gear ratio 4.62 (table 3)
lift_slope = 5.73
twist_deg = -18.0
lock = 3.3783
hub_in = [732.0, 0.0, 324.7]
thrust = "right"
cant_deg = 20.0                    # the cant K (TM p. 3-6), up and to the right
force_model = "heffley"
tip_loss = 1.0
inflow_lag_s = 0.1

[engine]
type = "turboshaft"
count = 2
power_shp = 2828.0                 # the main transmission's dual-engine rating (Wikipedia, "Sikorsky UH-60 Black Hawk"):
                                   # the two T700-GE-700s give more; TM gives no limit
# TM table 3: K_E = 1.75 HP per lb/h and the governor's K_g1 2000, K_g2 2500, K_g3 500 lb/h per
# rad/s (per rad, per rad/s^2) of rotor speed: as fractions of the power limit per rad/s, 1.2376,
# 1.5470 and 0.3094; the engine's lag 1.25 s, on the governor's correction (the rotors' load is fed forward)
governor = { kp = 1.2376, ki = 1.5470, kd = 0.3094, lag_s = 1.25 }

[controls]
travel_in = { lateral = 10.0, longitudinal = 10.0, pedal = 7.0, collective = 10.0 }   # full throw: estimates
lateral_rad_per_in = 0.02792       # CK2 (table 1)
longitudinal_rad_per_in = 0.04939  # CK1; TM's stick + aft: here forward stick tilts forward
collective_root_rad = 0.2286       # C5: the root pitch at the bottom
collective_rad_per_in = 0.02792    # C6
pedal_zero_rad = 0.1743            # C7: the tail rotor's root pitch
pedal_rad_per_in = -0.07734        # C8
flap_lag_s = 0.072                 # 16/(gamma Omega): the tip path's lag
# the mixing unit and the rate feedbacks (table 2), in this file's senses: TM's collective to
# longitudinal -0.164 and pedals to longitudinal -0.5746 are aft-positive, so + here
stabilator = "uh60"                # figure 10
pitch_bias_actuator = "uh60"       # figure 11

[controls.mixing]
collective_to_longitudinal = 0.164   # in/in
pedal_to_longitudinal = 0.5746
collective_to_lateral = -0.16
collective_to_pedal = -0.2889
pitch_rate_to_lateral = 1.3          # in per rad/s
roll_rate_to_longitudinal = 0.88

[airframe]
model = "tm85890"
fuselage_ref_in = [345.5, 234.0]
horizontal = { sta = 700.4, wl = 244.0, area_ft2 = 45.0, aspect = 4.6, cl_max = 1.03, q_ratio = 0.4, rotor_wash = 1.8 }
fin = { sta = 695.0, wl = 273.0, area_ft2 = 32.3, aspect = 1.92, sweep_rad = 0.7156, cl_max = 0.89, q_ratio = 0.651, tail_rotor_wash = 1.0 }

[ground]
# the wheels where the operator's manual draws them (TM 1-1520-237-10 fig. 1-1, below): the mains at
# station 294.2, 55.8 in out, the tail wheel 29 ft behind at 641.3; each at the drawn ground line
# (water line 184.8) less its static compression under the c.g.'s load (13,272 lb on the mains,
# 3,128 on the tail wheel, on the springs below - which are estimates)
contacts_in = [[294.2, -55.8, 183.5], [294.2, 55.8, 183.5], [641.3, 0.0, 182.9]]
kind = "wheels"
spring_lbf_per_ft = [60000.0, 60000.0, 20000.0]
damping_lbf_per_fps = [10000.0, 10000.0, 3333.0]

[envelope]
# the bounds of the platform's commands - design choices - and the aircraft's Vne
bank_max_deg = 45.0
pitch_min_deg = -30.0
pitch_max_deg = 30.0
roll_rate_max_deg_s = 60.0
cas_max_kt = 193.0                 # "Maximum is 193 Knots": TM 1-1520-237-10 ch. 5 as transcribed at
                                   # oocities.org/ericdurb/limits.htm (Vne falls with altitude, temperature, weight)

[targets]
# TM table 4: level flight trim - GENHEL's, the math model the report documents (itself checked
# against flight tests elsewhere), not flight data; this file's senses (the longitudinal stick negated)
trim_source = "GENHEL (TM-85890 table 4)"
trim = [
  { kt = 1.0,   long_in = -0.1266, lat_in = 0.2321,  coll_in = 5.719, pedal_in = -1.279,    theta_deg = 5.052,  phi_deg = -2.340 },
  { kt = 20.0,  long_in = 0.3670,  lat_in = -0.9956, coll_in = 5.361, pedal_in = -1.066,    theta_deg = 5.834,  phi_deg = -1.342 },
  { kt = 40.0,  long_in = 0.2083,  lat_in = -0.7560, coll_in = 4.580, pedal_in = -0.5830,   theta_deg = 4.340,  phi_deg = -1.005 },
  { kt = 60.0,  long_in = 0.4238,  lat_in = -0.2322, coll_in = 4.194, pedal_in = -0.5802,   theta_deg = 3.489,  phi_deg = 0.0 },
  { kt = 100.0, long_in = 1.063,   lat_in = 0.1812,  coll_in = 4.425, pedal_in = -0.2606,   theta_deg = 2.469,  phi_deg = 0.0 },
  { kt = 140.0, long_in = 1.800,   lat_in = 0.3964,  coll_in = 5.718, pedal_in = -0.005715, theta_deg = -0.2996, phi_deg = 0.0 },
]

[model]
# What is drawn beyond the airframe's shape below: the rotors' look (their size, hub, shaft,
# blades and sense are the flight model's, [rotor.main] and [rotor.tail]).

[model.main_rotor]
airfoil = "naca0010"               # the SC1095's 9.5 %, drawn symmetric
root = 0.13
pitch_75_deg = 9.0                 # drawn at a hover's pitch
precone_deg = 2.0                  # drawn coned a little, as it flies (articulated: no precone)
tip = { from = 0.93, sweep_deg = 20.0 }   # the swept tip, the outer 7 % swept back 20 deg
hub = "articulated"
hub_radius = 0.30
grip_radius = 0.10
colour = "#2b2d2c"
tip_fraction = 0.0
absorber = { above_m = 0.25, arm_m = 0.42, arm_radius_m = 0.035, weight_m = 0.085 }  # the bifilar

[model.tail_rotor]
airfoil = "naca0010"
root = 0.2
pitch_75_deg = 8.0
hub = "crossbeam"
hub_radius = 0.09
grip_radius = 0.045
colour = "#2b2d2c"
tip_fraction = 0.0
top_blade = "aft"                  # which way it turns: an assumption (no source here says)
# TM-85890 places the hub on the centre line - where its canted shaft crosses the plane of
# symmetry; the operator's manual's front view draws it 18.8 in right of it, on that shaft: drawn
# there, 20 in out along the shaft (the same line of thrust)
offset_m = 0.508

# The airframe, measured from the operator's manual's principal dimensions (TM 1-1520-237-10,
# fig. 1-1 - on Wikimedia Commons, "Sikorsky_UH-60_Black_Hawk_dimensions.png", public domain):
