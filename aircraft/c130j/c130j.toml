  { x = 1.930, w = 2.75, top = 3.920, bottom = 1.100, n_top = 2.2, n_bottom = 2.6 },
  { x = 2.820, w = 3.40, top = 4.310, bottom = 0.980, n_top = 2.3, n_bottom = 3.0 },
  { x = 3.720, w = 3.75, top = 4.490, bottom = 0.890, n_top = 2.4, n_bottom = 3.2 },
  { x = 5.000, w = 3.90, top = 4.520, bottom = 0.860, n_top = 2.4, n_bottom = 3.4 },
  { x = 17.400, w = 3.90, top = 4.520, bottom = 0.860, n_top = 2.4, n_bottom = 3.4 },
  { x = 18.900, w = 3.85, top = 4.520, bottom = 1.190, n_top = 2.4, n_bottom = 3.2 },
  { x = 20.400, w = 3.70, top = 4.520, bottom = 1.720, n_top = 2.4, n_bottom = 3.0 },
  { x = 21.900, w = 3.45, top = 4.550, bottom = 2.230, n_top = 2.4, n_bottom = 2.8 },
  { x = 23.400, w = 3.05, top = 4.600, bottom = 2.760, n_top = 2.3, n_bottom = 2.6 },
  { x = 24.900, w = 2.50, top = 4.650, bottom = 3.330, n = 2.3 },
  { x = 26.400, w = 1.85, top = 4.620, bottom = 3.870, n = 2.2 },
  { x = 27.900, w = 1.10, top = 4.550, bottom = 4.160, n = 2.1 },
  { x = 29.000, w = 0.50, top = 4.500, bottom = 4.310, n = 2.0 },
  { x = 29.790, w = 0.00, top = 4.410, bottom = 4.410 },
]

# The sponsons either side of the cargo hold's floor: the main gear's bays
[[body]]
name = "sponson"
kind = "pod"
mirror = true
stations = [
  { x = 9.200, y = 1.650, w = 0.50, top = 1.900, bottom = 1.400, n = 2.0 },
  { x = 10.200, y = 1.700, w = 1.00, top = 2.550, bottom = 0.880, n = 2.4 },
  { x = 16.000, y = 1.700, w = 1.10, top = 2.550, bottom = 0.880, n = 2.6 },
  { x = 17.700, y = 1.650, w = 0.70, top = 2.100, bottom = 1.400, n = 2.0 },
]

# The nacelles: the spinner (the propeller's hub, 1 m across), the engine
# under the wing, the exhaust fairing behind it
[[body]]
name = "inboard nacelle"
kind = "nacelle"
mirror = true
stations = [
  { x = 8.250, y = 5.080, w = 0.00, top = 3.950, bottom = 3.950 },
  { x = 8.600, y = 5.080, w = 0.70, top = 4.300, bottom = 3.600, n = 2.0 },
  { x = 9.200, y = 5.080, w = 1.00, top = 4.450, bottom = 3.450, n = 2.0 },
  { x = 10.000, y = 5.080, w = 1.10, top = 4.700, bottom = 3.300, n = 2.4 },
  { x = 13.000, y = 5.080, w = 1.10, top = 4.800, bottom = 3.350, n = 2.4 },
  { x = 15.500, y = 5.080, w = 0.80, top = 4.800, bottom = 3.900, n = 2.2 },
  { x = 16.800, y = 5.080, w = 0.30, top = 4.800, bottom = 4.500, n = 2.0 },
]

[[body]]
