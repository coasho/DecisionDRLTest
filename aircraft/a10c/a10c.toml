  { x = 0.70, w = 0.82, top = 0.660, bottom = -0.400, n = 2.2 },
  { x = 1.10, w = 1.00, top = 0.840, bottom = -0.520, n_top = 2.4, n_bottom = 3.0 },
  { x = 1.70, w = 1.16, top = 0.960, bottom = -0.600, n_top = 2.6, n_bottom = 3.6 },
  { x = 2.60, w = 1.28, top = 1.120, bottom = -0.630, n_top = 2.8, n_bottom = 4.0 },
  { x = 3.60, w = 1.32, top = 1.200, bottom = -0.630, n_top = 3.0, n_bottom = 4.0 },
  { x = 5.00, w = 1.36, top = 1.240, bottom = -0.600, n_top = 3.0, n_bottom = 3.6 },
  { x = 6.30, w = 1.38, top = 1.240, bottom = -0.540, n = 3.0 },
  { x = 7.80, w = 1.36, top = 1.210, bottom = -0.400, n = 3.0 },
  { x = 9.50, w = 1.18, top = 1.170, bottom = -0.200, n = 2.8 },
  { x = 11.30, w = 1.00, top = 1.100, bottom = 0.000, n = 2.6 },
  { x = 13.20, w = 0.80, top = 1.000, bottom = 0.160, n = 2.4 },
  { x = 14.60, w = 0.62, top = 0.880, bottom = 0.260, n = 2.3 },
  { x = 15.70, w = 0.38, top = 0.740, bottom = 0.320, n = 2.2 },
  { x = 16.26, w = 0.10, top = 0.520, bottom = 0.440, n = 2.0 },
