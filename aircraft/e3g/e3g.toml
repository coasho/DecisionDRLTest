  { x = 30.200, w = 9.140, top = 7.095, bottom = 5.265 },
  { x = 31.343, w = 8.850, top = 7.116, bottom = 5.344 },
  { x = 32.485, w = 7.915, top = 7.072, bottom = 5.487 },
  { x = 33.627, w = 6.046, top = 6.935, bottom = 5.724 },
  { x = 34.313, w = 3.984, top = 6.758, bottom = 5.961 },
  { x = 34.633, w = 2.222, top = 6.596, bottom = 6.151 },
  { x = 34.770, w = 0.000, top = 6.380, bottom = 6.380 },
]

# The fin's dorsal fillet, along the spine into its leading edge
[[body]]
name = "dorsal fillet"
kind = "pod"
aero = false                  # the fin's area counts it
stations = [
  { x = 35.20, w = 0.100, top = 1.880, bottom = 1.800, n = 2.0 },
  { x = 37.00, w = 0.300, top = 2.150, bottom = 1.600, n = 2.2 },
  { x = 38.60, w = 0.420, top = 2.800, bottom = 1.600, n = 2.4 },
  { x = 39.60, w = 0.400, top = 3.400, bottom = 1.600, n = 2.4 },
]

# The HF antenna probe ahead of the fin's tip: 18 cm across (a little thick,
# for the mesher), its aft end in the fin
[[body]]
name = "fin probe"
kind = "pod"
aero = false
stations = [
  { x = 40.50, w = 0.000, top = 9.170, bottom = 9.170 },
  { x = 40.60, w = 0.120, top = 9.230, bottom = 9.110, n = 2.0 },
  { x = 40.80, w = 0.180, top = 9.260, bottom = 9.080, n = 2.0 },
  { x = 45.00, w = 0.180, top = 9.260, bottom = 9.080, n = 2.0 },
]

# Nacelles: the TF33's short fan cowl (1.84 m across) with the fan's exhaust
# at its end, the core cowl running on to the core nozzle; 5.2 m long, the
# inlets 3.8 m ahead of the wing's leading edge (the four-view), the axes 1.25
# m below it (estimate from photographs).
[[intake]]
name = "inboard nacelle"
mirror = true
lip = 0.06
duct = 1.2
duct_taper = 0.85
stations = [
  { x = 15.80, y = 9.150, w = 1.520, top = -0.370, bottom = -1.890 },
  { x = 16.30, y = 9.150, w = 1.780, top = -0.240, bottom = -2.020 },
  { x = 17.00, y = 9.150, w = 1.840, top = -0.210, bottom = -2.050 },
  { x = 17.80, y = 9.150, w = 1.800, top = -0.230, bottom = -2.030 },
  { x = 18.50, y = 9.150, w = 1.620, top = -0.320, bottom = -1.940 },
  { x = 18.80, y = 9.150, w = 1.300, top = -0.480, bottom = -1.780 },
  { x = 20.00, y = 9.150, w = 1.160, top = -0.550, bottom = -1.710 },
  { x = 21.00, y = 9.150, w = 0.980, top = -0.640, bottom = -1.620 },
]

[[intake]]
name = "outboard nacelle"
mirror = true
