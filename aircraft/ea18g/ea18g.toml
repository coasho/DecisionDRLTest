# Boeing EA-18G Growler, built by hangar from public data: the two-seat
# F/A-18F Super Hornet airframe with the electronic-attack equipment - the
# ALQ-218 receiver pods on the wing tips in place of the missile rails, and
# the typical three-pod jamming load (two ALQ-99 pods on the mid-board wing
# pylons, one on the centre line) carried on every flight: its drag, weight
# and inertia are in every number below.
#
# Frame: metres, x aft from the radome tip, y right, z up from the wing's
# chord plane. Sources: US Navy / USNA fact sheets and Wikipedia's EA-18G and
# F/A-18E/F articles (dimensions, weights, fuel, engines, performance);
# NASA's Abrupt Wing Stall papers (the 8 % F/A-18E model: wing area 500 ft2,
# span 41.75 ft, MAC 13.1 ft); Flight International (the E/F against the C:
# 34 in longer, a 25 % larger wing, a 36 % larger stabilator, 15 % larger
# fins, a 34 % larger LEX); General Electric (F414-GE-400). The shape is
# measured off a public F/A-18F four-view (the-blueprints.com) scaled by the
# published 18.31 m length: its 4.9 m height and 7.1 m tail span agree with
# the published ones, its wing's 29.4 deg leading edge with NASA's.

[aircraft]
name = "ea18g"
description = "Boeing EA-18G Growler, three jamming pods (hangar build)"
category = "fighter"

[analysis]
speed = 230.0                # m/s: the Reynolds numbers

# The wing as drawn: 29.4 deg leading edge inboard of the fold, the snag
# (dog-tooth) at the fold, 30.6 deg outboard; the trailing edge swept 3 deg
# forward. Root chord 5.59 m at the centre line, 1.85 m at the tip: 46.2 m2
# (published 46.45) and a 4.0 m MAC (NASA's 13.1 ft). NACA 65A sections,
# thicker than the C's (6 % root, 4 % tip: estimate). 1.1 deg anhedral.
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [8.130, 0.000, 0.000], chord = 5.590, airfoil = "naca65a006" },
  { le = [10.731, 4.620, -0.088], chord = 2.724, airfoil = "naca65a005" },
  { le = [10.594, 4.720, -0.090], chord = 2.856, airfoil = "naca65a005" },
  { le = [11.507, 6.270, -0.120], chord = 1.854, airfoil = "naca65a004" },
]
controls = [
  # ailerons on the folding outer panel, +/-25 deg; single-slotted flaps
  # inboard of the fold, 40 deg down (NATOPS figures via VRS)
  { name = "aileron", channel = "aileron", span = [0.753, 0.970], chord_fraction = 0.30, limits = [-25, 25] },
  { name = "flap", channel = "flap", span = [0.215, 0.737], chord_fraction = 0.30, limits = [0, 40] },
]
# leading-edge flaps either side of the snag, 34 deg down (the F-16's
# schedule stands in for the Super Hornet's)
leading = [
  { name = "leading-edge flap", span = [0.297, 0.737], chord_fraction = 0.17, limits = [-5, 34] },
  { name = "outer leading-edge flap", span = [0.753, 0.975], chord_fraction = 0.17, limits = [-5, 34] },
]

# The leading-edge extensions as drawn: sharp, an ogee edge from beside the
# front cockpit (x 4.6 m) swept 64 deg at first and 82 deg where it meets the
# wing's leading edge at 1.87 m. The part inside the fuselage carries the
# LEX's lift across, as the wing's does.
[[surface]]
name = "lex"
kind = "strake"
airfoil = "plate"
sections = [
  { le = [4.600, 0.000, 0.060], chord = 3.530 },
  { le = [4.600, 0.570, 0.060], chord = 3.851 },
  { le = [5.490, 1.010, 0.050], chord = 3.209 },
  { le = [6.590, 1.400, 0.040], chord = 2.328 },
  { le = [7.690, 1.680, 0.020], chord = 1.386 },
  { le = [9.100, 1.865, 0.000], chord = 0.080 },
]

# All-moving stabilators as drawn: 45.7 deg leading edge, the tip's aft corner
# cut off, 7.12 m span (VRS/NATOPS: 23.3 ft), 10.9 m2 exposed (the C's 8.2 m2
# and 36 % more). The surface runs on inside the fuselage to the centre line.
# 24 deg trailing edge up, 20 down; differential for roll, as the C's.
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca65a004"
sections = [
  { le = [13.340, 0.000, -0.450], chord = 3.270 },
  { le = [14.360, 1.000, -0.450], chord = 2.790 },
  { le = [16.530, 3.120, -0.485], chord = 1.770 },
  { le = [16.980, 3.560, -0.500], chord = 1.040 },
]
controls = [
  { name = "stabilator", channel = "elevator", mix = { aileron = 0.4 }, span = [0.281, 1.0], chord_fraction = 1.0, pivot = 0.35, limits = [-24, 20] },
]

# Twin fins canted 21 deg outboard (the front view), 42 deg leading edge;
# 5.2 m2 each as drawn (the C's and 15 % more); rudders 40 deg either way
[[surface]]
name = "fin"
kind = "fin"
mirror = true
airfoil = "naca65a004"
sections = [
  { le = [12.900, 1.020, 0.300], chord = 3.050 },
  { le = [15.000, 1.960, 2.540], chord = 1.220 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.06, 0.80], chord_fraction = 0.30, limits = [-40, 40] },
]

# Fuselage: the F/A-18F's forward fuselage (the C/D's, unchanged) with the
# nose drooping to the radome's tip; wide and flat-topped under the LEX and
# the wing root, over the intake ducts and the engine bays; the centre-line
# belly between the ducts
