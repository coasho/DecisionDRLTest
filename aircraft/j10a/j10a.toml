  { x = 1.50, w = 0.98, top = 1.110, bottom = 0.250, n = 2.1 },
  { x = 2.00, w = 1.08, top = 1.190, bottom = 0.250, n = 2.2 },
  { x = 3.00, w = 1.22, top = 1.250, bottom = 0.260, n = 2.3 },
  { x = 4.00, w = 1.32, top = 1.300, bottom = 0.200, chine = 0.650, n_top = 2.2, n_bottom = 2.6 },
  { x = 5.00, w = 1.42, top = 1.500, bottom = 0.100, chine = 0.650, n_top = 2.2, n_bottom = 2.8 },
  { x = 6.00, w = 1.50, top = 1.600, bottom = 0.000, chine = 0.650, n_top = 2.2, n_bottom = 3.0 },
  { x = 7.00, w = 1.52, top = 1.550, bottom = -0.050, chine = 0.650, n_top = 2.2, n_bottom = 3.0 },
  { x = 8.00, w = 1.52, top = 1.420, bottom = -0.050, chine = 0.650, n_top = 2.2, n_bottom = 3.0 },
  { x = 9.00, w = 1.52, top = 1.310, bottom = -0.050, chine = 0.600, n_top = 2.2, n_bottom = 3.0 },
  { x = 10.00, w = 1.50, top = 1.280, bottom = -0.050, chine = 0.600, n_top = 2.2, n_bottom = 3.0 },
  { x = 11.00, w = 1.48, top = 1.270, bottom = -0.100, chine = 0.600, n_top = 2.2, n_bottom = 3.0 },
  { x = 12.00, w = 1.46, top = 1.260, bottom = -0.200, chine = 0.600, n_top = 2.2, n_bottom = 3.0 },
  { x = 13.00, w = 1.44, top = 1.240, bottom = -0.200, chine = 0.600, n_top = 2.2, n_bottom = 2.8 },
  { x = 14.00, w = 1.40, top = 1.200, bottom = 0.100, n = 2.6 },
  { x = 14.40, w = 1.30, top = 1.160, bottom = 0.140, n = 2.4 },
  { x = 15.00, w = 0.95, top = 0.980, bottom = 0.180, n = 2.2 },
]

# The chin intake: a rounded box on a splitter plate under the nose, its
# mouth raked back from the top lip, the duct's fairing running aft under
# the belly
[[intake]]
name = "intake"
lip = 0.04
rake = 52
duct = 1.4
duct_rise = 0.3
duct_taper = 0.9
stations = [
  { x = 3.470, w = 1.300, top = 0.300, bottom = -0.330, n_top = 6.0, n_bottom = 4.0 },
  { x = 4.500, w = 1.340, top = 0.300, bottom = -0.370, n_top = 6.0, n_bottom = 4.0 },
  { x = 7.000, w = 1.400, top = 0.300, bottom = -0.370, n_top = 6.0, n_bottom = 4.0 },
  { x = 10.00, w = 1.360, top = 0.200, bottom = -0.370, n_top = 5.0, n_bottom = 3.6 },
  { x = 12.50, w = 1.200, top = 0.100, bottom = -0.370, n_top = 4.0, n_bottom = 3.2 },
  { x = 13.30, w = 0.900, top = 0.100, bottom = -0.200, n = 3.0 },
]

# The fairings either side of the engine behind the wing's roots, carrying
# the ventral fins
[[body]]
name = "tail fairing"
kind = "pod"
mirror = true
aero = false
stations = [
  { x = 11.800, y = 0.900, w = 0.000, top = 0.020, bottom = -0.040 },
  { x = 12.500, y = 0.900, w = 0.360, top = 0.130, bottom = -0.150, n = 2.6 },
