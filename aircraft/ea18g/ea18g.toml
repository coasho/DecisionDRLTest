# The jamming load: ALQ-99 tactical jamming pods (the NGJ-MB pods that
# replace them are about the size: 14 ft, 1,200 lb) - 4.7 m long (against the
# AGM-88 beside it in photographs: estimate), 0.62 m across, the ram-air
# turbine's hub at the nose. Two on the mid-board wing pylons (stations 3
# and 9, 3.6 m out), one on the centre line (station 6) - hung 0.23 m lower
# than the drawing's pylon puts it (0.29 m off the ground), clear of the
# main gear's bays, which hollow the airframe above it.
[[body]]
name = "ALQ-99 pod"
kind = "pod"
