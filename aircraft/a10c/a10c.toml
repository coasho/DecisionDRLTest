# Fairchild Republic A-10C Thunderbolt II, built by hangar from public data:
# the USAF's close-air-support aircraft - a straight, thick wing, two
# high-bypass turbofans in pods high on the aft fuselage, twin fins at the
# tips of the tailplane, the main wheels in pods on the wing's leading edge
# and the GAU-8/A cannon in the nose.
#
# Frame: metres, x aft from the gun's muzzle (the front of the published
# length), y right, z up from the wing root's chord plane. Sources: USAF fact
# sheet and Wikipedia's specification (Jenkins, "Fairchild-Republic A/OA-10
# Warthog", 1998; T.O. 1A-10C-1): length 16.26 m, span 17.53 m, height
# 4.47 m, wing area 47.0 m2, NACA 6716 root and 6713 tip sections, empty
# 11,321 kg, internal fuel 4,990 kg, 381 kt at sea level clean, 6,000 ft/min;
# GE Aviation's TF34-GE-100A data sheet. The shape and the gear are measured
# off Kaboldy's three-view (Wikimedia Commons, CC BY-SA 3.0), scaled by the
# published length and span; its height (4.50 m) and tailplane span (5.74 m,
# the published 18 ft 10 in) agree. Numbers marked "estimate" are not
# published.

[aircraft]
name = "a10c"
description = "Fairchild Republic A-10C Thunderbolt II (hangar build)"
category = "attack"

[analysis]
speed = 150.0                # m/s: the Reynolds numbers (a low-level cruise)
max_mach = 0.9               # subsonic: Mach factors to 0.9 (its never-exceed speed is 450 kt)

# The NACA 6716 and 6713's maximum lift: 1.8 at these Reynolds numbers
# (estimate: NACA's 4-digit sections of 4-6 % camber reach 1.6-1.8 at 6
# million, Abbott & von Doenhoff; hangar's trend gives these thick, highly
# cambered sections 2.2, the aircraft 2.1)
[analysis.airfoil.naca6716]
clmax = 1.8
[analysis.airfoil.naca6713]
clmax = 1.8

# The wing: a constant-chord centre section to the gear pods (3.06 m chord,
# no dihedral), tapered outer panels with 7 deg of dihedral (estimate: the
# three-view's front view gives 6.5 deg along the chord line), their leading
# edge swept 6 deg and the trailing edge 4 deg forward (three-view), and the
# drooped (Hoerner) tips, whose outer skin is the published 17.53 m span:
# 46.8 m2 (published 47.0), MAC 2.71 m (published mean chord 8 ft 11.3 in,
# 2.72 m). NACA 6716 at the root, 6713 at the tip - the four-digit sections
# NASA tested for it (Bingham & Noonan, NASA TM X-2623, 1974): 6 % camber at
# 70 % chord. Incidence and washout are estimates.
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [6.930, 0.000, 0.000], chord = 3.060, twist = 0.0, airfoil = "naca6716" },
  { le = [7.020, 2.990, 0.000], chord = 2.970, twist = 0.0, airfoil = "naca6716" },
  { le = [7.587, 8.500, 0.677], chord = 2.071, twist = -2.0, airfoil = "naca6713" },
  { le = [7.930, 8.620, 0.500], chord = 1.660, twist = -2.0, airfoil = "naca6713" },
]
controls = [
  # single-slotted flaps from the fuselage to the ailerons, behind the gear
  # pods (three-view); 20 deg for landing (estimate)
  { name = "flap", channel = "flap", kind = "slotted", span = [0.081, 0.566], chord_fraction = 0.30, limits = [0, 20] },
  # the ailerons: "almost 50 percent of the wingspan" (Wikipedia), split into
  # decelerons (the split, the speed brake, is not modelled); travel estimate
  { name = "aileron", channel = "aileron", span = [0.571, 0.970], chord_fraction = 0.30, limits = [-25, 25] },
]
# the inboard leading-edge slats, between the fuselage and the gear pods:
# they open at high angle of attack to keep the engines' air clean (moved in
# the 3D model; the tables stand for the wing as it flies): out from 10 to 15
# deg angle of attack (estimate)
leading = [
  { name = "slat", span = [0.091, 0.251], chord_fraction = 0.12, limits = [0, 20], schedule = [4.0, 0.0, -40.0] },
]

# The tailplane: a rectangle 2.01 m in chord and 5.74 m across (published
# 18 ft 10 in), on the tail cone; the elevators along its whole trailing edge
# outboard of the fuselage. The surface runs on inside the fuselage to the
# centre line. Section and travel: estimates.
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca0012"
sections = [
  { le = [14.020, 0.000, 0.350], chord = 2.010 },
  { le = [14.020, 2.870, 0.350], chord = 2.010 },
]
controls = [
  { name = "elevator", channel = "elevator", span = [0.12, 1.0], chord_fraction = 0.33, limits = [-30, 20] },
]

# The twin fins at the tailplane's tips, 3.03 m tall from 0.8 m below it,
# 2.10 m root chord, 0.97 m tip chord; the rudders along their trailing
# edges (three-view). Section and travel: estimates.
[[surface]]
name = "fin"
kind = "fin"
mirror = true
airfoil = "naca0010"
sections = [
  { le = [13.930, 2.870, -0.460], chord = 2.100 },
  { le = [14.280, 2.870, 2.570], chord = 0.970 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.05, 0.95], chord_fraction = 0.35, limits = [-20, 20] },
]

# Fuselage: the blunt nose over the gun, the cockpit on its armoured tub,
# slab-sided and flat-bellied, tapering to the tail cone behind the
# tailplane (three-view: side and plan views).
