# Sukhoi Su-57 (T-50), built by hangar from published dimensions and public
# estimates. The thrust-vectoring nozzles are not modelled yet: its angle of
# attack is held to the 26 deg its aerodynamic controls can hold. Its
# leading-edge vortex controllers (LEVCONs) are fixed strakes here.
#
# Frame: metres, x aft from the nose tip, y right, z up from the wing's chord
# plane. Sources: United Aircraft Corporation and public reference works
# (dimensions, weights, performance); Saturn (AL-41F1). The shape is measured
# off a three-view; the gear's layout as published (twin nose wheels folding
# aft under the cockpit floor, the mains into the intakes' sides), its
# positions estimated.

[aircraft]
name = "su57"
description = "Sukhoi Su-57 (hangar build, from public data and estimates)"
category = "fighter"

[analysis]
speed = 260.0

# The wing: 78.8 m2 published, span 14.10 m, 49 deg leading edge outboard
# of the LEVCONs, its trailing edge swept forward 10 deg (82 m2 to the centre
# line as drawn), no dihedral. The CG sits 5 % of the MAC ahead of the
# neutral point hangar finds: without the thrust vectoring the stabilators
# alone hold the nose down against the LEVCONs' lift at high angles of
# attack.
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [7.400, 0.000, 0.000], chord = 9.500, airfoil = "naca64a005" },
  { le = [10.110, 3.140, 0.000], chord = 6.610, airfoil = "naca64a004" },
  { le = [14.570, 7.050, 0.000], chord = 1.450, airfoil = "naca64a003" },
]
controls = [
  { name = "aileron", channel = "aileron", span = [0.70, 0.95], chord_fraction = 0.26, limits = [-25, 25] },
  { name = "flaperon", channel = "aileron", mix = { flap = 1.0 }, span = [0.30, 0.70], chord_fraction = 0.20, limits = [-25, 25] },
]
# leading-edge flaps outboard of the root extension, scheduled with angle
# of attack (the F-16's law stands in)
leading = [
  { name = "leading-edge flap", span = [0.29, 0.97], chord_fraction = 0.12, limits = [-2, 30] },
]

# The leading-edge vortex controllers: the root extensions' outer parts,
# turning down about their rear edge with angle of attack
[[surface]]
name = "levcon"
kind = "strake"
airfoil = "plate"
sections = [
  { le = [5.800, 0.900, 0.050], chord = 4.400 },
  { le = [8.000, 2.580, 0.030], chord = 2.000 },
  { le = [10.000, 3.140, 0.000], chord = 0.100 },
]
leading = [
  { name = "levcon", span = [0.10, 0.98], chord_fraction = 1.0, limits = [-5, 25] },
]

# All-moving horizontal tails on the tail booms, 49 deg leading edge; the
# surface runs on inside the nacelles and the centre body to the centre line,
# as the body carries the tail's lift across
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca64a004"
sections = [
  { le = [13.990, 0.000, -0.050], chord = 4.000 },
  { le = [14.560, 2.000, -0.050], chord = 3.440 },
  { le = [14.900, 2.300, -0.050], chord = 4.350 },
  { le = [17.390, 4.500, -0.050], chord = 1.650 },
  { le = [18.010, 5.050, -0.050], chord = 0.600 },
]
controls = [
  { name = "stabilator", channel = "elevator", mix = { aileron = 0.3 }, span = [0.45, 1.0], chord_fraction = 1.0, pivot = 0.35, limits = [-25, 25] },
]

# Twin all-moving vertical tails canted 25 deg outboard, their trailing
# edges swept forward
[[surface]]
name = "fin"
kind = "fin"
mirror = true
airfoil = "naca64a004"
sections = [
  { le = [14.700, 2.450, 0.550], chord = 3.050 },
  { le = [16.490, 3.330, 2.360], chord = 0.640 },
]
controls = [
  { name = "fin", channel = "rudder", span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.40, limits = [-20, 20] },
]

[[body]]
name = "fuselage"
kind = "fuselage"
stations = [
  { x = 0.00, w = 0.00, top = -0.105, bottom = -0.145 },
  { x = 0.50, w = 0.34, top = 0.085, bottom = -0.335, chine = -0.150, n_top = 1.9, n_bottom = 1.9 },
  { x = 1.00, w = 0.72, top = 0.215, bottom = -0.445, chine = -0.170, n_top = 1.9, n_bottom = 1.9 },
  { x = 1.50, w = 0.98, top = 0.355, bottom = -0.535, chine = -0.180, n_top = 2.0, n_bottom = 2.0 },
  { x = 2.00, w = 1.22, top = 0.485, bottom = -0.585, chine = -0.180, n_top = 2.0, n_bottom = 2.1 },
  { x = 2.50, w = 1.38, top = 0.560, bottom = -0.585, chine = -0.170, n_top = 2.1, n_bottom = 2.2 },
  { x = 3.00, w = 1.52, top = 0.620, bottom = -0.585, chine = -0.160, n_top = 2.1, n_bottom = 2.3 },
  { x = 4.00, w = 1.72, top = 0.700, bottom = -0.570, chine = -0.140, n_top = 2.2, n_bottom = 2.4 },
  { x = 5.00, w = 1.86, top = 0.760, bottom = -0.560, chine = -0.120, n_top = 2.2, n_bottom = 2.5 },
  { x = 6.00, w = 1.98, top = 0.880, bottom = -0.550, chine = -0.100, n_top = 2.2, n_bottom = 2.6 },
  { x = 7.00, w = 2.20, top = 1.000, bottom = -0.540, chine = -0.080, n_top = 2.1, n_bottom = 2.8 },
  { x = 8.00, w = 2.30, top = 0.905, bottom = -0.540, chine = -0.050, n_top = 2.1, n_bottom = 3.0 },
  { x = 9.00, w = 3.00, top = 0.785, bottom = -0.570, chine = 0.000, n_top = 2.6, n_bottom = 2.6 },
  { x = 10.00, w = 3.60, top = 0.690, bottom = -0.600, chine = 0.000, n_top = 3.0, n_bottom = 2.4 },
  { x = 12.00, w = 3.80, top = 0.640, bottom = -0.600, chine = 0.000, n_top = 3.2, n_bottom = 2.4 },
