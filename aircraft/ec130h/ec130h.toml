# The Compass Call antennas (estimates from photographs): a pod under each
# outer wing, outboard of the outboard engine; a blister either side of the
# aft fuselage; the spur array's two struts, raked down and aft under the
# tail, carrying its wires (not drawn). Their drag is in the calibration's.
[[body]]
name = "wing pod"
kind = "pod"
mirror = true
aero = false
stations = [
  { x = 11.600, y = 14.600, w = 0.20, top = 4.550, bottom = 4.350, n = 2.0 },
  { x = 12.200, y = 14.600, w = 0.62, top = 4.760, bottom = 4.140, n = 2.0 },
  { x = 14.600, y = 14.600, w = 0.62, top = 4.760, bottom = 4.140, n = 2.0 },
  { x = 15.300, y = 14.600, w = 0.20, top = 4.550, bottom = 4.350, n = 2.0 },
]

