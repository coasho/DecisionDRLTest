# Two D-30KP-2: 117.68 kN (12,000 kgf), bypass ratio 2.24, no afterburner
[[engine]]
name = "D-30KP-2"
type = "turbofan"
mirror = true
thrust_dry_kn = 117.68
bypass_ratio = 2.24
tsfc_dry = 0.49               # lb/(lbf h), static (estimate; 0.715 in cruise, Wikipedia)
throttle_ratio = 1.05         # Mattingly's TR for a transport's turbofan (estimate)
design_mach = 0.8
position = [15.000, 1.870, 0.000]
mass = 2800                   # installed: the 2,640 kg engine and its accessories (estimate)
inlet_x = 9.0
[engine.nozzle]
position = [21.000, 1.980, 0.000]  # the mixed nozzle at the nacelle's end
diameter = 0.95
length = 0.40
petal_open_deg = 0.0          # a fixed nozzle

# The gear, off the drawing: a twin nose wheel 6.73 m behind the nose,
# folding aft into the fuselage; four-wheel bogies 10.77 m behind it, 9.80 m
# apart, their axles 1.17 m apart, 1.05 m wheels. The main legs fold aft into
# the gondolas, each bogie turning over on its pivot to lie on its back in
# the gondola, as the Tu-16's do; raked 27 deg, a leg lies level after a 66
# deg swing (estimate). The ground is where the published height puts
# it: the fin's tip, 6.85 m above the centre line, 10.36 m above the ground
# with the struts compressed.
[[gear]]
name = "Nose Gear"
position = [6.730, 0.0, -3.630]
steerable = true
max_steer = 55
wheels = 2
wheel_diameter = 0.800
wheel_width = 0.250
retractable = true
retract = "aft"
static_deflection = 0.12
attach = [6.300, 0.0, -0.800]

[[gear]]
name = "Main Gear"
mirror = true
position = [17.500, 4.900, -3.660]
wheels = 2
axles = 2                     # the four-wheel bogie
axle_spacing = 1.17
wheel_diameter = 1.050
wheel_width = 0.330
retractable = true
retract = "aft"
retract_deg = 66
bogie_deg = "over"            # the bogie somersaults as the leg folds, to lie on its back in the gondola
doors = false                 # open wells: hangar's doors wrap the tapering gondola's sides above their
                              # hinges, which swing in against the bogie (the real ones close)
static_deflection = 0.15
attach = [16.200, 4.900, -0.450]

[flight_control]
type = "direct"               # hydraulically boosted controls

[mass]
empty = 37200                 # kg (Wikipedia, H-6K; the Tu-16's)
mtow = 95000
# Estimate: placed from the neutral point the aero stage finds (44.6 % of
# the MAC), for 27 % loaded: a swept bomber's
empty_cg = [17.000, 0.0, 0.100]
[mass.component]              # kg, estimates: a jet bomber's weight fractions
wing = 8800
htail = 800
fin = 700
fuselage = 7200
"Nose Gear" = 450
"Main Gear" = 2900
"engine nacelle" = 1400       # both sides
"gear gondola" = 400
"inboard pylon" = 150
"middle pylon" = 150
"outboard pylon" = 150
[[mass.payload]]
name = "pilots"
mass = 200
position = [5.000, 0.0, 0.550]
[[mass.payload]]
name = "navigator and weapons officer"
mass = 200
position = [3.600, 0.0, -0.100]
# The Tu-16's 36,000 kg of fuel: fuselage tanks ahead of and behind the bomb
# bay, the wing's inboard and outboard tanks (the split and where each sits,
# estimates). Flown 60 % full: 59 t, a mid-mission weight.
[[mass.tank]]
name = "forward fuselage"
position = [9.500, 0.0, 0.200]
capacity = 8000
fill = 0.6
[[mass.tank]]
name = "aft fuselage"
position = [21.000, 0.0, 0.200]
capacity = 9000
fill = 0.6
[[mass.tank]]
name = "left inboard wing"
position = [14.800, -3.500, 0.150]
capacity = 5500
fill = 0.6
[[mass.tank]]
name = "right inboard wing"
position = [14.800, 3.500, 0.150]
capacity = 5500
fill = 0.6
[[mass.tank]]
name = "left outboard wing"
position = [18.700, -9.000, -0.190]
capacity = 4000
fill = 0.6
[[mass.tank]]
name = "right outboard wing"
position = [18.700, 9.000, -0.190]
capacity = 4000
fill = 0.6

[dimensions]                  # published, overall (Wikipedia, H-6K)
length = 34.80                # the fuselage's (tu22.ru: "fuselage length"): the tailplane's tips reach
                              # 1.1 m past the tail (the drawing), 35.9 m overall
span = 33.00
height = 10.36

[targets]
# Published 1,050 km/h (Wikipedia, H-6K; the Tu-16's too), at an altitude
# not given: flown at 6,000 m (Mach 0.922; estimate - where a jet of its
# thrust meets its wing's drag rise)
max_mach = 0.922
max_mach_altitude_ft = 19685
operational_ceiling_ft = 42000  # 12,800 m (Wikipedia)
