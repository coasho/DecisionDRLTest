  { x = 5.100, w = 0.30, top = 1.300, bottom = 1.200, n = 2.0 },
  { x = 5.300, w = 0.00, top = 1.250, bottom = 1.220 },
]

# The engine nacelles, high on the aft fuselage above the wing's trailing
# edge (three-view: the intakes 9.68 m behind the muzzle, 1.58 m out and
# 1.16 m up; 1.45 m across the lip, 3.4 m long)
[[intake]]
name = "nacelle"
mirror = true
lip = 0.06
duct = 0.55
duct_taper = 0.95
stations = [
  { x = 9.680, y = 1.580, w = 1.400, top = 1.860, bottom = 0.460, n = 2.0 },
  { x = 10.300, y = 1.580, w = 1.460, top = 1.890, bottom = 0.430, n = 2.0 },
  { x = 11.500, y = 1.580, w = 1.440, top = 1.880, bottom = 0.440, n = 2.0 },
  { x = 12.500, y = 1.580, w = 1.320, top = 1.820, bottom = 0.500, n = 2.0 },
  { x = 13.050, y = 1.580, w = 1.160, top = 1.740, bottom = 0.580, n = 2.0 },
]

# The pylons that hold them off the fuselage's upper sides
[[strut]]
name = "engine pylon"
from = [11.300, 0.400, 0.950]
to = [11.300, 1.000, 1.100]
chord = 2.300
thickness = 0.300

# The main gear pods under the wing's leading edge, where the wheels fold
# forward, half out of them; they fair into the wing's underside ahead of
