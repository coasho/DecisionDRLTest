# Boeing E-3G Sentry (AWACS), built by hangar from public data: the Boeing
# 707-320B airframe with four TF33-PW-100A turbofans and the AN/APY-2 radar's
# rotodome on two struts above the aft fuselage. Direct (conventional) flight
# controls with a yaw damper, as the real one has them.
#
# Frame: metres, x aft from the nose tip, y right, z up from the axis of the
# fuselage's constant section. Sources:
#  - USAF E-3 fact sheet and Wikipedia's E-3 article (its specifications):
#    span 44.42 m, length 46.61 m, height 12.60 m; empty 83,915 kg (185,000
#    lb), maximum take-off 157,397 kg (347,000 lb); 21,000 US gal of fuel; the
#    rotodome 9.1 m across, 1.8 m thick at the centre, held 3.35 m (11 ft)
#    above the fuselage by 2 struts, tilted down at the front "to reduce its
#    aerodynamic drag"; maximum speed 461 kt, service ceiling 29,000 ft
#    minimum.
#  - Jenkinson, Simpkin & Rhodes, "Civil Jet Aircraft Design" (1999), aircraft
#    data file, Boeing 707-320C: wing 283.4 m2, aspect ratio 6.96, MAC 7.36 m,
#    35 deg quarter-chord sweep, taper 0.259, 10 % mean thickness; horizontal
#    tail 58.06 m2 (aspect ratio 3.35), vertical tail 30.47 m2 (aspect ratio
#    1.70, 30 deg), tail arms 20.5 and 21.0 m; fuselage 3.76 m wide; wheelbase
#    17.98 m, track 6.73 m.
#  - Wikipedia, Boeing 707 (7 deg dihedral) and Pratt & Whitney TF33 (bypass
#    ratio 1.42, 2,089 kg dry, 3.61 m long, 1.35 m across, 0.78 lb/(lbf h) at
#    M 0.82, 35,000 ft); airforce-technology.com (21,000 lb thrust).
#  - Layout (positions only, not areas): the Boeing 707-300 four-view by
#    Julien Scavini (Wikimedia Commons, CC BY-SA 3.0, scaled by its 46.61 m
#    length and 44.42 m span) - wing root, engines at 9.15 and 15.75 m from
#    the centre line, fuselage depth 3.90 m and its nose and tail lines, the
#    gear; the E-3 line drawing on Wikimedia Commons (T. Kouwenhoven) - the
#    rotodome's centre 30.2 m behind the nose; photographs of E-3s (Wikimedia
#    Commons) - the struts, the nacelles.

[aircraft]
name = "e3g"
description = "Boeing E-3G Sentry AWACS (hangar build)"
category = "transport"

[analysis]
speed = 110.0                # m/s: the Reynolds numbers - sea-level viscosity at this speed gives
                             # the cruise Reynolds number at 29,000 ft (about 5e7 on the MAC)
max_mach = 1.2               # the tables' Mach range: through the transonic drag rise
induced_drag = "trefftz"     # a swept transport wing's induced drag from its loading (docs/hangar.md)

# Boeing's reference wing (Jenkinson): the design's own planform, with its
# inboard trailing-edge extension, has a little more area
[reference]
area = 283.4
span = 44.42
chord = 7.36
aero_point = [21.40, 0.0, 0.0]    # at the loaded CG (see [mass])

# The wing: a straight leading edge swept 38.5 deg (35 deg at the quarter
# chord of the reference trapezoid, root 10.14 m, tip 2.63 m: Jenkinson's
# taper 0.259), the trailing edge unswept inboard of 4.0 m and swept 24.6 deg
# outboard (the 707-320's inboard extension; its span estimated from photos);
# 7 deg dihedral. Sections: NACA 64A-series of 12 % at the root to 9 % at the
# tip (estimate; Boeing's own sections are not published - mean about 10 %,
# as Jenkinson gives). Twist 2 deg at the root to -1.5 at the tip (estimate).
# The root's leading edge 13.8 m behind the nose at the fuselage side (the
# four-view).
[[surface]]
name = "wing"
kind = "wing"
vortex = false                # thick, round-edged sections: they stall, no vortex regime (a fighter's thin swept wing's)
sections = [
  { le = [12.300, 0.000, -1.000], chord = 11.97, twist = 2.0, airfoil = "naca64a212" },
  { le = [15.482, 4.000, -0.509], chord = 8.79, twist = 1.5, airfoil = "naca64a211" },
  { le = [29.966, 22.210, 1.727], chord = 2.63, twist = -1.5, airfoil = "naca64a209" },
]
# double-slotted flaps inboard and outboard, the high-speed aileron between
# them behind the inboard engine, the low-speed aileron outboard (707-320
# layout; spans and chords estimated from the four-view). Spoilers are not
# modelled.
controls = [
  { name = "inboard flap", channel = "flap", kind = "fowler", span = [0.085, 0.37], chord_fraction = 0.28, limits = [0, 50] },
  { name = "inboard aileron", channel = "aileron", span = [0.37, 0.45], chord_fraction = 0.25, limits = [-20, 20] },
  { name = "outboard flap", channel = "flap", kind = "fowler", span = [0.45, 0.72], chord_fraction = 0.28, limits = [0, 50] },
  { name = "outboard aileron", channel = "aileron", span = [0.72, 0.96], chord_fraction = 0.24, limits = [-20, 20] },
]

# Horizontal tail: 58.06 m2, span 13.95 m (Jenkinson's area and aspect ratio),
# 35 deg quarter-chord sweep, taper 0.4 and 7 deg dihedral (estimates); its
# MAC's quarter chord 20.5 m behind the wing's (Jenkinson's tail arm). The
# 707 trims with its stabilizer; here the elevator and its trim do both.
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca0010"
vortex = false
sections = [
  { le = [38.030, 0.000, 0.600], chord = 5.95 },
  { le = [43.806, 6.975, 1.456], chord = 2.38 },
]
controls = [
  { name = "elevator", channel = "elevator", span = [0.14, 0.97], chord_fraction = 0.30, limits = [-25, 15] },
]

# Fin: 30.47 m2 (Jenkinson), 30 deg quarter-chord sweep, taper 0.35
# (estimate), its MAC's quarter chord 21.0 m behind the wing's; its tip 12.60 m
# above the ground (the E-3's height). The 707's HF probe on its tip.
[[surface]]
name = "fin"
kind = "fin"
airfoil = "naca0010"
sections = [
  { le = [38.800, 0.000, 1.900], chord = 6.10 },
  { le = [44.120, 0.000, 9.300], chord = 2.14 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.05, 0.95], chord_fraction = 0.30, limits = [-25, 25] },
]

# The rotodome's two struts: streamlined, 2.5 m chord, 0.35 m thick
# (estimates from photographs), side by side under the dome's centre, leaning
# in a little towards it. Lifting surfaces, so that in sideslip they carry a
# side force and their trailing vortices wash the fin - the dome's effect on
# the fin. Each reaches from the fuselage's top into the dome.
[[surface]]
name = "rotodome strut"
kind = "fin"
mirror = true
airfoil = "naca0014"
sections = [
  { le = [28.950, 1.000, 1.650], chord = 2.50 },
  { le = [28.950, 0.850, 5.800], chord = 2.50 },
]

# Fuselage: 3.76 m wide, 3.90 m deep (the upper lobe's widest line 0.2 m
# above the axis, the deeper lower lobe over the wing box), the nose and the
# upswept tail cone as the four-view draws them.
[[body]]
name = "fuselage"
kind = "fuselage"
stations = [
  { x = 0.00, w = 0.00, top = -0.670, bottom = -0.670 },
  { x = 0.30, w = 1.00, top = -0.250, bottom = -1.050, n = 2.0 },
  { x = 0.89, w = 1.98, top = 0.100, bottom = -1.350, n = 2.0 },
  { x = 1.88, w = 2.96, top = 0.780, bottom = -1.720, n = 2.0 },
  { x = 3.87, w = 3.54, top = 1.520, bottom = -1.950, chine = 0.10, n = 2.0 },
  { x = 6.35, w = 3.70, top = 1.860, bottom = -1.990, chine = 0.18, n = 2.0 },
  { x = 8.50, w = 3.76, top = 1.910, bottom = -1.990, chine = 0.20, n = 2.0 },
  { x = 28.50, w = 3.76, top = 1.910, bottom = -1.990, chine = 0.20, n = 2.0 },
  { x = 33.60, w = 3.74, top = 1.910, bottom = -1.310, chine = 0.30, n = 2.0 },
  { x = 38.60, w = 3.60, top = 1.900, bottom = -0.420, chine = 0.60, n = 2.0 },
  { x = 41.10, w = 2.46, top = 1.880, bottom = 0.100, n = 2.0 },
  { x = 43.50, w = 1.48, top = 1.840, bottom = 0.570, n = 2.0 },
  { x = 46.00, w = 0.49, top = 1.740, bottom = 1.170, n = 2.0 },
  { x = 46.61, w = 0.10, top = 1.660, bottom = 1.600, n = 2.0 },
]

# The rotodome: 9.14 m across and 1.83 m thick at its centre (an oblate
# spheroid), its centre 30.2 m behind the nose and its underside 3.35 m above
# the fuselage's top; tilted 2.5 deg down at the front (the tilt's size is an
# estimate: about the angle of attack of cruise, where it meets the air
# edge-on).
[[body]]
name = "rotodome"
kind = "pod"
stations = [
  { x = 25.630, w = 0.000, top = 5.980, bottom = 5.980 },
  { x = 25.767, w = 2.222, top = 6.209, bottom = 5.764 },
  { x = 26.087, w = 3.984, top = 6.399, bottom = 5.602 },
