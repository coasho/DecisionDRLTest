# Boeing KC-46A Pegasus, built by hangar from public data: the aerial-
# refuelling tanker on the Boeing 767-2C (the 767-200ER's fuselage, the
# 767-300F's wing and gear), two PW4062 turbofans in pods under the wing, the
# fly-by-wire boom under the tail and a refuelling pod under each wing.
#
# Frame: metres, x aft from the radome's tip, y right, z up from the ground,
# the aircraft parked on its gear. Sources:
#   - Boeing, "767 Airplane Characteristics for Airport Planning" (D6-58328):
#     767-200ER length 48.51 m, span 47.57 m, fuselage 5.03 m wide, wheelbase
#     19.69 m, track 9.30 m, ground clearances (fuselage top 7.16-7.47 m,
#     bottom 1.73-2.06 m, fin 15.60-16.13 m, nacelle 0.81-1.09 m, wing tip
#     4.95-5.56 m, stabilizer tip 5.94-6.58 m).
#   - Jenkinson, Simpkin and Rhodes, "Civil Jet Aircraft Design" (1999), data
#     for the 767-200: wing 283.3 m2, aspect ratio 7.99, taper 0.207, 11.5 %
#     average thickness; horizontal tail 77.69 m2, 18.62 m span, taper 0.20,
#     32 deg quarter-chord sweep, 20.34 m tail arm; fin 46.14 m2, 9.01 m tall,
#     taper 0.306, 39 deg; fuselage 47.24 m long.
#   - 767 wing: 31.5 deg quarter-chord sweep, 4.25 deg incidence, 6 deg
#     dihedral; MMO 0.86 (aircraftinvestigation.info, 767-200ER data).
#   - The fuselage's side view and the engine's position: J. Scavini's 767
#     drawing (Wikimedia Commons "Boeing 767 family v1.0.png", CC BY-SA),
#     measured at its 48.50 m length; its profile heights agree with Boeing's
#     clearances within 3 cm.
#   - USAF and Boeing (KC-46A): length 165 ft 6 in with the boom, span 157 ft
#     8 in, height 52 ft 1 in; empty 181,610 lb, maximum take-off 415,000 lb,
#     fuel 212,299 lb; 2 x PW4062 at 62,000 lbf; service ceiling 40,100 ft.
#     The USAF's plan-view silhouette (VIRIN 230816-F-IP635-1004): plain wing
#     tips - the KC-46A has no winglets - and the refuelling pods 85 % of the
#     half span out.
# Estimates are marked "estimate".

[aircraft]
name = "kc46a"
description = "Boeing KC-46A Pegasus (hangar build)"
category = "transport"

[analysis]
speed = 120.0                # m/s: the Reynolds numbers of the cruise (240 m/s at 35,000 ft, its viscosity)
max_mach = 1.2               # the tables' Mach range: through the transonic drag rise
induced_drag = "trefftz"     # a swept transport wing's induced drag from its loading (docs/hangar.md)

# The 767-300's wing: the reference trapezoid (283.3 m2, span 47.57 m,
# taper 0.207: root 9.87 m at the centre line, tip 2.04 m; 34.8 deg leading
# edge, 31.5 deg at the quarter chord) with its trailing edge unswept inboard
# of the break at 7.9 m (the "yehudi" the main gear stands behind; the
# drawing's break at a third of the half span), so its root chord is 12.76 m.
# Dihedral 6 deg, incidence 4.25 deg at the root, washed out to 0.75 deg at
# the tip (estimate). Aft-loaded sections, 15 % thick at the root, 12 % at the
# break, 10 % at the tip (estimate: NACA 6A sections stand in).
[[surface]]
name = "wing"
kind = "wing"
vortex = false                # thick, round-nosed sections: they stall, no fighter's vortex regime
sections = [
  { le = [14.200, 0.000, 3.000], chord = 12.760, twist = 4.25, airfoil = "naca64a415" },
  { le = [19.691, 7.900, 3.830], chord = 7.269, twist = 3.09, airfoil = "naca64a412" },
  { le = [30.733, 23.785, 5.500], chord = 2.043, twist = 0.75, airfoil = "naca64a410" },
]
controls = [
  # double-slotted inboard flap, from the fuselage to the break; the
  # single-slotted outboard flap (the 767-400ER's flaps: 30 deg)
  { name = "inboard flap", channel = "flap", kind = "slotted", span = [0.109, 0.320], chord_fraction = 0.30, limits = [0, 30] },
  { name = "outboard flap", channel = "flap", kind = "slotted", span = [0.416, 0.736], chord_fraction = 0.28, limits = [0, 30] },
  # the high-speed aileron between the flaps and the outboard aileron: both
  # always work here (the real outboard ones lock out at speed)
  { name = "inboard aileron", channel = "aileron", span = [0.332, 0.404], chord_fraction = 0.25, limits = [-20, 20] },
  { name = "outboard aileron", channel = "aileron", span = [0.748, 0.963], chord_fraction = 0.24, limits = [-20, 20] },
]

# Horizontal tail: 77.69 m2 (Jenkinson) to the centre line, 18.62 m span,
# taper 0.20 (root 6.95 m, tip 1.39 m), 32 deg quarter-chord sweep, placed at
# its 20.34 m tail arm from the wing's quarter-chord point; 7 deg dihedral, its
# tip 6.26 m off the ground (Boeing's stabilizer clearance). Elevators 23 % of
# its area (17.8 m2 of 77.7), travel (estimate).
[[surface]]
name = "htail"
kind = "htail"
sections = [
  { le = [38.700, 0.000, 5.120], chord = 6.954, airfoil = "naca64a010" },
  { le = [45.909, 9.310, 6.263], chord = 1.391, airfoil = "naca64a009" },
]
controls = [
  { name = "elevator", channel = "elevator", span = [0.17, 0.98], chord_fraction = 0.28, limits = [-25, 20] },
]

# Fin: 46.14 m2 (Jenkinson), 9.01 m to the top at 15.83 m (Boeing), 45 deg
# leading edge and 22 deg trailing edge (the drawing): root 7.71 m, tip
# 2.25 m. Rudder 35 % of the chord (16.0 of 46.2 m2), travel (estimate).
[[surface]]
name = "fin"
kind = "fin"
sections = [
  { le = [37.134, 0.000, 6.820], chord = 7.706, airfoil = "naca64a012" },
  { le = [46.282, 0.000, 15.830], chord = 2.248, airfoil = "naca64a010" },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.05, 0.95], chord_fraction = 0.35, limits = [-26, 26] },
]

