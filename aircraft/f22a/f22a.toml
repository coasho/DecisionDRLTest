# Lockheed Martin F-22A Raptor, built by hangar from public data. The
# thrust-vectoring nozzles are not modelled yet: the stabilators alone pitch
# it, so its angle of attack is held to 40 deg rather than the real 60.
#
# Frame: metres, x aft from the nose tip, y right, z up from the wing's chord
# plane. Sources: USAF fact sheet and Jane's (dimensions, weights,
# performance); Pratt & Whitney (F119-PW-100); the wing: 42 deg leading
# edge, -17 deg trailing edge, taper 0.169, NACA 64A section 5.92 % at the
# root, 4.29 % at the tip. The shape and the gear are measured off two
# three-views that agree to 0.1-0.15 m: the USAF's (gear down) and Zaku's.

[aircraft]
name = "f22a"
description = "Lockheed Martin F-22A Raptor (hangar build)"
category = "fighter"
stands_in_for = ["f22"]         # the viewer draws JSBSim's own f22 with this model (fsim hangar register)

[analysis]
speed = 260.0

# The wing: 78.04 m2 (840 ft2), span 13.56 m, a clipped diamond: 42 deg
# leading edge, -17 deg trailing edge (root 9.85 m, taper 0.169), the tip's
# corner cut back along the aileron's end. Its 35 % MAC point is the
# aerodynamic reference; the CG (relaxed stability, below) sits 1.2 m ahead
# of the main wheels.
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [6.460, 0.000, 0.000], chord = 9.850, airfoil = "naca64a206" },
  { le = [11.754, 5.880, -0.180], chord = 2.758, airfoil = "naca64a204" },
  { le = [12.565, 6.780, -0.300], chord = 1.250, airfoil = "naca64a204" },
]
controls = [
  { name = "aileron", channel = "aileron", span = [0.72, 0.97], chord_fraction = 0.28, limits = [-25, 25] },
  { name = "flaperon", channel = "aileron", mix = { flap = 1.0 }, span = [0.26, 0.70], chord_fraction = 0.22, limits = [-30, 30] },
]
# full-span leading-edge flaps on the angle-of-attack schedule (the F-16's
# law stands in: the F-22's is not published)
leading = [
  { name = "leading-edge flap", span = [0.26, 0.97], chord_fraction = 0.13, limits = [-3, 30] },
]

# All-moving stabilators on the tail booms, 12.8 m2 exposed: their leading
# edges parallel to the wing's, the outer trailing edges to its trailing
# edge, the inner ones cut back parallel to the leading edge, running on
# into the booms' ends. The surface runs on inside the fuselage to the
# centre line, as the body carries the tail's lift across.
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca64a004"
sections = [
  { le = [13.050, 0.000, 0.000], chord = 3.500 },
  { le = [14.050, 1.100, 0.000], chord = 2.600 },
  { le = [14.230, 1.270, 0.000], chord = 3.300 },
  { le = [14.860, 1.960, 0.000], chord = 3.140 },
  { le = [15.660, 2.820, 0.010], chord = 3.260 },
  { le = [17.150, 4.430, 0.030], chord = 1.250 },
]
controls = [
  { name = "stabilator", channel = "elevator", mix = { aileron = 0.3 }, span = [0.44, 1.0], chord_fraction = 1.0, pivot = 0.35, limits = [-25, 25] },
]

# Twin vertical tails canted 27 deg outboard on the booms, 2 x 8.2 m2
[[surface]]
name = "fin"
kind = "fin"
mirror = true
airfoil = "naca64a004"
sections = [
  { le = [13.210, 1.590, 0.300], chord = 4.080 },
  { le = [14.540, 2.970, 3.000], chord = 1.280 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.05, 0.60], chord_fraction = 0.30, limits = [-30, 30] },
]

# Fuselage: the chined nose, the caret inlets from 4.8 m, the weapons bays
# and the two engines side by side between the tail booms
[[body]]
name = "fuselage"
kind = "fuselage"
# Chined: the forward fuselage's sides meet in a sharp edge that runs from
# the nose along the intakes into the wing's leading edge; behind the intakes
# the body is wide and flat over the ducts and the side-by-side engines.
stations = [
  { x = 0.00, w = 0.00, top = -0.300, bottom = -0.340 },
  { x = 0.50, w = 0.50, top = -0.060, bottom = -0.550, chine = -0.320, n_top = 1.8, n_bottom = 1.8 },
  { x = 1.00, w = 0.90, top = 0.060, bottom = -0.670, chine = -0.300, n_top = 1.8, n_bottom = 1.8 },
  { x = 1.50, w = 1.18, top = 0.190, bottom = -0.780, chine = -0.280, n_top = 1.8, n_bottom = 1.9 },
  { x = 2.00, w = 1.40, top = 0.320, bottom = -0.830, chine = -0.250, n_top = 1.8, n_bottom = 1.9 },
  { x = 2.50, w = 1.52, top = 0.470, bottom = -0.880, chine = -0.220, n_top = 1.9, n_bottom = 2.0 },
  { x = 3.00, w = 1.66, top = 0.570, bottom = -0.920, chine = -0.200, n_top = 1.9, n_bottom = 2.0 },
  { x = 4.00, w = 1.80, top = 0.640, bottom = -0.950, chine = -0.150, n_top = 2.0, n_bottom = 2.1 },
  { x = 5.00, w = 1.96, top = 0.690, bottom = -0.940, chine = -0.100, n_top = 2.1, n_bottom = 2.2 },
  { x = 6.00, w = 2.20, top = 0.720, bottom = -0.940, chine = -0.050, n_top = 1.8, n_bottom = 2.6 },
  { x = 7.00, w = 2.70, top = 0.730, bottom = -1.000, chine = -0.050, n_top = 1.7, n_bottom = 2.6 },
  { x = 8.20, w = 3.50, top = 0.680, bottom = -1.040, chine = -0.080, n_top = 1.7, n_bottom = 2.2 },
  { x = 10.00, w = 4.00, top = 0.640, bottom = -1.030, chine = -0.100, n_top = 1.8, n_bottom = 2.0 },
  { x = 13.00, w = 3.90, top = 0.620, bottom = -0.950, chine = -0.100, n_top = 1.8, n_bottom = 2.0 },
  { x = 15.00, w = 3.40, top = 0.520, bottom = -0.760, chine = -0.150, n_top = 1.9, n_bottom = 2.4 },
  { x = 16.00, w = 2.90, top = 0.400, bottom = -0.610, chine = -0.200, n = 3.4 },
  { x = 16.70, w = 2.50, top = 0.250, bottom = -0.500, chine = -0.200, n = 3.6 },
]

# The belly between the intakes, flat under the weapons bays
[[body]]
name = "belly"
kind = "pod"
aero = false                  # part of the fuselage: the tables leave it out
stations = [
  { x = 5.60, w = 1.40, top = -0.300, bottom = -0.950, n_top = 2.0, n_bottom = 4.0 },
  { x = 7.00, w = 2.30, top = -0.300, bottom = -1.040, n_top = 2.0, n_bottom = 5.0 },
  { x = 8.50, w = 2.50, top = -0.300, bottom = -1.060, n_top = 2.0, n_bottom = 5.0 },
  { x = 10.00, w = 2.50, top = -0.300, bottom = -1.050, n_top = 2.0, n_bottom = 5.0 },
  { x = 11.00, w = 2.50, top = -0.300, bottom = -0.990, n_top = 2.0, n_bottom = 5.0 },
  { x = 12.50, w = 2.50, top = -0.300, bottom = -0.960, n_top = 2.0, n_bottom = 5.0 },
  { x = 14.50, w = 2.20, top = -0.300, bottom = -0.830, n_top = 2.0, n_bottom = 4.0 },
  { x = 15.50, w = 1.60, top = -0.300, bottom = -0.690, n_top = 2.0, n_bottom = 3.0 },
]

# The tail booms either side of the nozzles, carrying the fins and the
# stabilators' spindles and reaching past the nozzles
[[body]]
name = "boom"
kind = "pod"
mirror = true
aero = false                  # part of the fuselage: the tables leave it out
stations = [
  { x = 13.00, y = 1.620, w = 0.700, top = 0.520, bottom = -0.600, n = 3.0 },
  { x = 16.00, y = 1.620, w = 0.700, top = 0.450, bottom = -0.500, n = 3.0 },
  { x = 17.00, y = 1.620, w = 0.660, top = 0.220, bottom = -0.400, n = 3.0 },
  { x = 17.60, y = 1.620, w = 0.500, top = 0.080, bottom = -0.240, n = 2.6 },
  { x = 17.90, y = 1.620, w = 0.000, top = 0.000, bottom = -0.150 },
]

# The stinger between the nozzles
[[body]]
name = "stinger"
kind = "pod"
aero = false
stations = [
  { x = 15.80, w = 0.300, top = 0.050, bottom = -0.450, n = 2.4 },
  { x = 16.70, w = 0.260, top = 0.000, bottom = -0.380, n = 2.4 },
  { x = 17.40, w = 0.160, top = -0.080, bottom = -0.260, n = 2.2 },
  { x = 17.75, w = 0.000, top = -0.150, bottom = -0.190 },
]

# Caret intakes either side below the chine, their walls leaning in at the
# bottom; the lip's plane swept and raked 42 deg like every other edge, the
# ducts curving in towards the engines
[[intake]]
name = "intake"
mirror = true
lip = 0.035
rake = 42
sweep = 42
duct = 1.8
duct_rise = 0.10
duct_taper = 0.85
stations = [
  { x = 5.35, y = 1.143, w = 1.000, top = 0.000, bottom = -0.950, n = 5.0, lean = 40 },
  { x = 6.50, y = 1.153, w = 0.920, top = 0.000, bottom = -1.060, n = 5.0, lean = 46 },
  { x = 8.00, y = 1.262, w = 0.880, top = -0.020, bottom = -1.070, n = 6.0, lean = 49 },
  { x = 10.00, y = 1.150, w = 0.840, top = -0.080, bottom = -1.000, n = 6.0, lean = 49 },
  { x = 11.50, y = 1.000, w = 0.700, top = -0.200, bottom = -0.950, n = 5.0, lean = 49 },
