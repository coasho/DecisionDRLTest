# Written by hangar autopilot (2026-09-26 00:43) for rc135w.toml: the aircraft's responses to its
# controls, identified at a reference condition (docs/hangar.md, The autopilot). The
# build writes them into the JSBSim aircraft's plant section; the platform designs its
# control loops from them. Delete this file to fly the platform's shared defaults.
[reference]   # where they were measured
tas_ms = 173.26
eas_ms = 150.783
altitude_m = 3000

[identified]   # the responses at the reference: per unit of aileron (roll rate, rad/s), elevator (load factor,
               # g), rudder (sideslip, rad) and throttle (acceleration, m/s2), each with its lag (s); level
               # flight's throttle, a surface-controlled aircraft's trim law, the zero-lift angle of attack
roll = { gain = 0.894261, lag_s = 0.404466 }
pitch = { gain = 2.95304, lag_s = 0.551475 }
yaw = { gain = 0.468328 }
speed = { gain = 2.3392, lag_s = 0.324558 }
throttle_trim = 0.546152
elevator_trim = 0.223431
elevator_trim_lift = -0.33527
alpha_zero_lift_rad = -0.0403014
