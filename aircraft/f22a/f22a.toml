[[engine]]
name = "F119-PW-100"
type = "turbofan"
mirror = true
thrust_dry_kn = 116.0         # 26,000 lbf military
thrust_wet_kn = 156.0         # 35,000 lbf afterburner
bypass_ratio = 0.30
tsfc_dry = 0.61
tsfc_wet = 1.80
design_mach = 2.25
position = [14.700, 0.700, -0.250]
mass = 1770
inlet_x = 5.8
[engine.nozzle]
position = [16.700, 0.700, -0.200]
shape = "2d"                  # two-dimensional, vectoring in pitch

# The gear where the USAF three-view has its wheels (the axles 5.71 and 11.83 m
# behind the nose), the 3.2 m track of its front view and Michelin's tyres
# (23.5x7.5R10, 37x11.5R18); standing on its ground line the fins' tips are
# 5.0 m up. The nose gear folds forward, the main legs outward (GlobalSecurity),
# their wheels coming to lie flat in the lower fuselage's sides.
[[gear]]
name = "Nose Gear"
position = [5.710, 0.0, -2.130]
steerable = true
max_steer = 60
wheel_diameter = 0.617
wheel_width = 0.200
retractable = true
retract = "forward"
static_deflection = 0.14
attach = [5.900, 0.0, -0.600]

[[gear]]
name = "Main Gear"
mirror = true
position = [11.830, 1.600, -2.170]
wheel_diameter = 0.965
wheel_width = 0.304
retractable = true
retract = "outward"
static_deflection = 0.18
attach = [11.250, 1.150, -0.750]

[reference]
