# Lockheed Martin C-130J Super Hercules, built by hangar from public data:
# the tactical transport, four Rolls-Royce AE 2100D3 turboprops on Dowty
# R391 six-blade composite propellers.
#
# Frame: metres, x aft from the radome's tip, y right, z up from the ground
# with the aircraft parked (gear down, struts at their static compression).
# Sources: Lockheed Martin and USAF fact sheets and Wikipedia's C-130J
# article (dimensions, weights, performance; the wing's NACA 64A318 and
# 64A412 sections); GlobalSecurity's C-130J specifications (tailplane span
# 52.7 ft, wheel track 14.25 ft, propeller 13.5 ft, internal fuel 45,900
# lb); Wikipedia's AE 2100 article (3,458 kW, 0.460 lb/(hp h) = 0.280
# kg/(kW h), 790 kg, gearbox about 14:1); the Smithsonian's R391 (13.5 ft,
# six blades, 800 lb); Rolls-Royce (the AE 2100's 6,200 shp growth
# potential). The shape is measured off Marek Cel's C-130J three-view
# (Wikimedia Commons, CC0), scaled by the published 29.79 m length; it gives
# the span 40.40 m (published 40.41).
#
# Shared with the EC-130H (aircraft/ec130h/ec130h.toml), whose C-130H
# airframe is the same: the wing, the tail, the fuselage, the sponsons, the
# nacelles' outline and the gear.

[aircraft]
name = "c130j"
description = "Lockheed Martin C-130J Super Hercules (hangar build)"
category = "transport"
stands_in_for = ["C130"]        # the viewer draws JSBSim's own C130 with this model (fsim hangar register)

[analysis]
speed = 110.0                   # m/s: the Reynolds numbers (cruise, equivalent sea-level speed)
induced_drag = "trefftz"      # a high-aspect-ratio wing's induced drag from its loading (docs/hangar.md)

# The wing: 162.1 m2 (1,745 ft2), span 40.41 m, NACA 64A318 at the root to
# 64A412 at the tip, on top of the fuselage. The centre section's constant
# 4.90 m chord runs out to 5.65 m, just past the inboard engines; the outer
# panels taper to 2.50 m at the tip (the drawing's 2.62 m gives 164.8 m2),
# their leading edge swept 2.6 deg, their trailing edge forward, 2.5 deg of
# dihedral (the three-view's front view). Twist: 3 deg at the root, 0.5 deg
# at the tip (estimate: a transport's usual washout).
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [11.150, 0.000, 4.960], chord = 4.900, twist = 3.0, airfoil = "naca64a318" },
  { le = [11.150, 5.650, 4.960], chord = 4.900, twist = 2.6, airfoil = "naca64a318" },
  { le = [11.800, 20.205, 5.596], chord = 2.500, twist = 0.5, airfoil = "naca64a412" },
]
controls = [
  # Lockheed-Fowler flaps from the fuselage to the ailerons (travel: estimate)
  { name = "flap", channel = "flap", kind = "fowler", span = [0.10, 0.68], chord_fraction = 0.30, limits = [0, 35] },
  { name = "aileron", channel = "aileron", span = [0.68, 0.97], chord_fraction = 0.26, limits = [-20, 20] },
]

# The tailplane: 16.05 m span (52.7 ft), its trailing edge straight across,
# the leading edge swept; NACA 64A012 (estimate). Carried through the
# fuselage to the centre line.
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca64a012"
sections = [
  { le = [23.640, 0.000, 4.600], chord = 3.920 },
  { le = [25.870, 8.025, 4.600], chord = 1.690 },
]
controls = [
  { name = "elevator", channel = "elevator", span = [0.12, 1.0], chord_fraction = 0.35, limits = [-25, 15] },
]

# The fin: 5.8 m root chord on the fuselage's top, 1.66 m tip, its leading
# edge swept 23 deg; its tip at the published 11.84 m height (the drawing
# puts it at 11.5 m)
[[surface]]
name = "fin"
kind = "fin"
airfoil = "naca64a012"
sections = [
  { le = [23.100, 0.000, 4.500], chord = 5.800 },
  { le = [26.220, 0.000, 11.800], chord = 1.660 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.04, 1.0], chord_fraction = 0.35, limits = [-35, 35] },
]

# The fuselage: the radome, the flight deck, the constant section of the
# cargo hold, and the upswept rear fuselage whose underside is the ramp and
# the door above it, to the tail cone
[[body]]
name = "fuselage"
kind = "fuselage"
stations = [
