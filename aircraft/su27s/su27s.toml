# Sukhoi Su-27S (Flanker-B), built by hangar from public data.
#
# Frame: metres, x aft from the nose tip, y right, z up from the wing's chord
# plane. Sources: Jane's All the World's Aircraft, Sukhoi and KnAAPO data
# (dimensions, weights, performance), Lyulka-Saturn (AL-31F). The centre
# fuselage is a lifting body between widely spaced engine nacelles; here the
# fuselage and two nacelles. The shape is measured off two three-views that
# agree to 0.3 m: a Su-30's (heights, wheels: its wheelbase and tyres are
# the published ones) and a single-seat Su-27's (the canopy).

[aircraft]
name = "su27s"
description = "Sukhoi Su-27S Flanker-B (hangar build)"
category = "fighter"

[analysis]
speed = 250.0

# The wing: 62 m2 reference, span 14.70 m over the tip rails, 42 deg leading
# edge, its trailing edge swept 16 deg (root 6.60 m, tip 2.10 m). The CG
# sits at 30 % of the MAC, 0.9 m ahead of the main wheels: 4 % of the MAC
# stable in hangar's aerodynamics (the real Su-27 is flown slightly
# unstable).
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [8.690, 0.000, 0.000], chord = 6.600, airfoil = "naca64a005" },
  { le = [15.250, 7.200, -0.100], chord = 2.100, airfoil = "naca64a004" },
]
controls = [
  # flaperons, the flap function up to 30 deg
  { name = "flaperon", channel = "aileron", mix = { flap = 1.0 }, span = [0.28, 0.72], chord_fraction = 0.22, limits = [-20, 20] },
]
# leading-edge flaps outboard of the root extension, scheduled with angle
# of attack (the F-16's law stands in)
leading = [
  { name = "leading-edge flap", span = [0.29, 0.97], chord_fraction = 0.13, limits = [-2, 30] },
]

# The leading-edge root extensions: sharp, curving from beside the cockpit
# (80 deg) into the wing's leading edge
[[surface]]
name = "lerx"
kind = "strake"
airfoil = "plate"
sections = [
  { le = [6.700, 1.000, 0.030], chord = 4.200 },
  { le = [8.000, 1.270, 0.030], chord = 2.900 },
  { le = [9.000, 1.555, 0.030], chord = 1.900 },
  { le = [10.000, 1.925, 0.020], chord = 0.950 },
  { le = [10.990, 2.530, 0.000], chord = 0.050 },
]

# All-moving horizontal tails on the tail booms, 0.65 m below the wing's
# plane, 45 deg leading edge; they roll the aircraft too. The surface runs
# on inside the nacelles and the centre body to the centre line, as the body
# carries the tail's lift across.
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca64a004"
sections = [
  { le = [14.480, 0.000, -0.350], chord = 5.500 },
  { le = [15.080, 0.600, -0.600], chord = 5.120 },
  { le = [15.280, 0.800, -0.645], chord = 4.970 },
  { le = [16.680, 2.200, -0.645], chord = 3.520 },
  { le = [19.280, 4.800, -0.645], chord = 0.600 },
]
controls = [
  { name = "stabilator", channel = "elevator", mix = { aileron = 0.4 }, span = [0.49, 1.0], chord_fraction = 1.0, pivot = 0.35, limits = [-20, 15] },
]

# Twin vertical tails on the booms, 2 x 7.4 m2, 39 deg leading edge
[[surface]]
name = "fin"
kind = "fin"
mirror = true
airfoil = "naca64a004"
sections = [
  { le = [14.650, 2.200, 0.350], chord = 3.420 },
  { le = [17.520, 2.200, 3.845], chord = 0.900 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.10, 0.70], chord_fraction = 0.28, limits = [-25, 25] },
]

[[surface]]
name = "ventral"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [15.900, 2.200, -0.700], chord = 2.200 },
  { le = [16.500, 2.300, -1.500], chord = 0.800 },
]

