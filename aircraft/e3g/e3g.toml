mass = 1805
position = [17.000, 0.0, 0.300]
# 21,000 US gal (USAF) of JP-8 at 0.803 kg/l: 63,800 kg in the centre wing
# tank, the inboard and outboard mains and the reserves (split estimated from
# the 707's tank layout)
[[mass.tank]]
name = "centre wing"
position = [18.200, 0.0, -1.300]
capacity = 14000
[[mass.tank]]
name = "left inboard main"
position = [21.040, -6.500, -0.200]
capacity = 15700
[[mass.tank]]
name = "right inboard main"
position = [21.040, 6.500, -0.200]
capacity = 15700
[[mass.tank]]
name = "left outboard main"
position = [25.230, -13.000, 0.600]
capacity = 7500
[[mass.tank]]
name = "right outboard main"
position = [25.230, 13.000, 0.600]
capacity = 7500
[[mass.tank]]
name = "left reserve"
position = [28.750, -18.500, 1.270]
capacity = 1700
[[mass.tank]]
name = "right reserve"
position = [28.750, 18.500, 1.270]
capacity = 1700

[dimensions]                  # published, overall, gear down (Wikipedia, E-3):
length = 46.61                # m
span = 44.42
height = 12.60

[targets]
# E-3, published (Wikipedia; USAF): 461 kt maximum - Mach 0.78 at 29,000 ft,
# the height its fact sheet gives as its ceiling (the speed's height is not
# published: an estimate)
max_mach = 0.78
max_mach_altitude_ft = 29000
operational_ceiling_ft = 29000  # USAF fact sheet: "above 29,000 feet"
