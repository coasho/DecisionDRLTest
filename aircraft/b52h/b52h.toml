# Boeing B-52H Stratofortress, built by hangar from public data.
#
# Frame: metres, x aft from the nose tip, y right, z up; z = 0 is the wing
# root's mid-thickness in the front view, the fuselage's top line 0.71 m
# above it. Sources: USAF fact sheet (dimensions, weights, engines, speed,
# ceiling); Wikipedia and its sources (Knaack 1988; NASA SP-468, Loftin,
# "Quest for Performance", 1985: 35 deg quarter-chord sweep, aspect ratio
# 8.56, sections 14 % thick at the root to 8 % at the tip); B. Schiff, AOPA
# Pilot, May 2015 (the wing's 8 deg incidence, no ailerons on the H);
# thisdayinaviation.com after the Standard Aircraft Characteristics (fin
# 22 ft 11 in tall; 555 kt, Mach 0.906, at 20,700 ft); Pratt & Whitney
# (TF33-P-3).
#
# The shape is measured off B. Matsuyama's B-52H three-view (Wikimedia
# Commons, CC0), scaled in y and z by the published span (56.39 m: its
# 15.88 m tailplane then matches the published 52 ft) and in x by the
# published length without the tail gun's barrel (48.565 m). The drawing
# runs 1.9 % long in x against its span; so scaled, its quarter-chord sweep
# comes out at the published 35 deg. The main wheels' stations are measured
# off the NB-52B three-view (NASA Dryden, public domain): the H keeps the
# B's forward fuselage and gear.
#
# The wing is drawn and flown in its ground shape, drooping 1.66 m to the
# tips with fuel aboard, as the front view has it; in flight it flexes up
# (the tips move through 32 ft, 16 up and 16 down: AOPA), which the tables
# do not model. The B-52H has no ailerons: seven spoilers on each wing roll
# it. hangar has no spoilers, so ailerons on the outer wing stand in for
# them (below).

[aircraft]
name = "b52h"
description = "Boeing B-52H Stratofortress (hangar build)"
category = "bomber"

[analysis]
speed = 100.0                # m/s: the Reynolds numbers of cruise at 35,000 ft (sea-level viscosity)

# The published wing area, 4,000 ft2, is the reference; the drawing's
# planform, taken to the centre line, has 5 % more
[reference]
area = 371.6

# The wing: a straight taper to the centre line, measured off the drawing -
# the leading edge swept 37.3 deg (35 deg at the quarter chord), root chord
# 10.24 m, tip 3.62 m at the 28.19 m half span. Set on top of the fuselage at
# 8 deg incidence (AOPA; its root's upper surface level with the fuselage's
# top), washed out to 5 deg at the tip (estimate). NACA 6A sections from 14 %
# at the root to 8 % at the tip (Loftin; the families from Lednicer's guide:
# 63A2xx root, 65A2xx tip): thick and round-nosed, they stall as sections do
# (vortex = false: no fighter's edge vortex). The droop: the front view's
# wing midline, 0.36 m down at the inboard pods, 0.81 m at the outboard pods,
# 1.66 m at the tip.
[[surface]]
name = "wing"
kind = "wing"
vortex = false
sections = [
  { le = [10.174, 0.000, 0.713], chord = 10.244, twist = 8.0, airfoil = "naca63a214" },
  { le = [17.982, 10.270, 0.114], chord = 7.830, twist = 6.9, airfoil = "naca64a212" },
  { le = [23.897, 18.050, -0.492], chord = 6.001, twist = 6.1, airfoil = "naca64a210" },
  { le = [31.607, 28.190, -1.502], chord = 3.617, twist = 5.0, airfoil = "naca65a208" },
]
controls = [
  # Fowler flaps from the side of the body to the outrigger (estimate: 30 %
  # chord, 30 deg)
  { name = "flap", channel = "flap", kind = "fowler", span = [0.06, 0.62], chord_fraction = 0.30, limits = [0, 30] },
  # stand-in for the spoilers that roll the B-52H: hangar has no spoilers
  # (estimate: 22 % chord, 20 deg)
  { name = "aileron", channel = "aileron", span = [0.66, 0.95], chord_fraction = 0.22, limits = [-20, 20] },
]

# The horizontal tail: 15.85 m span (52 ft, B-52 Stratofortress
# Association), leading edge swept 42 deg, root chord 8.36 m, tip 2.0 m, at
# the fuselage's mid height. Its stabilizer trims through 13 deg (9 up, 4
# down) and carries a narrow elevator (Wikipedia; Loftin): here it is one
# all-moving surface, its travel the stabilizer's and the elevator's
# together (estimate: 15 deg nose up, 10 down).
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca64a010"
vortex = false
sections = [
  { le = [36.600, 0.000, -0.750], chord = 8.360 },
  { le = [43.670, 7.920, -0.750], chord = 2.000 },
]
controls = [
  { name = "stabilizer", channel = "elevator", span = [0.11, 1.0], chord_fraction = 1.0, pivot = 0.40, limits = [-15, 10] },
]

# The fin, 7.06 m above the fuselage's top (the published 22 ft 11 in):
# leading edge swept 39 deg, root chord 7.8 m, tip 3.1 m; its narrow rudder
# (10-15 % of the chord in the drawing; travel an estimate)
[[surface]]
name = "fin"
kind = "fin"
airfoil = "naca64a010"
sections = [
  { le = [36.755, 0.000, 0.400], chord = 7.840 },
  { le = [42.680, 0.000, 7.645], chord = 3.140 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.05, 0.95], chord_fraction = 0.12, limits = [-25, 25] },
]

