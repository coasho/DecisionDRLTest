mass = 100
position = [4.600, 0.0, 0.600]
[[mass.payload]]
name = "gun ammunition"       # GSh-23, 200 rounds
mass = 60
position = [7.000, 0.0, -0.800]
[[mass.tank]]
name = "fuselage 1"           # internal fuel, 4,950 kg
position = [8.034, 0.0, -0.200]
capacity = 1800
[[mass.tank]]
name = "fuselage 2"
position = [10.134, 0.0, -0.200]
capacity = 1700
[[mass.tank]]
name = "fuselage 3"
position = [11.734, 0.0, -0.200]
capacity = 650
[[mass.tank]]
name = "left wing"
position = [10.534, -2.200, 0.000]
capacity = 400
[[mass.tank]]
name = "right wing"
position = [10.534, 2.200, 0.000]
capacity = 400

[targets]
# J-10A, published (estimates)
max_mach = 2.2                # at altitude, full afterburner
max_mach_altitude_ft = 36000
service_ceiling_ft = 59000
