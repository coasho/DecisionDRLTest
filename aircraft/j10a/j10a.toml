  { x = 13.600, w = 0.00, top = 1.220, bottom = 1.200 },
  { x = 14.000, w = 0.26, top = 1.720, bottom = 1.160, n = 2.4 },
  { x = 15.550, w = 0.30, top = 1.800, bottom = 1.160, n = 2.4 },
  { x = 15.800, w = 0.00, top = 1.490, bottom = 1.470 },
]

