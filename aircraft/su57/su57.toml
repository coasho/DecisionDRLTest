  { x = 16.00, w = 3.00, top = 0.600, bottom = -0.580, chine = 0.000, n_top = 3.0, n_bottom = 2.4 },
  { x = 17.30, w = 1.60, top = 0.560, bottom = -0.550, n = 2.6 },
  { x = 18.00, w = 1.30, top = 0.500, bottom = -0.500, n = 2.4 },
  { x = 19.00, w = 1.20, top = 0.285, bottom = -0.245, n = 2.3 },
  { x = 19.60, w = 0.80, top = 0.215, bottom = -0.115, n = 2.2 },
  { x = 20.17, w = 0.00, top = 0.110, bottom = 0.070 },
]

# The engine nacelles, wide apart under the LEVCONs, their intakes' mouths
# raked back from the top lip, the outer walls sloping in
[[intake]]
name = "nacelle"
mirror = true
lip = 0.035
rake = 50
duct = 2.0
duct_rise = 0.2
duct_taper = 0.85
stations = [
  { x = 8.60, y = 1.250, w = 1.200, top = -0.250, bottom = -0.950, n = 4.0, lean = 20 },
  { x = 10.00, y = 1.250, w = 1.300, top = -0.150, bottom = -1.000, n = 3.6, lean = 15 },
  { x = 13.00, y = 1.250, w = 1.300, top = 0.000, bottom = -0.870, n = 3.2, lean = 10 },
  { x = 16.00, y = 1.250, w = 1.250, top = 0.050, bottom = -0.720, n = 2.8 },
  { x = 18.30, y = 1.250, w = 1.100, top = 0.000, bottom = -0.500, n = 2.4 },
  { x = 18.70, y = 1.250, w = 1.000, top = -0.050, bottom = -0.450, n = 2.2 },
]

# The tail booms outboard of the engines: they carry the all-moving fins
# and the stabilators' spindles
[[body]]
name = "boom"
kind = "boom"
mirror = true
stations = [
  { x = 12.50, y = 2.300, w = 0.200, top = 0.300, bottom = -0.100, n = 2.6 },
  { x = 14.00, y = 2.300, w = 0.500, top = 0.700, bottom = -0.400, n = 2.6 },
  { x = 17.40, y = 2.300, w = 0.500, top = 0.600, bottom = -0.350, n = 2.6 },
  { x = 18.10, y = 2.300, w = 0.000, top = 0.200, bottom = -0.150 },
]

# The one-piece canopy
[[body]]
name = "canopy"
kind = "pod"
aero = false                  # part of the fuselage's top: the tables leave it out
stations = [
  { x = 2.300, w = 0.00, top = 0.650, bottom = 0.600 },
  { x = 3.000, w = 0.76, top = 0.860, bottom = 0.560, n = 2.0 },
  { x = 3.600, w = 0.90, top = 1.140, bottom = 0.580, n = 2.0 },
  { x = 4.400, w = 0.94, top = 1.370, bottom = 0.620, n = 2.0 },
  { x = 5.200, w = 0.88, top = 1.280, bottom = 0.680, n = 2.0 },
  { x = 6.000, w = 0.72, top = 1.135, bottom = 0.760, n = 2.0 },
  { x = 6.800, w = 0.40, top = 1.040, bottom = 0.860, n = 2.0 },
  { x = 7.400, w = 0.00, top = 0.970, bottom = 0.920 },
]

[[engine]]
name = "AL-41F1"
type = "turbofan"
mirror = true
thrust_dry_kn = 88.3          # 9,000 kgf military
thrust_wet_kn = 142.2         # 14,500 kgf afterburner
bypass_ratio = 0.60
tsfc_dry = 0.72
tsfc_wet = 1.90
design_mach = 2.0
position = [15.600, 1.250, -0.150]
mass = 1604
inlet_x = 8.6
[engine.nozzle]
position = [18.750, 1.250, -0.150]
diameter = 0.90               # m, as drawn

# The gear: twin nose wheels folding aft under the cockpit floor, the mains
# folding forward into the intakes' sides (the layout published, the
# positions estimated), 1 m behind the CG; standing on it the fins' tips are
# the published 4.6 m up.
[[gear]]
name = "Nose Gear"
position = [6.200, 0.0, -2.390]
steerable = true
max_steer = 50
wheel_diameter = 0.62
wheel_width = 0.18
wheels = 2
retractable = true
retract = "aft"
static_deflection = 0.15
attach = [6.100, 0.0, -0.400]

[[gear]]
name = "Main Gear"
mirror = true
position = [12.600, 2.100, -2.420]
wheel_diameter = 1.03
wheel_width = 0.32
retractable = true
retract = "forward"
wheel_turn = "flat"
static_deflection = 0.18
attach = [12.400, 1.600, -0.500]

[reference]
aero_point = [11.426, 0.0, 0.0]    # 0.23 MAC, at the CG

[flight_control]
type = "fbw"
n_max = 9.0
n_min = -3.0
alpha_max_deg = 26.0
roll_rate_deg_s = 270.0

[mass]
empty = 18000                 # estimate
empty_cg = [11.459, 0.0, -0.400]  # loaded, 5 % of the MAC ahead of the neutral point hangar finds
# no published inertia: radii of gyration like the Su-27's
gyration = [0.265, 0.430, 0.550]
[[mass.payload]]
name = "pilot"
mass = 100
position = [4.600, 0.0, 0.700]
[[mass.payload]]
name = "internal missiles"    # 4 R-77M, 2 R-74M
mass = 972
position = [11.009, 0.0, -0.700]
[[mass.tank]]
