# The pylons: from the nacelles' tops into the wing behind its leading edge
[[strut]]
name = "inboard pylon"
from = [19.90, 9.150, -0.700]
to = [20.10, 9.150, 0.050]
chord = 3.2
thickness = 0.32

[[strut]]
name = "outboard pylon"
from = [25.10, 15.750, 0.080]
to = [25.30, 15.750, 0.900]
chord = 2.8
thickness = 0.30

[[engine]]
name = "TF33-PW-100A inboard"
type = "turbofan"
mirror = true
thrust_dry_kn = 93.4          # 21,000 lbf (USAF; Wikipedia gives 21,500)
bypass_ratio = 1.42
tsfc_dry = 0.78               # at M 0.82, 35,000 ft (Wikipedia, TF33)
throttle_ratio = 1.0          # flat-rated to ISA (Wikipedia, TF33): its thrust falls from the start of the take-off run
design_mach = 0.8             # Raymer's engine size: a subsonic engine
position = [18.30, 9.150, -1.130]
mass = 2490                   # installed with its thrust reverser: Raymer's 2.331 W^0.901 x 1.18 on the 2,089 kg dry engine
inlet_x = 15.8
[engine.nozzle]
position = [21.00, 9.150, -1.130]
diameter = 0.90               # the core nozzle
length = 0.5
petal_open_deg = 0            # a fixed nozzle

[[engine]]
name = "TF33-PW-100A outboard"
type = "turbofan"
mirror = true
thrust_dry_kn = 93.4
bypass_ratio = 1.42
tsfc_dry = 0.78
throttle_ratio = 1.0
design_mach = 0.8
position = [23.38, 15.750, -0.316]
mass = 2490
inlet_x = 20.88
[engine.nozzle]
position = [26.08, 15.750, -0.316]
diameter = 0.90
length = 0.5
petal_open_deg = 0

# Gear: twin nose wheels 5.1 m behind the nose (the four-view) folding forward;
# four-wheel bogies 17.98 m behind them (Jenkinson's wheelbase), 6.73 m apart
# (track), their axles 1.42 m apart (56 in), folding inward into the belly.
# Tyres 39x13 and 46x16. The fuselage's belly 1.31 m above the ground,
# parked.
[[gear]]
name = "Nose Gear"
position = [5.100, 0.0, -3.550]
steerable = true
max_steer = 55
wheel_diameter = 0.99
wheel_width = 0.33
wheels = 2
retractable = true
retract = "forward"
static_deflection = 0.25
attach = [5.300, 0.0, -1.400]

[[gear]]
name = "Main Gear"
mirror = true
position = [23.080, 3.365, -3.550]
wheel_diameter = 1.17
wheel_width = 0.41
wheels = 2
axles = 2                     # the four-wheel bogie
axle_spacing = 1.42
retractable = true
retract = "inward"
wheel_turn = "flat"
doors = false                 # open wells: hangar's doors for an inward swing split fore and aft,
                              # where a four-wheel bogie's ends pass
static_deflection = 0.25
attach = [23.080, 3.200, -0.800]

[flight_control]
type = "direct"               # hydraulically boosted controls, as the 707's
yaw_damper = true             # the 707's yaw damper

[mass]
empty = 83915                 # 185,000 lb (Wikipedia)
mtow = 157397                 # 347,000 lb
empty_cg = [21.30, 0.0, 0.20]  # estimate: 28 % of the MAC; the rotodome raises it
# no published inertia: the Boeing 747's radii of gyration (Nelson, "Flight
# Stability and Automatic Control", app. B: Ixx 18.3e6, Iyy 33.1e6, Izz 49.7e6
# slug ft2 at 636,636 lb)
gyration = [0.31, 0.35, 0.47]
[mass.component]              # kg: Raymer's transport equations (15.25-15.31) for a 707-320B at 347,000 lb, rounded
wing = 14000
htail = 1800
fin = 1100
fuselage = 12500              # with the E-3's strengthening for the rotodome (estimate)
rotodome = 6000               # the rotodome is quoted at 15,000 lb with its struts (secondary source)
"rotodome strut" = 800
"inboard nacelle" = 1110      # both nacelles of the pair
"outboard nacelle" = 1110
"Nose Gear" = 680
"Main Gear" = 5200            # both bogies
[[mass.payload]]
name = "pilot"
mass = 95
position = [3.200, -0.550, 0.200]
[[mass.payload]]
name = "copilot"
mass = 95
position = [3.200, 0.550, 0.200]
[[mass.payload]]
name = "navigator and flight engineer"
mass = 190
position = [4.300, 0.0, 0.200]
[[mass.payload]]
