# Skua: a hypothetical 23 kg twin-boom pusher UAV - an aircraft with no wind
# tunnel data, no flight data, no JSBSim model: what hangar is for. Every number
# below is a design choice; the tool turns them into a JSBSim aircraft and
# says how it flies.
#
# Frame: metres, x aft from the nose, y right, z up from the pod's centre line.

[aircraft]
name = "skua"
description = "Skua - twin-boom pusher UAV, 4 m span, electric (hypothetical)"
category = "uav"

[analysis]
speed = 22.0                 # m/s: the Reynolds numbers (cruise)

[[surface]]
name = "wing"
kind = "wing"
airfoil = "naca4412"          # high lift at low Reynolds numbers
# A constant-chord centre panel, tapered outer panels; 3 deg dihedral,
# 2 deg washout.
sections = [
  { le = [0.550, 0.000, 0.120], chord = 0.360, twist = 2.0 },
  { le = [0.550, 0.800, 0.162], chord = 0.360, twist = 2.0 },
  { le = [0.580, 2.000, 0.225], chord = 0.240, twist = 0.0 },
]
controls = [
  { name = "flap", channel = "flap", kind = "slotted", span = [0.05, 0.40], chord_fraction = 0.28, limits = [0, 35] },
  { name = "aileron", channel = "aileron", span = [0.45, 0.95], chord_fraction = 0.25, limits = [-20, 20] },
]

[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca0010"
# between the booms, on their ends
sections = [
  { le = [2.060, 0.000, 0.120], chord = 0.220, twist = -1.0 },
  { le = [2.060, 0.550, 0.120], chord = 0.220, twist = -1.0 },
]
controls = [
  { name = "elevator", channel = "elevator", span = [0.0, 1.0], chord_fraction = 0.35, limits = [-25, 25] },
]

[[surface]]
name = "fin"
kind = "fin"
mirror = true                 # one on each boom
airfoil = "naca0010"
sections = [
  { le = [1.990, 0.550, 0.150], chord = 0.310 },
  { le = [2.100, 0.550, 0.450], chord = 0.200 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.0, 1.0], chord_fraction = 0.40, limits = [-25, 25] },
]

[[body]]
name = "pod"
kind = "fuselage"
stations = [
  { x = 0.00, w = 0.00, top = 0.000, bottom = 0.000 },
  { x = 0.05, w = 0.14, top = 0.060, bottom = -0.070 },
  { x = 0.20, w = 0.26, top = 0.130, bottom = -0.130, n = 2.3 },
  { x = 0.70, w = 0.28, top = 0.150, bottom = -0.140, n = 2.5 },
  { x = 1.20, w = 0.24, top = 0.120, bottom = -0.110, n = 2.3 },
  { x = 1.45, w = 0.12, top = 0.055, bottom = -0.055, n = 2.0 },
  { x = 1.50, w = 0.06, top = 0.030, bottom = -0.030, n = 2.0 },
]

[[body]]
name = "booms"
kind = "boom"
mirror = true
stations = [
  { x = 0.70, y = 0.55, w = 0.000, top = 0.150, bottom = 0.150 },
  { x = 0.78, y = 0.55, w = 0.060, top = 0.180, bottom = 0.120 },
  { x = 2.30, y = 0.55, w = 0.050, top = 0.175, bottom = 0.125 },
  { x = 2.36, y = 0.55, w = 0.000, top = 0.150, bottom = 0.150 },
]

[[engine]]
name = "motor"
type = "electric"
power_kw = 3.0
rpm = 6000
position = [1.440, 0.0, 0.0]
mass = 1.3                   # motor, controller, mount
[engine.propeller]
position = [1.560, 0.0, 0.0] # pusher, behind the pod
diameter = 0.56              # 22 x 12 in
blades = 2
pitch = 0.30
rotation = "cw"

[[gear]]
name = "Nose Gear"
position = [0.120, 0.0, -0.300]
steerable = true
max_steer = 20
wheel_diameter = 0.10
wheel_width = 0.03
static_deflection = 0.02
attach = [0.120, 0.0, -0.100]

[[gear]]
name = "Main Gear"
mirror = true
position = [0.760, 0.350, -0.300]
wheel_diameter = 0.12
wheel_width = 0.035
static_deflection = 0.02
attach = [0.700, 0.080, -0.120]

[mass]
empty = 21.0                 # kg, battery included
[mass.component]             # kg, by component name (Raymer's statistics are for manned aircraft)
wing = 3.2
htail = 0.45
fin = 0.35
pod = 2.4
booms = 0.9
"Nose Gear" = 0.35
"Main Gear" = 0.7
[[mass.item]]
name = "battery"
mass = 6.5
position = [0.520, 0.0, -0.020]
[[mass.item]]
name = "avionics"
mass = 1.2
position = [0.300, 0.0, 0.000]
[[mass.payload]]
name = "camera"
mass = 2.0
position = [0.200, 0.0, -0.080]
