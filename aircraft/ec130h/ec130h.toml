# Lockheed EC-130H Compass Call, built by hangar from public data: the
# C-130H airframe with four Allison T56-A-15 turboprops on Hamilton Standard
# 54H60 four-blade propellers, carrying the Compass Call jamming system - the
# "spur" antenna array under the tail, pods under the outer wings, the
# blister fairings on the aft fuselage.
#
# Frame: the C-130J's (aircraft/c130j/c130j.toml): metres, x aft from the
# radome's tip, y right, z up from the ground with the aircraft parked. The
# wing, the tail, the fuselage, the sponsons, the nacelles' outline and the
# gear are the C-130J's: the C-130H and J share the airframe.
#
# Sources: Wikipedia's EC-130H article (length 98 ft 9 in, height 38 ft 3
# in, empty 101,000 lb, maximum take-off 155,000 lb, 4 x T56-A-15 of 4,591
# shp, ceiling 25,000 ft, a crew of 13); Air & Space Forces Magazine's
# EC-130H page ("300 mph at 20,000 ft"); the Purdue propulsion pages' T56-A-15
# (4,591 shp, 0.54 lb/(shp h), 1,890 lb, pressure ratio 9.6); the C-130's
# propellers turn 1,020 rpm through 13.54:1 (PPRuNe); photographs of
# EC-130Hs (Wikimedia Commons, USAF) for the antennas' places (estimates).

[aircraft]
name = "ec130h"
description = "Lockheed EC-130H Compass Call (hangar build)"
category = "electronic warfare"

[analysis]
speed = 110.0                   # m/s: the Reynolds numbers (cruise, equivalent sea-level speed)
induced_drag = "trefftz"      # a high-aspect-ratio wing's induced drag from its loading (docs/hangar.md)

# The wing: 162.1 m2 (1,745 ft2), span 40.41 m, NACA 64A318 at the root to
# 64A412 at the tip, on top of the fuselage. The centre section's constant
# 4.90 m chord runs out to 5.65 m, just past the inboard engines; the outer
# panels taper to 2.50 m at the tip (the drawing's 2.62 m gives 164.8 m2),
# their leading edge swept 2.6 deg, their trailing edge forward, 2.5 deg of
# dihedral (the three-view's front view). Twist: 3 deg at the root, 0.5 deg
# at the tip (estimate: a transport's usual washout).
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [11.150, 0.000, 4.960], chord = 4.900, twist = 3.0, airfoil = "naca64a318" },
  { le = [11.150, 5.650, 4.960], chord = 4.900, twist = 2.6, airfoil = "naca64a318" },
  { le = [11.800, 20.205, 5.596], chord = 2.500, twist = 0.5, airfoil = "naca64a412" },
]
controls = [
  # Lockheed-Fowler flaps from the fuselage to the ailerons (travel: estimate)
  { name = "flap", channel = "flap", kind = "fowler", span = [0.10, 0.68], chord_fraction = 0.30, limits = [0, 35] },
  { name = "aileron", channel = "aileron", span = [0.68, 0.97], chord_fraction = 0.26, limits = [-20, 20] },
]

# The tailplane: 16.05 m span (52.7 ft), its trailing edge straight across,
# the leading edge swept; NACA 64A012 (estimate). Carried through the
# fuselage to the centre line.
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca64a012"
sections = [
  { le = [23.640, 0.000, 4.600], chord = 3.920 },
  { le = [25.870, 8.025, 4.600], chord = 1.690 },
]
controls = [
  { name = "elevator", channel = "elevator", span = [0.12, 1.0], chord_fraction = 0.35, limits = [-25, 15] },
]

# The fin: 5.8 m root chord on the fuselage's top, 1.66 m tip, its leading
# edge swept 23 deg; its tip at the published 11.84 m height (the drawing
# puts it at 11.5 m)
[[surface]]
name = "fin"
kind = "fin"
airfoil = "naca64a012"
sections = [
  { le = [23.100, 0.000, 4.500], chord = 5.800 },
  { le = [26.220, 0.000, 11.800], chord = 1.660 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.04, 1.0], chord_fraction = 0.35, limits = [-35, 35] },
]

