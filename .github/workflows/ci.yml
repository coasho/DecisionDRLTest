name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One run per branch: a newer push cancels the one still building.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ucrt64:
    name: Windows x64 - MSYS2 UCRT64 (GCC)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Python SDK is built for a python.org CPython (the one PyTorch and
      # Gymnasium run on), not MSYS2's; its tests need numpy, and exercise the
      # Gymnasium adapter when it is there. (Stable-Baselines3 would pull in
      # PyTorch: its tests skip.) hangar's report and liveries need
      # matplotlib and Pillow.
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'

      - name: Python test dependencies
        shell: pwsh
        run: '& "${{ steps.py.outputs.python-path }}" -m pip install numpy gymnasium matplotlib pillow'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-assimp
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-zlib

      - name: Toolchain
        run: |
          echo "MSYSTEM_PREFIX=$MSYSTEM_PREFIX ($(cygpath -m "$MSYSTEM_PREFIX"))"
          gcc --version | head -1
          cmake --version | head -1
          ninja --version

      - name: VSG stack cache key
        id: vsgkey
        run: echo "key=vsg-$(git submodule status third_party/vsg third_party/vsgXchange third_party/vsgImGui | sha256sum | cut -c1-16)-$(sha256sum deps/CMakeLists.txt | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: vsgcache
        with:
          path: build/deps-ucrt64/install
          key: ${{ runner.os }}-${{ steps.vsgkey.outputs.key }}

      - name: Build VSG stack
        if: steps.vsgcache.outputs.cache-hit != 'true'
        run: |
          cmake -S deps --preset deps-ucrt64
          cd deps && cmake --build --preset deps-ucrt64

      - name: Configure (viewer + headless)
        run: cmake --preset ucrt64-release -DFSIM_PYTHON_EXECUTABLE="$(cygpath -m '${{ steps.py.outputs.python-path }}')"

      - name: Build
        run: cmake --build --preset ucrt64-release --parallel

      - name: Deploy runtime DLLs
        run: cmake --build --preset ucrt64-release --target deploy

      - name: Test
        run: ctest --preset ucrt64-release

      - name: Headless smoke run
        run: build/ucrt64-release/bin/flightsim.exe --vehicles 8 --steps 60 --benchmark

      - name: Throughput benchmark
        run: build/ucrt64-release/bin/flightsim.exe --vehicles 32 --steps 150 --benchmark

      - name: Package
        run: |
          cmake --install build/ucrt64-release --prefix dist/flightsim
          (cd build/ucrt64-release && cpack)
          dist/flightsim/bin/flightsim.exe --vehicles 2 --steps 10 --benchmark

      - uses: actions/upload-artifact@v4
        with:
          name: flightsim-win64
          path: build/ucrt64-release/package/*.zip
          if-no-files-found: error

      # A tag v<version> publishes the zip as a GitHub release.
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/ucrt64-release/package/*.zip
          generate_release_notes: true
