kind = "nacelle"
mirror = true
stations = [
  { x = 8.300, y = 10.250, w = 0.00, top = 4.190, bottom = 4.190 },
  { x = 8.650, y = 10.250, w = 0.70, top = 4.540, bottom = 3.840, n = 2.0 },
  { x = 9.250, y = 10.250, w = 1.00, top = 4.690, bottom = 3.690, n = 2.0 },
  { x = 10.050, y = 10.250, w = 1.10, top = 4.940, bottom = 3.540, n = 2.4 },
  { x = 13.050, y = 10.250, w = 1.10, top = 5.040, bottom = 3.590, n = 2.4 },
  { x = 15.550, y = 10.250, w = 0.80, top = 5.040, bottom = 4.140, n = 2.2 },
  { x = 16.850, y = 10.250, w = 0.30, top = 5.040, bottom = 4.740, n = 2.0 },
]

[[engine]]
name = "AE 2100D3 inboard"
type = "turboprop"
power_kw = 3458                 # 4,637 shp, takeoff (Wikipedia)
psfc = 0.280                    # kg/(kW h): 0.460 lb/(hp h) at takeoff (Wikipedia)
thermodynamic_power_kw = 4474   # 6,000 shp: flat-rated to 4,637 (estimate, below Rolls-Royce's 6,200 shp growth potential)
position = [10.600, 5.080, 3.950]
mirror = true
mass = 790                      # 1,740 lb dry (Wikipedia)
[engine.propeller]
position = [8.920, 5.080, 3.950]
diameter = 4.115                # 13.5 ft (Smithsonian)
blades = 6
rpm = 1020                      # 100 % (the C-130's propellers turn 1,020 rpm)
gear_ratio = 14.0               # "about 14" (Wikipedia)
blade_angle = [15, 65]          # deg at 75 % radius, the governor's range (estimate)
airfoil = "naca4409"            # estimate: a thin cambered blade section
tip_thickness = 0.06            # the thin composite tips (estimate)
chord = [[0.20, 0.25], [0.50, 0.275], [0.80, 0.225], [1.00, 0.125]]   # c/R: activity factor 157 (estimate: absorbs the rating at a standstill)
tip_sweep = 25                  # deg: the swept scimitar tips (estimate)
hub_fraction = 0.20
mass = 363                      # 800 lb (Smithsonian)
ixx = 650                       # kg m2 about the shaft: the blades' 320 and the power turbine and gears seen through the gearbox (estimate)
rotation = "cw"
handed = false                  # all four turn the same way

[[engine]]
name = "AE 2100D3 outboard"
type = "turboprop"
power_kw = 3458
psfc = 0.280
thermodynamic_power_kw = 4474
position = [10.650, 10.250, 4.190]
mirror = true
mass = 790
[engine.propeller]
position = [8.970, 10.250, 4.190]
diameter = 4.115
blades = 6
rpm = 1020
gear_ratio = 14.0
blade_angle = [15, 65]
airfoil = "naca4409"
tip_thickness = 0.06
chord = [[0.20, 0.25], [0.50, 0.275], [0.80, 0.225], [1.00, 0.125]]
tip_sweep = 25
hub_fraction = 0.20
mass = 363
ixx = 650
rotation = "cw"
handed = false

# The nose gear: twin wheels, steered, folding forward into the nose
[[gear]]
name = "Nose Gear"
position = [3.420, 0.0, -0.150]
steerable = true
max_steer = 60
wheels = 2
wheel_diameter = 0.85
wheel_width = 0.32
retractable = true
retract = "forward"
static_deflection = 0.15
attach = [3.600, 0.0, 1.300]

# The main gear: two wheels in tandem each side, each on its own strut,
# rising into the sponsons (wheel track 4.34 m), their wells drawn open
# (hangar's doors, hinged either side of a leg's swing, meet the wheel as
# it folds into the narrow sponson)
[[gear]]
name = "Main Gear Front"
mirror = true
position = [12.310, 2.170, -0.150]
wheel_diameter = 1.08
wheel_width = 0.50
retractable = true
retract = "forward"
doors = false
static_deflection = 0.15
attach = [12.310, 2.000, 2.000]

[[gear]]
name = "Main Gear Rear"
mirror = true
position = [13.820, 2.170, -0.150]
wheel_diameter = 1.08
wheel_width = 0.50
retractable = true
retract = "aft"
doors = false
static_deflection = 0.15
attach = [13.820, 2.000, 2.000]

[mass]
empty = 34274                   # 75,562 lb (Lockheed Martin)
empty_cg = [12.300, 0.0, 3.300]  # estimate: about 22 % MAC
[mass.component]                # kg (estimates: a transport's group weights)
wing = 5300
htail = 700
fin = 600
fuselage = 7000
sponson = 600
"inboard nacelle" = 500
"outboard nacelle" = 500
"Nose Gear" = 400
"Main Gear Front" = 1000
"Main Gear Rear" = 1000
[[mass.payload]]
name = "flight crew"
mass = 300                      # two pilots and a loadmaster
position = [3.300, 0.0, 3.300]
[[mass.payload]]
name = "cargo"
mass = 5000                     # 11,000 lb: with full internal fuel a mid-mission 133,000 lb (60.4 t) - the
position = [12.300, 0.0, 1.800] # weight the flight tests fly at (the normal take-off weight is 155,000 lb)
[[mass.tank]]
name = "left outer wing"
position = [12.800, -12.000, 5.200]
capacity = 5205
[[mass.tank]]
name = "left inner wing"
position = [12.800, -4.500, 4.960]
capacity = 5205
[[mass.tank]]
name = "right inner wing"
position = [12.800, 4.500, 4.960]
capacity = 5205
[[mass.tank]]
name = "right outer wing"
position = [12.800, 12.000, 5.200]
capacity = 5205

[dimensions]                    # published, overall (Lockheed Martin)
length = 29.79
span = 40.41
height = 11.84

[targets]
# C-130J, published (Wikipedia; GlobalSecurity; Lockheed Martin). hangar
# flies every test at one weight, here 60.4 t - the mid weight the top speed
# needs. The climb, 2,100 ft/min at sea level, and the ceiling, 28,000 ft
# with 42,000 lb of payload, are published at about 70 t: at 60.4 t the
# model climbs 2,770 ft/min to 32,400 ft - compared in docs/hangar.md, not
# checked here.
max_speed_ktas = 362            # at max_speed_altitude_ft: calibrates the extra drag
max_speed_altitude_ft = 22000
