name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-ucrt64:
    name: Windows x64 - MSYS2 UCRT64 (GCC)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-assimp
            mingw-w64-ucrt-x86_64-curl

      - name: Toolchain
        run: |
          echo "MSYSTEM_PREFIX=$MSYSTEM_PREFIX ($(cygpath -m "$MSYSTEM_PREFIX"))"
          gcc --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Build VSG stack
        run: |
          cmake -S deps --preset deps-ucrt64
          cd deps && cmake --build --preset deps-ucrt64

      - name: Configure (viewer + headless)
        run: cmake --preset ucrt64-release

      - name: Build
        run: cmake --build --preset ucrt64-release --parallel

      - name: Deploy runtime DLLs
        run: cmake --build --preset ucrt64-release --target deploy

      - name: Test
        run: ctest --preset ucrt64-release

      - name: Headless smoke run
        run: build/ucrt64-release/bin/flightsim.exe --vehicles 8 --steps 60 --benchmark

      - name: Throughput benchmark
        run: build/ucrt64-release/bin/flightsim.exe --vehicles 32 --steps 150 --benchmark
