# Chengdu J-10A, built by hangar from public data (published dimensions and
# estimates). A close-coupled canard delta with a chin intake, unstable in
# pitch at subsonic speeds.
#
# Frame: metres, x aft from the radome tip, y right, z up from the wing's
# root chord plane. Sources: AVIC (dimensions), Jane's and public reference
# works (weights, performance); Saturn (AL-31FN). The shape is measured off
# a three-view whose length, span and height agree with AVIC's within 1.5 %
# (17.0 m with its 0.86 m nose probe, 9.71 m, 5.71 m); the gear where it
# draws the wheels.

[aircraft]
name = "j10a"
description = "Chengdu J-10A (hangar build)"
category = "fighter"

[analysis]
speed = 250.0

# The wing as drawn: a delta, 52 deg leading edge, its trailing edge nearly
# straight (37.5 m2 to the centre line; AVIC gives 37 m2), its chord plane
# 1.4 deg down to the tips. The balance is not published: the CG sits as far
# aft as the main wheels let it (below).
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [5.820, 0.000, 0.000], chord = 7.030, airfoil = "naca64a005" },
  { le = [12.000, 4.857, -0.120], chord = 0.650, airfoil = "naca64a003" },
]
# Elevons along the whole trailing edge, as on every tailless canard delta:
# the inner ones also droop as flaps for take-off and landing
controls = [
  { name = "inner elevon", channel = "elevator", mix = { aileron = 1.0, flap = 1.0 }, span = [0.17, 0.45], chord_fraction = 0.14, limits = [-25, 25] },
  { name = "outer elevon", channel = "elevator", mix = { aileron = 1.0 }, span = [0.45, 0.93], chord_fraction = 0.22, limits = [-25, 25] },
]
# leading-edge flaps on the angle-of-attack schedule (the F-16's law stands in)
leading = [
  { name = "leading-edge flap", span = [0.30, 0.97], chord_fraction = 0.12, limits = [-3, 25] },
]

# All-moving canards on the intake's shoulders, 3.8 m2 exposed, 55 deg
# leading edge, 8 deg dihedral; the surface runs on inside the fuselage to
# the centre line, as the body carries their lift across
[[surface]]
name = "canard"
kind = "canard"
airfoil = "naca64a004"
sections = [
  { le = [3.250, 0.000, 0.850], chord = 2.920 },
  { le = [4.270, 0.720, 0.850], chord = 2.120 },
  { le = [6.370, 2.200, 1.050], chord = 0.470 },
]
controls = [
  { name = "canard", channel = "elevator", gain = -1.0, span = [0.33, 1.0], chord_fraction = 1.0, pivot = 0.35, limits = [-50, 20] },
]

# The fin, 56 deg leading edge, rising from the spine
[[surface]]
name = "fin"
kind = "fin"
airfoil = "naca64a004"
sections = [
  { le = [10.860, 0.000, 1.200], chord = 4.370 },
  { le = [14.950, 0.000, 4.130], chord = 1.160 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.20, 0.88], chord_fraction = 0.30, limits = [-30, 30] },
]

# The ventral fins under the fairings behind the wing's roots, canted 34 deg
# outboard
[[surface]]
name = "ventral"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [12.900, 1.030, 0.000], chord = 1.650 },
  { le = [13.270, 1.460, -0.600], chord = 1.280 },
]

# The fuselage: the radome and the cockpit over the chin intake, the spine
# falling to the fin, the single engine
[[body]]
name = "fuselage"
kind = "fuselage"
stations = [
  { x = 0.00, w = 0.00, top = 0.555, bottom = 0.495 },
  { x = 0.25, w = 0.32, top = 0.710, bottom = 0.410, n = 2.0 },
  { x = 0.50, w = 0.52, top = 0.830, bottom = 0.350, n = 2.0 },
