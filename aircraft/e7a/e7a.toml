# Boeing E-7A Wedgetail, built by hangar from public data: the Boeing
# 737-700 airframe with Northrop Grumman's MESA radar - the "top hat", a
# fixed plank of electronically scanned arrays on its back - the ventral
# fins that balance it, and electronic support pods on the wing tips.
#
# Frame: metres, x aft from the nose's tip, y right, z up from the cabin's
# centre line 8.9 m behind the nose; the ground is 3.14 m below that. As the
# drawing has it, the fuselage sits 1.6 deg nose down on its wheels, so its
# axis rises 0.028 m a metre aft.
#
# Sources:
# - RAAF (via the bombers-and-AEW&C research notes): span 34.31 m - the
#   737-700's wing without winglets, ESM pods on its tips - length 33.63 m,
#   height 12.57 m, maximum take-off 77,565 kg, 853 km/h (460 kt).
# - Wikipedia, E-7 Wedgetail: empty 46,606 kg, 2 x CFM56-7B27A of 121 kN
#   (27,300 lbf), ceiling 41,000 ft, a crew of 2 and up to 19 mission crew,
#   the "top hat" on its back, the ventral fins, the refuelling receptacle.
# - Wikipedia, MESA: the antenna assembly 10.8 m long and 3.4 m high.
# - Jenkinson, "Civil Jet Aircraft Design": the 737-700's wing, 124.6 m2,
#   25 deg of sweep; 6 deg of dihedral, 7 deg on the stabilizer (Boeing).
# - The shape: Julien Scavini's Boeing 737-700 four-view (Wikimedia Commons,
#   CC BY-SA 3.0), scaled by its 35.8 m span over the winglets (0.0349
#   m/px): its fuselage then measures the -700's 33.6 m and its fin 12.5 m
#   above the ground, as published (its length label, 31.20 m, is the
#   -600's). Its fuselage is drawn 3-4 % fat: the published 3.76 m width and
#   4.01 m depth are used. The MESA, the ventral fins and the ESM pods are
#   shaped from photographs of RAAF E-7As (estimates).

[aircraft]
name = "e7a"
description = "Boeing E-7A Wedgetail (hangar build)"
category = "aew"

[analysis]
speed = 150.0                 # m/s: the Reynolds numbers (climb and cruise)
max_mach = 1.2                # the tables' Mach range: through the transonic drag rise
induced_drag = "trefftz"      # a swept transport wing's induced drag from its loading (docs/hangar.md)

[reference]
area = 124.6                  # m2: the 737-700's (Jenkinson)

# The wing, off the plan view: a root glove, its leading edge swept 41 deg,
# out to a break 4.85 m out; then 25.6 deg to the tip, 17.16 m out (no
# winglets: the E-7A's pods take their place); the trailing edge straight
# across inboard of the engines, 12.6 deg outboard of 5.75 m. Low on the
# fuselage (the section view), 6 deg of dihedral. Incidence 2 deg at the
# root, washed out to -1 deg at the tip; NACA 64A sections from 15 % to 10
# % (estimate: Boeing's own are not published).
[[surface]]
name = "wing"
kind = "wing"
vortex = false
sections = [
  { le = [9.830, 0.000, -1.150], chord = 8.960, twist = 2.0, airfoil = "naca64a215" },
  { le = [13.990, 4.850, -0.640], chord = 4.800, twist = 1.2, airfoil = "naca64a212" },
  { le = [14.420, 5.750, -0.546], chord = 4.370, twist = 1.0, airfoil = "naca64a212" },
  { le = [19.880, 17.160, 0.653], chord = 1.610, twist = -1.0, airfoil = "naca64a210" },
]
# Flaps from the body to 70 % of the half span, the ailerons outboard (the
# plan view); the leading-edge slats and the spoilers are not modelled
controls = [
  { name = "flap", channel = "flap", kind = "fowler", span = [0.11, 0.70], chord_fraction = 0.28, limits = [0, 40] },
  { name = "aileron", channel = "aileron", span = [0.72, 0.95], chord_fraction = 0.22, limits = [-20, 20] },
]

# The stabilizer: 14.36 m across, its leading edge swept 29 deg, root chord
# 3.85 m at the centre line, tip 1.36 m, 7 deg of dihedral; its tips reach
# 1.5 m past the tail cone (the plan view). Set at -2 deg, the elevator
# trimming (estimate: the real one trims by its incidence).
[[surface]]
name = "htail"
kind = "htail"
vortex = false
airfoil = "naca64a010"
sections = [
  { le = [29.750, 0.000, 1.670], chord = 3.850, twist = -2.0 },
  { le = [33.730, 7.180, 2.552], chord = 1.360, twist = -2.0 },
]
controls = [
  { name = "elevator", channel = "elevator", span = [0.10, 0.95], chord_fraction = 0.30, limits = [-25, 20] },
]

# The fin: its leading edge swept 39 deg, the trailing edge 13.5 deg, root
# chord 6.1 m in the fuselage, tip 2.0 m at 9.45 m (the side view: 12.6 m
# above the ground); the rudder over most of it
[[surface]]
name = "fin"
kind = "fin"
airfoil = "naca64a010"
sections = [
  { le = [26.970, 0.000, 2.300], chord = 6.130 },
  { le = [32.790, 0.000, 9.450], chord = 2.030 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.03, 0.95], chord_fraction = 0.33, limits = [-25, 25] },
]

# The MESA antenna: a plank 10.8 m long and 0.65 m thick over the wing, its
# arrays facing either side, 3.1 m up from the fuselage's crown to the top
# hat above it (the assembly 3.4 m high: Wikipedia). A surface: its side
# force counts, as the real one's does, which the ventral fins balance.
[[surface]]
name = "MESA"
kind = "fin"
airfoil = "naca0006"
sections = [
  { le = [12.000, 0.000, 2.000], chord = 10.800 },
  { le = [12.200, 0.000, 5.150], chord = 10.400 },
]

# The ventral fins under the tail cone, canted 45 deg outboard (photographs:
# estimate)
[[surface]]
name = "ventral fin"
kind = "fin"
mirror = true
airfoil = "naca0010"
sections = [
  { le = [26.300, 0.550, -0.750], chord = 2.800 },
  { le = [27.800, 1.250, -1.450], chord = 1.400 },
]

