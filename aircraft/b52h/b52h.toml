# The bicycle gear: four two-wheel trucks under the fuselage, the forward
# pair steering (the B-52's crosswind crab, 20 deg either way, is not
# modelled), on 56x16 tyres (IPMS/USA review); track 8 ft 3 in (2.51 m).
# Their stations off the NB-52B three-view: 12.04 and 24.29 m behind the
# nose; they fold forward and aft into the fuselage (the swing fitted by
# hangar). Outriggers near the wing tips, 22.63 m out (the front view; 32 in
# tyres, estimate), standing 6 cm clear of the ground with the wing drooped,
# as drawn, their wheels folding flat into the wing. The ground line: 4.67 m
# below z = 0 (the front view).
[[gear]]
name = "Forward Main Gear"
mirror = true
position = [12.040, 1.255, -4.819]
wheels = 2
wheel_diameter = 1.422
wheel_width = 0.406
steerable = true
max_steer = 20
retractable = true
retract = "forward"
static_deflection = 0.15
attach = [12.040, 0.750, -2.300]

[[gear]]
