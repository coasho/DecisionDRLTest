  { x = 23.88, y = 15.750, w = 1.300, top = 0.334, bottom = -0.966 },
  { x = 25.08, y = 15.750, w = 1.160, top = 0.264, bottom = -0.896 },
  { x = 26.08, y = 15.750, w = 0.980, top = 0.174, bottom = -0.806 },
