# The engine nacelles under the blended centre section, their intakes square
# boxes whose mouths are raked back from the top lip
[[intake]]
name = "nacelle"
mirror = true
lip = 0.04
rake = 44
duct = 2.0
duct_rise = 0.25
duct_taper = 0.85
stations = [
  { x = 9.90, y = 1.150, w = 1.060, top = -0.120, bottom = -1.360, n = 4.5 },
  { x = 12.00, y = 1.150, w = 1.120, top = -0.050, bottom = -1.390, n = 3.8 },
  { x = 15.00, y = 1.150, w = 1.120, top = 0.050, bottom = -1.220, n = 3.4 },
