# Xi'an H-6K, built by hangar from public data: China's licence-built Tupolev
# Tu-16 airframe rebuilt as a missile carrier - a solid radar nose in place of
# the navigator's glazing, a glass cockpit, enlarged intakes for two Soloviev
# D-30KP-2 turbofans, six pylons under the wings, and an electronics cone in
# place of the tail guns.
#
# Frame: metres, x aft from the radome's tip, y right, z up from the
# fuselage's centre line (the ground is 3.51 m below it, parked).
#
# Sources:
# - Wikipedia, Xi'an H-6 (the H-6K's specifications): length 34.8 m, span
#   33 m, height 10.36 m, wing area 165 m2, empty 37,200 kg, maximum take-off
#   95,000 kg, 2 x D-30KP-2 of 118 kN, 1,050 km/h, ceiling 12,800 m, a crew
#   of 4; and its changes from the Tu-16.
# - Wikipedia, Soloviev D-30: the D-30KP-2's 117.68 kN, bypass ratio 2.24,
#   1,455 mm fan, 2,640 kg, 0.715 kg/(kgf h) in cruise.
# - The Tu-16's: wing area 164.65 m2 (tu22.ru; airwar.ru), 36,000 kg of fuel
#   (GlobalSecurity).
# - The shape is measured off Kaboldy's Tu-16 three-view (Wikimedia Commons,
#   CC BY-SA 3.0), scaled in x by the published length (0.025108 m/px) and
#   in y and z by the span (0.025326 m/px). The H-6K's nose, cockpit,
#   intakes, pylons and tail cone are shaped from photographs (estimates).

[aircraft]
name = "h6k"
description = "Xi'an H-6K (hangar build)"
category = "bomber"

[analysis]
speed = 150.0                 # m/s: the Reynolds numbers (climb and cruise)
max_mach = 1.2                # the tables' Mach range: through the transonic drag rise
induced_drag = "trefftz"      # a swept wing's induced drag from its loading (docs/hangar.md)

# The published wing area is the reference; the drawing's planform, taken to
# the centre line, has 1 % less
[reference]
area = 164.65

# The wing, measured off the plan view: the leading edge swept 41 deg out to
# a break 6.81 m out, then 35.8 deg to the tip; the trailing edge swept 21.6
# deg inboard of the gear gondolas, 27.6 deg outboard. Root chord 7.92 m, tip
# 3.0 m at the 16.44 m half span. Mid-set, its root 0.36 m above the
# fuselage's centre line, with 3.5 deg of anhedral (the front view). Incidence
# 2.5 deg at the root, washed out to -0.5 deg at the tip (estimate). The
# sections: thick at the root, where the engines are buried in it, thinner
# outboard - NACA 64A2xx from 16 % to 12 % (estimate). Round-nosed, they
# stall as sections do: no fighter's edge vortex.
[[surface]]
name = "wing"
kind = "wing"
vortex = false
sections = [
  { le = [9.410, 0.000, 0.360], chord = 7.920, twist = 2.5, airfoil = "naca64a216" },
  { le = [13.767, 5.000, 0.054], chord = 5.563, twist = 1.6, airfoil = "naca64a214" },
  { le = [15.360, 6.810, -0.057], chord = 4.933, twist = 1.2, airfoil = "naca64a214" },
  { le = [22.321, 16.440, -0.645], chord = 3.000, twist = -0.5, airfoil = "naca64a212" },
]
# Slotted flaps either side of the gear gondolas and the ailerons outboard
# (the plan view; travel an estimate)
controls = [
  { name = "inboard flap", channel = "flap", kind = "slotted", span = [0.10, 0.25], chord_fraction = 0.25, limits = [0, 35] },
  { name = "outboard flap", channel = "flap", kind = "slotted", span = [0.34, 0.60], chord_fraction = 0.25, limits = [0, 35] },
  { name = "aileron", channel = "aileron", span = [0.62, 0.96], chord_fraction = 0.22, limits = [-20, 20] },
]

# The horizontal tail: 11.44 m span, leading edge swept 45.5 deg, trailing
# edge 30.3 deg, root chord 4.27 m, tip 1.78 m, set on the fin 1.75 m above
# the fuselage's centre line (the side and front views). Fixed at -1.5 deg
# (estimate); the elevators trim it.
[[surface]]
name = "htail"
kind = "htail"
vortex = false
airfoil = "naca64a010"
sections = [
  { le = [28.300, 0.000, 1.750], chord = 4.270, twist = -1.5 },
  { le = [34.120, 5.720, 1.750], chord = 1.780, twist = -1.5 },
]
controls = [
  { name = "elevator", channel = "elevator", span = [0.08, 0.97], chord_fraction = 0.30, limits = [-25, 15] },
]

# The fin: leading edge swept 46.8 deg, trailing edge 20.7 deg, its tip 6.85
# m above the centre line (the side view), its root reaching into the
# fuselage; the rudder over most of its height (travel an estimate)
[[surface]]
name = "fin"
kind = "fin"
airfoil = "naca64a010"
sections = [
  { le = [27.020, 0.000, 1.000], chord = 6.070 },
  { le = [33.100, 0.000, 6.850], chord = 2.150 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.05, 0.95], chord_fraction = 0.30, limits = [-25, 25] },
]

