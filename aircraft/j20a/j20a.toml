# Chengdu J-20A, built by hangar from published dimensions and public
# estimates (no official weights or wing area are published: the numbers
# below are the commonly cited estimates, marked as such). A long canard
# delta with all-moving twin fins.
#
# Frame: metres, x aft from the nose tip, y right, z up from the wing's chord
# plane.

[aircraft]
name = "j20a"
description = "Chengdu J-20A (hangar build, from public estimates)"
category = "fighter"

[analysis]
speed = 260.0

# The wing: 73 m2 (estimate), span 12.88 m, 48 deg leading edge (root 9.84 m,
# tip 1.50 m to the centre line, MAC 6.69 m). The CG at 16 % of the MAC, 5 %
# of it behind the neutral point hangar finds (the real balance is not
# published): at 10 %, like the close-coupled canard deltas, its controls
# could not bring the nose down from 30 deg - the long forebody lifts ahead.
[[surface]]
name = "wing"
kind = "wing"
sections = [
  { le = [7.760, 0.000, 0.000], chord = 9.840, airfoil = "naca64a005" },
  { le = [14.912, 6.440, -0.120], chord = 1.500, airfoil = "naca64a003" },
]
controls = [
  { name = "flaperon", channel = "aileron", mix = { flap = 1.0 }, span = [0.26, 0.60], chord_fraction = 0.20, limits = [-25, 25] },
  { name = "elevon", channel = "elevator", mix = { aileron = 1.0 }, span = [0.60, 0.94], chord_fraction = 0.24, limits = [-25, 25] },
]
# leading-edge flaps on the angle-of-attack schedule (the F-16's law stands in)
leading = [
  { name = "leading-edge flap", span = [0.32, 0.97], chord_fraction = 0.12, limits = [-3, 25] },
]

# Leading-edge root extensions: from behind the canards along the intakes'
# tops out to the wing's leading edge, their edges sharp
[[surface]]
name = "lerx"
kind = "strake"
airfoil = "plate"
sections = [
  { le = [8.400, 0.000, 0.050], chord = 1.000 },
  { le = [8.400, 1.400, 0.050], chord = 0.950 },
  { le = [9.950, 2.000, 0.000], chord = 0.050 },
]

# All-moving canards over the intakes, 6.1 m2 exposed
[[surface]]
name = "canard"
kind = "canard"
airfoil = "naca64a004"
sections = [
  { le = [6.600, 0.000, 0.400], chord = 2.400 },
  { le = [6.900, 0.900, 0.400], chord = 2.200 },
  { le = [9.230, 3.000, 0.400], chord = 0.700 },
]
controls = [
  { name = "canard", channel = "elevator", gain = -1.0, span = [0.30, 1.0], chord_fraction = 1.0, pivot = 0.35, limits = [-50, 20] },
]

# Twin all-moving vertical tails, canted 20 deg outboard
[[surface]]
name = "fin"
kind = "fin"
mirror = true
airfoil = "naca64a004"
sections = [
  { le = [16.000, 1.400, 0.500], chord = 3.200 },
  { le = [17.600, 2.220, 2.760], chord = 1.200 },
]
controls = [
  { name = "fin", channel = "rudder", span = [0.0, 1.0], chord_fraction = 1.0, pivot = 0.40, limits = [-20, 20] },
]

[[surface]]
name = "ventral"
kind = "fin"
mirror = true
airfoil = "plate"
sections = [
  { le = [16.600, 1.000, -0.650], chord = 1.500 },
  { le = [17.200, 1.300, -1.200], chord = 0.800 },
]

# A long fuselage with the diverterless intakes from 6 m and the weapons
# bays
[[body]]
name = "fuselage"
kind = "fuselage"
stations = [
  { x = 0.00, w = 0.00, top = -0.050, bottom = -0.150 },
  { x = 1.80, w = 0.90, top = 0.300, bottom = -0.450, n = 2.4 },
  { x = 4.00, w = 1.30, top = 0.550, bottom = -0.600, n = 2.6 },
  { x = 6.00, w = 1.70, top = 0.600, bottom = -0.800, chine = -0.050, n_top = 2.2, n_bottom = 2.4 },
  { x = 7.00, w = 1.90, top = 0.550, bottom = -0.950, chine = -0.080, n_top = 2.4, n_bottom = 2.8 },
  { x = 10.00, w = 3.00, top = 0.500, bottom = -1.050, chine = -0.150, n_top = 3.4, n_bottom = 4.0 },
  { x = 14.00, w = 2.80, top = 0.450, bottom = -0.950, n = 3.4 },
  { x = 18.00, w = 2.40, top = 0.350, bottom = -0.700, n = 3.0 },
  { x = 20.40, w = 2.00, top = 0.250, bottom = -0.550, n = 2.6 },
]

# Diverterless side intakes under the canards: caret-shaped, their lips
# swept back and leaning back from the bottom lip
[[intake]]
name = "intake"
mirror = true
lip = 0.035
rake = -20
sweep = 22
duct = 1.8
duct_rise = 0.15
duct_taper = 0.85
stations = [
  { x = 6.40, y = 1.080, w = 0.640, top = 0.080, bottom = -0.950, n = 3.0 },
  { x = 8.00, y = 1.160, w = 0.700, top = 0.080, bottom = -1.000, n = 3.2 },
  { x = 10.00, y = 1.160, w = 0.660, top = 0.050, bottom = -1.020, n = 3.4 },
  { x = 11.80, y = 1.050, w = 0.500, top = -0.050, bottom = -0.950, n = 3.2 },
]

[[body]]
name = "canopy"
kind = "pod"
stations = [
  { x = 3.800, w = 0.00, top = 0.620, bottom = 0.600 },
  { x = 4.500, w = 0.74, top = 1.100, bottom = 0.580, n = 2.0 },
  { x = 5.700, w = 0.88, top = 1.250, bottom = 0.580, n = 2.0 },
  { x = 6.900, w = 0.74, top = 1.120, bottom = 0.590, n = 2.0 },
  { x = 8.000, w = 0.30, top = 0.760, bottom = 0.580, n = 2.0 },
]

[[engine]]
name = "WS-10C"
type = "turbofan"
mirror = true
thrust_dry_kn = 88.0          # estimate
thrust_wet_kn = 142.0         # estimate
bypass_ratio = 0.55
tsfc_dry = 0.76
tsfc_wet = 1.95
design_mach = 2.0
position = [16.500, 0.600, -0.400]
mass = 1600
inlet_x = 6.0
[engine.nozzle]
position = [20.200, 0.600, -0.400]

[[gear]]
name = "Nose Gear"
position = [7.200, 0.0, -2.100]
steerable = true
max_steer = 60
wheel_diameter = 0.60
wheel_width = 0.18
retractable = true
static_deflection = 0.14
attach = [7.200, 0.000, -0.650]

[[gear]]
name = "Main Gear"
mirror = true
position = [13.350, 1.600, -2.100]
wheel_diameter = 0.94
wheel_width = 0.30
retractable = true
static_deflection = 0.18
attach = [13.150, 1.150, -0.750]
retract = "forward"

[reference]
aero_point = [11.580, 0.0, 0.0]    # 0.17 MAC

[flight_control]
type = "fbw"
n_max = 9.0
n_min = -3.0
alpha_max_deg = 30.0
roll_rate_deg_s = 250.0

[mass]
empty = 19400                 # estimate
empty_cg = [11.630, 0.0, -0.350]
# no published inertia: radii of gyration of the class
gyration = [0.260, 0.430, 0.540]
[[mass.payload]]
name = "pilot"
mass = 100
position = [6.000, 0.0, 0.600]
[[mass.payload]]
name = "internal missiles"    # 4 PL-15, 2 PL-10
mass = 1020
position = [12.000, 0.0, -0.800]
[[mass.tank]]
name = "fuselage 1"           # internal fuel, 10,500 kg (estimate)
position = [9.280, 0.0, -0.200]
capacity = 3200
[[mass.tank]]
name = "fuselage 2"
position = [11.780, 0.0, -0.200]
capacity = 3300
[[mass.tank]]
name = "fuselage 3"
position = [13.980, 0.0, -0.250]
capacity = 1800
[[mass.tank]]
name = "left wing"
position = [12.580, -3.200, 0.000]
capacity = 1100
[[mass.tank]]
name = "right wing"
position = [12.580, 3.200, 0.000]
capacity = 1100

[dimensions]                  # published, overall, gear down (public estimates):
length = 20.40                 # m
span = 12.88
height = 4.45

[targets]
# J-20A, public estimates
max_mach = 2.0                # at altitude, full afterburner
max_mach_altitude_ft = 36000
service_ceiling_ft = 66000
