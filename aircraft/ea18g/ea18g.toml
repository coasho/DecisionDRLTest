  { x = 1.00, w = 0.780, top = -0.100, bottom = -0.785, n = 2.0 },
  { x = 1.50, w = 0.960, top = 0.035, bottom = -0.820, n = 2.1 },
  { x = 2.00, w = 1.020, top = 0.150, bottom = -0.855, n = 2.2 },
  { x = 2.60, w = 1.040, top = 0.300, bottom = -0.870, n = 2.3 },
  { x = 3.30, w = 1.070, top = 0.420, bottom = -0.870, n = 2.4 },
  { x = 4.50, w = 1.140, top = 0.470, bottom = -0.880, n_top = 2.5, n_bottom = 2.6 },
  { x = 5.50, w = 1.240, top = 0.500, bottom = -0.900, n_top = 2.6, n_bottom = 2.8 },
  { x = 6.60, w = 1.360, top = 0.520, bottom = -0.920, n_top = 2.8, n_bottom = 3.0 },
  { x = 8.00, w = 1.900, top = 0.540, bottom = -0.950, chine = -0.150, n_top = 3.0, n_bottom = 2.4 },
  { x = 10.00, w = 2.500, top = 0.520, bottom = -0.960, chine = -0.200, n_top = 3.2, n_bottom = 2.6 },
  { x = 12.00, w = 2.550, top = 0.460, bottom = -0.980, chine = -0.250, n_top = 3.2, n_bottom = 2.8 },
  { x = 13.50, w = 2.300, top = 0.380, bottom = -1.050, chine = -0.300, n = 3.0 },
  { x = 15.00, w = 2.100, top = 0.250, bottom = -1.100, n = 2.8 },
  { x = 16.30, w = 1.950, top = 0.120, bottom = -1.000, n = 2.5 },
  { x = 17.00, w = 1.800, top = 0.020, bottom = -0.900, n = 2.3 },
]

# The Super Hornet's dorsal spine: from the canopy's aft end, falling towards
# the fins
[[body]]
name = "spine"
kind = "pod"
aero = false                  # part of the fuselage's top: the tables leave it out
stations = [
  { x = 6.900, w = 0.400, top = 0.960, bottom = 0.460, n = 2.4 },
  { x = 7.600, w = 0.960, top = 1.000, bottom = 0.420, n = 2.6 },
  { x = 8.800, w = 1.100, top = 0.720, bottom = 0.380, n = 2.8 },
  { x = 10.000, w = 1.100, top = 0.660, bottom = 0.360, n = 2.8 },
  { x = 11.800, w = 1.000, top = 0.520, bottom = 0.320, n = 2.8 },
  { x = 12.800, w = 0.860, top = 0.450, bottom = 0.300, n = 2.6 },
  { x = 14.500, w = 0.500, top = 0.300, bottom = 0.200, n = 2.4 },
  { x = 15.300, w = 0.100, top = 0.120, bottom = 0.020, n = 2.0 },   # its end inside the fuselage
]

# The fixed caret intakes under the LEX: the lip plane swept 30 deg (its
# outboard edge behind its inboard one) and raked 48 deg (its top ahead of
# its bottom), the outer wall leaning out 12 deg at the top; the ducts run
# back along the belly to the engine bays
[[intake]]
name = "intake"
mirror = true
lip = 0.035
rake = 48
sweep = 30
duct = 1.6
duct_rise = 0.25
duct_taper = 0.85
stations = [
  { x = 8.80, y = 1.000, w = 0.740, top = -0.100, bottom = -1.220, n_top = 4.0, n_bottom = 4.0, lean = 6 },
  { x = 10.00, y = 0.960, w = 0.820, top = -0.120, bottom = -1.290, n_top = 4.0, n_bottom = 5.0, lean = 4 },
  { x = 11.50, y = 0.900, w = 0.900, top = -0.160, bottom = -1.320, n_top = 3.6, n_bottom = 5.5 },
  { x = 12.80, y = 0.860, w = 0.880, top = -0.220, bottom = -1.300, n_top = 3.2, n_bottom = 5.0 },
  { x = 14.00, y = 0.780, w = 0.640, top = -0.280, bottom = -1.180, n = 3.0 },
  { x = 15.20, y = 0.680, w = 0.300, top = -0.320, bottom = -1.050, n = 2.6 },
]

