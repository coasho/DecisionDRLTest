# Bell UH-1H Iroquois - flown by NASA's own mathematical model of it:
#   TM   P. D. Talbot, L. D. Corliss, "A Mathematical Force and Moment Model of a UH-1H Helicopter
#        for Flight Dynamics Simulations", NASA TM-73254, 1977 - tables 1-3, eq. 1-60, figures 2-9
#        (step responses of the aircraft and of the model, at hover and 60 kt).
#   CP   D. A. Boxwell, Y. H. Yu, F. H. Schmitz, "Hovering Impulsive Noise: Some Measured and
#        Calculated Results", NASA CP-2052, 1978 - the blade's twist.
#   T53  the T53-L-13B's 1,400 shp, limited to 1,100 by the power train (aircav.com, "T53-L-13").
#   FUEL the crashworthy cells full, as the gauge reads (uh1ops.com, "UH-1D/H/V Fuel System", after
#        TM 55-1520-210-23-2); a T53's fuel flow on a Huey (AOPA Pilot, March 2014, "The Bell UH-1B
#        Huey": 514 lb/h at 75 % of its T53-L-11's 1,100 shp).
# Every number is the source's unless the note says otherwise. The report gives English units;
# they are kept. Frame: its stations (in, aft), butt lines (in, right), water lines (in, up).
# Senses here, whatever the report's: stick + forward and + right, pedal + right, collective +
# up; cyclic + tilts the rotor's thrust forward (longitudinal) or right (lateral).

[aircraft]
name = "uh1h"
kind = "helicopter"
category = "helicopter"
description = "Bell UH-1H Iroquois - single main rotor, two blades, teetering, Bell stabilizer bar (NASA TM-73254)"

[mass]
weight_lb = 6158.0                 # as flight-tested (TM table 3)
cg_in = [140.0, 0.0, 55.0]         # x_cg -0.541 ft from the hub (table 3); w.l. 55 (table 2)
ixx = 2800.0                       # slug ft2, table 3 (Bell data)
iyy = 12733.0
izz = 10800.0
ixz = 1480.0                       # the product of inertia, + for mass aft and above the c.g.

[rotor.main]
radius_ft = 24.13                  # table 2
chord_ft = 1.75
blades = 2
rpm = 323.7                        # R4 = 1/Omega = 2.95e-2 s (table 3): table 2's 760 ft/s tip speed disagrees
lift_slope = 5.73                  # R5 = 1/(4a) = 4.36e-2
twist_deg = -10.9                  # CP: "root-to-tip washout of 10.9 deg"
hinge_offset_ft = 0.0              # teetering
flap_lag_s = 0.144                 # 16/(gamma Omega) as the report flew it: one blade's is 0.072 s, but 0.144 was
                                   # "retained because subjectively more realistic handling qualities resulted"
                                   # (table 3 note a), and it flies the flight records better (docs/rotorcraft.md)
hub_in = [133.5, 0.0, 136.5]       # table 2
mast_tilt_deg = 5.0                # forward
sense = "ccw"                      # seen from above
force_model = "classical"          # TM eq. 1-4: the report's own rotor equations
tip_loss = 1.0                     # the report has none
inflow_lag_s = 0.1                 # the report's inflow is quasi-static; this lag's effective one is ~0.03 s
ground_effect_g1 = 0.28            # K_G = 1 - exp(-(Z/D)/G1), eq. 10a (table 3)

[rotor.tail]
radius_ft = 4.25                   # table 2
chord_ft = 0.70
blades = 2
tip_speed_fps = 740.0
lift_slope = 5.73
twist_deg = 0.0                    # untwisted (an estimate: the report models no twist)
lock = 4.0                         # an estimate: the report does not give the tail rotor's
hub_in = [469.7, -12.0, 118.7]     # the operator's manual (TM 55-1520-210-10, p. 29): its three-view, registered
                                   # at the main rotor's hub (below), puts the hub 10 ft 2.5 in over the ground,
                                   # 18 in under the main rotor's; TM-73254's table 2 gives station 479.4, water line
                                   # 137.5 - above the main rotor's - which no drawing of the aircraft shows. The
                                   # butt line (left of the pylon) an estimate
thrust = "right"                   # against the main rotor's torque
force_model = "classical"
tip_loss = 1.0
inflow_lag_s = 0.1
# The report fitted its tail rotor's damping to the flight records: T4 = 14.9 lb/(ft/s) (table 3,
# eq. 37), several times the isolated rotor's. The difference acts at the tail rotor.
damping_lb_per_fps = 14.9
damping_arm_ft = [28.0, 6.88]      # l_TR, h_TR (table 3)

[engine]
type = "turboshaft"
count = 1
power_shp = 1100.0                 # T53
# fractions of the power limit per rad/s of rotor speed error: a design choice (the report flies a
# constant rpm); the rotors' load is fed forward, so the rpm holds unless the power runs out
governor = { kp = 0.295, ki = 0.295, kd = 0.0, lag_s = 0.0 }
sfc_lb_per_shp_h = 0.623           # FUEL: 514 lb/h at 825 shp, the nearest a T53 has published on a Huey

[fuel]
# the cells full, 1,400 lb (FUEL): full as it spawns, their fuel part of the weight above (the airframe
# the rest), at the c.g. - so the aircraft spawns as TM flies it
capacity_lb = 1400.0

[controls]
travel_in = { lateral = 12.6, longitudinal = 12.9, pedal = 6.9, collective = 11.0 }   # table 2, full throw
# TM eq. 23-34: A1C = C4 da + A1CB + A1CL, B1C = C1 de + B1CB + B1CL; the control axis follows
# with the flapping lag (tau_R = R6)
lateral_rad_per_in = 0.0277        # C4
longitudinal_rad_per_in = 0.0324   # C1 (the report's de is + forward)
lateral_rigging_rad = -0.0486      # A1CL (table 3): left
# B1CL = 0.081 rad (table 3) was fitted to Bell's trim data with the hub 0.541 ft ahead of the
# c.g. in the shaft's axes - the report's raw stations and water lines (its p. 2). With the 5 deg
# mast the real c.g. is 0.63 in ahead of the mast, and hover needs 0.0874 rad less forward
# cyclic: the rigging moves by that, so the stick trims where the report's (and Bell's) did.
longitudinal_rigging_rad = -0.0064
collective_rad_per_in = 0.025      # C5: the report's untwisted blade pitch, the 3/4-radius pitch
collective_lag_s = 0.20            # tau_C (table 3), fitted to the flight records' a_z
pedal_rad_per_in = -0.071          # C6 (pedal + right: less tail rotor pitch)
pedal_zero_rad = 0.119             # C7
stabilizer_bar = { gain_s = 0.528, tau_s = 3.3 }   # K_B, tau_B (table 3, Bell): B1CB = K_B q/(tau s + 1), A1CB = -K_B p/(...)

[airframe]
model = "tm73254"                  # eq. 42-60, in the report's body axes - the shaft's
fuselage = { d1 = 0.022, d2 = 0.201, d3 = 0.646, l1 = 0.0654, y1 = 0.0654, m1 = 0.956, n1 = 0.956 }  # lb/(ft/s)^2, ft lb/(ft/s)^2
stabilizer = { h1 = 0.031, h4 = 0.0083, arm_ft = 19.67, stall_deg = 20.0 }
fin = { k1 = 0.0292, f1 = 0.016, arm_ft = 25.0, stall_deg = 20.0 }
# stabilizer incidence (rad) against the longitudinal stick (in, + forward), table 1 (the UH-1B's)
stabilizer_incidence = [[-6.45, 0.0224], [-6.0, 0.0174], [-5.0, 0.0], [-4.0, -0.0192], [-3.0, -0.0384],
                        [-2.0, -0.0541], [-1.0, -0.0690], [0.0, -0.0820], [1.0, -0.0850], [2.0, -0.0803],
                        [3.0, -0.0628], [4.0, -0.0300], [5.0, 0.0035], [6.0, 0.0593], [6.45, 0.0942]]

[ground]
# the skids' bottoms where the three-view draws them (the airframe below): 8 ft 6.6 in apart, the
# flat from station 35 to 155, water line -2.6 on the ground line
contacts_in = [[35.0, -51.3, -2.6], [155.0, -51.3, -2.6], [35.0, 51.3, -2.6], [155.0, 51.3, -2.6]]
kind = "skid"
spring_lbf_per_ft = 20000.0
damping_lbf_per_fps = 2000.0

[envelope]
# the bounds of the platform's commands - design choices, not the aircraft's limits - and its Vne
bank_max_deg = 45.0
pitch_min_deg = -30.0
pitch_max_deg = 30.0
roll_rate_max_deg_s = 60.0
cas_max_kt = 124.0                 # Vne to 7,500 lb, sea level to 2,000 ft (TM 55-1520-210-10, ch. 5 sec. V,
                                   # as the FAA's TCDS R00005SE repeats it)

[operations]
# The wind it hovers, lands and lifts in at most, from any side (docs/flight-autonomy.md, 4.66). Source: TM 55-1520-210-10
# (UH-1H/V operator's manual) as its limitations are summarised in training and simulation material: crosswind and
# tailwind for hovering 30 kt, sideward and rearward flight 30 kt (the manual itself not seen).
wind_kt = 30

[targets]
# TM-73254's flight records (figures 2-9, read from the scans; step sizes measured on the
# control traces) and the report's model; the fly stage checks the model against them
hover_collective_in = 5.5          # figure 9: the aircraft (the report's model trims at ~3.9 in)
trim_long_60kt_in = 1.2            # figure 2

[model]
# What is drawn beyond the airframe's shape below: the rotors' look (their size, hub, shaft,
# blades and sense are the flight model's, [rotor.main] and [rotor.tail]). TM-73254 table 2's
# precone; the stabilizer bar 9 ft 0.5 in across (TM 55-1520-210-10's front view); the tips'
# yellow, the tail rotor's white and red bands and the pitch drawn a hover's: the look's; which
# way the tail rotor turns (its top blade aft) an assumption - the flight model does not use it.
[model.main_rotor]
airfoil = "naca0012"
root = 0.14
pitch_75_deg = 8.0
precone_deg = 2.75
hub = "teetering"
hub_radius = 0.20
grip_radius = 0.075
colour = "#2a2c2b"
tip_colour = "#d9b43c"
tip_fraction = 0.04
bar = { span_m = 2.756, below_m = 0.30, rod_radius_m = 0.022, weight_length_m = 0.36, weight_radius_m = 0.05 }

[model.tail_rotor]
airfoil = "naca0012"
root = 0.2
pitch_75_deg = 6.0
hub = "teetering"
hub_radius = 0.07
grip_radius = 0.03
colour = "#e8e8e4"
tip_colour = "#c42b2b"
tip_fraction = 0.12
top_blade = "aft"

