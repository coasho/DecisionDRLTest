[targets]
# The top speed with its height: 555 kt, Mach 0.906, at 20,700 ft (the
# Standard Aircraft Characteristics, as thisdayinaviation.com and
# GlobalSecurity quote them: "639 mph at 20,700 feet, Mach 0.91"). The USAF
# fact sheet's "650 mph (Mach 0.84)" - 0.86 in other editions - gives no
# height, and does not square with itself: 650 mph is Mach 0.86 only near
# sea level, where the B-52 is held to 390 KIAS, and Mach 0.98 at 36,000 ft.
max_mach = 0.906
max_mach_altitude_ft = 20700
service_ceiling_ft = 50000    # USAF fact sheet; the SAC charts give 46,900-47,700 ft at combat weight
# climb: 6,270 ft/min (Wikipedia) - at an unstated weight, so not a target
