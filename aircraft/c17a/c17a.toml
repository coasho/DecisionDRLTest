# Boeing (McDonnell Douglas) C-17A Globemaster III, built by hangar from
# public data: the strategic airlifter, four F117 turbofans under a high,
# swept supercritical wing with winglets, a T-tail over the upswept aft
# fuselage and its ramp, the main gear in sponsons either side.
#
# Frame: metres, x aft from the radome's tip, y right, z up from the ground,
# the aircraft parked on its gear. Sources:
#   - USAF flight manual T.O. 1C-17A-1 (Change 14, 2001): its three-view
#     (public domain, Wikimedia Commons "McDonnell Douglas C-17A Globemaster
#     III 3-view line drawing.png") and the dimensions printed on it: length
#     174 ft, span 169 ft 10 in over the winglets, height 55 ft 1 in, the
#     engine inlets 34 ft 8 in and 47 ft 10 in behind the nose and 24 ft 10 in
#     and 46 ft 8 in out, the nose gear 11 ft behind the nose and the main
#     gear 65 ft 10 in behind it (its two axles 8 ft 1 in apart), the winglets
#     2.7 m tall and canted 15 deg, the nacelles 7 ft 8 in and 8 ft 11 in off
#     the ground. The drawing is measured at its 174 ft length; where it and a
#     printed dimension differ (the engines by up to 0.9 m), the dimension is
#     used.
#   - USAF and Boeing fact sheets, Jane's: wing area 3,800 ft2, aspect ratio
#     7.165, 25 deg quarter-chord sweep, supercritical sections; horizontal
#     tail 845 ft2, 65 ft span, aspect ratio 5.0, 27 deg sweep; fuselage 22 ft
#     6 in wide; empty 282,500 lb, maximum take-off 585,000 lb, 35,546 US gal
#     of fuel (107,600 kg); 4 x 40,440 lbf, bypass ratio 5.9.
#   - FAA Order 5300.7: the main gear is two triple-wheel struts in tandem
#     each side ("2T"), the nose gear a twin.
# Estimates are marked "estimate".

[aircraft]
name = "c17a"
description = "Boeing C-17A Globemaster III (hangar build)"
category = "transport"

[analysis]
speed = 130.0                # m/s: the Reynolds numbers of the cruise (230 m/s at 28,000 ft, its viscosity)
max_mach = 1.2               # the tables' Mach range: through the transonic drag rise
induced_drag = "trefftz"     # a swept transport wing's induced drag from its loading (docs/hangar.md)

# The wing: straight leading and trailing edges from the root to the
# winglet, 28.6 deg leading edge, 11.4 deg trailing edge (the flight manual's
# drawing), so 25 deg at the quarter chord; a trapezoid of 350.8 m2 to the
# centre line (the published 353 m2), span 50.29 m inside the winglets
# (aspect ratio 7.165), root 11.28 m, tip 2.67 m. Anhedral 4.4 deg (the
# drawing's front view: the tip 4.2 m off the ground, the published 13 ft 10
# in dry). Supercritical sections, about 15 % thick at the root and 12 % at
# the tip (estimate: NACA 6A sections of that thickness and a 0.4 design
# lift stand in); incidence 2 deg at the root, washed out to -1.5 at the tip
# (estimate). The winglets continue the chain: 2.7 m tall, canted 15 deg
# outboard (the drawing), swept, their tip 0.85 m.
[[surface]]
name = "wing"
kind = "wing"
vortex = false                # thick, round-nosed sections: they stall, no fighter's vortex regime
sections = [
  { le = [12.430, 0.000, 6.330], chord = 11.280, twist = 2.0, airfoil = "naca64a415" },
  { le = [26.120, 25.150, 4.380], chord = 2.670, twist = -1.5, airfoil = "naca64a412" },
  { le = [28.420, 25.850, 6.990], chord = 0.850, twist = 0.0, airfoil = "naca64a010" },
]
controls = [
  # externally blown, double-slotted flaps from the fuselage to 19 m out,
  # 28 % of the chord (the drawing); 40 deg (estimate)
  { name = "flap", channel = "flap", kind = "slotted", span = [0.126, 0.679], chord_fraction = 0.28, limits = [0, 40] },
  # ailerons from 19.4 to 24.8 m out (the drawing), 26 % of the chord
  { name = "aileron", channel = "aileron", span = [0.697, 0.891], chord_fraction = 0.26, limits = [-20, 20] },
]

# The T-tail's horizontal tail on the fin's top: 845 ft2 published, 65 ft
# span, 27 deg quarter-chord sweep; 31.5 deg leading edge, root 5.95 m, tip
# 2.05 m (the drawing, its chords 3 % less to the published area); 4 deg
# anhedral (the front view). The stabilizer trims in the real aircraft; here
# the elevators do. Elevators 35 % of the chord (the drawing); travel
# (estimate).
[[surface]]
name = "htail"
kind = "htail"
airfoil = "naca64a010"
sections = [
  { le = [44.290, 0.000, 15.850], chord = 5.950 },
  { le = [50.320, 9.905, 15.160], chord = 2.050 },
]
controls = [
  { name = "elevator", channel = "elevator", span = [0.07, 1.0], chord_fraction = 0.35, limits = [-25, 20] },
]

# The fin: swept 41 deg, its chord a constant 8.25 m from the fuselage to
# the tail's fairing (the drawing); its tip stops 0.35 m under the
# horizontal tail's plane, inside the fairing that joins them. Two-piece
# rudder, 30 % of the chord (estimate).
[[surface]]
name = "fin"
kind = "fin"
airfoil = "naca64a012"
sections = [
  { le = [36.830, 0.000, 7.550], chord = 8.240 },
  { le = [43.520, 0.000, 15.500], chord = 8.260 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.05, 0.95], chord_fraction = 0.30, limits = [-25, 25] },
]

