[dimensions]                  # published, overall, gear down (USAF)
length = 50.50                # m: 165 ft 6 in with the boom
span = 48.10                  # m: 157 ft 8 in
height = 15.90                # m: 52 ft 1 in

[targets]
# Published: maximum Mach about 0.86 (the 767's MMO), service ceiling
# 40,100 ft (USAF, Boeing). The top speed is flown where the 767's VMO, 360
# KIAS, meets its MMO: about 26,000 ft (computed). At 179 t the model cannot
# hold level flight at 35,000 ft (its ceiling is 30,600 ft; the neutral
# point hangar finds, 67 % of the MAC, looks aft for a 767 and its trim drag
# high up with it).
max_mach = 0.86
max_mach_altitude_ft = 26000
operational_ceiling_ft = 40100  # USAF: a clearance
