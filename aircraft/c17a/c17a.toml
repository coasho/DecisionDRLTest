# The pylons: blades from each nacelle's top up into the wing
[[strut]]
name = "inboard pylon"
from = [15.300, 7.570, 5.000]
to = [15.300, 7.570, 6.150]
chord = 3.600
thickness = 0.420

[[strut]]
name = "outboard pylon"
from = [19.200, 14.220, 4.620]
to = [19.200, 14.220, 5.650]
chord = 3.200
thickness = 0.400

# Pratt & Whitney F117-PW-100 (PW2040): 40,440 lbf, bypass ratio 5.9,
# 7,100 lb dry, 146.8 in long (Pratt & Whitney; USAF). Take-off fuel flow
# about 0.34 lb/lbf/h (estimate); flat rated, its throttle ratio 1.05
# (estimate). Each engine's mass at its middle, its core nozzle 0.85 m
# across at the nacelle's end (estimate).
[[engine]]
name = "F117 inboard"
type = "turbofan"
mirror = true
thrust_dry_kn = 179.9
bypass_ratio = 5.9
tsfc_dry = 0.34
throttle_ratio = 1.05
design_mach = 0.85
position = [13.100, 7.570, 4.020]
inlet_x = 10.57
mass = 3221
[engine.nozzle]
position = [17.320, 7.570, 4.020]
diameter = 0.85
length = 0.55
petal_open_deg = 0.0

[[engine]]
name = "F117 outboard"
type = "turbofan"
mirror = true
thrust_dry_kn = 179.9
bypass_ratio = 5.9
tsfc_dry = 0.34
throttle_ratio = 1.05
design_mach = 0.85
position = [17.110, 14.220, 3.640]
inlet_x = 14.58
mass = 3221
[engine.nozzle]
position = [21.330, 14.220, 3.640]
diameter = 0.85
length = 0.55
petal_open_deg = 0.0

# The gear (the flight manual): the nose gear 11 ft behind the nose, a twin
# on 40x16 tyres; each side two triple-wheel struts in tandem 8 ft 1 in
# apart, the aft one 65 ft 10 in behind the nose gear, 50x21 tyres, the
# outer tyres 33 ft 8 in apart, retracting into the sponsons (folding aft:
# estimate)
[[gear]]
name = "Nose Gear"
position = [3.350, 0.0, -0.150]
steerable = true
max_steer = 60
wheels = 2
wheel_diameter = 1.016
wheel_width = 0.406
retractable = true
static_deflection = 0.15
attach = [3.350, 0.0, 2.000]

[[gear]]
name = "Main Gear Fwd"
mirror = true
position = [20.960, 3.750, -0.150]
wheels = 3
wheel_diameter = 1.270
wheel_width = 0.533
retractable = true
retract = "aft"
door_reach = 1.2              # three wheels abreast: the doors swing well clear
static_deflection = 0.15
attach = [20.960, 3.900, 2.300]

[[gear]]
name = "Main Gear Aft"
mirror = true
position = [23.420, 3.750, -0.150]
wheels = 3
wheel_diameter = 1.270
wheel_width = 0.533
retractable = true
retract = "aft"
door_reach = 1.2              # three wheels abreast: the doors swing well clear
static_deflection = 0.15
attach = [23.420, 3.900, 2.300]

# The C-17's quadruple fly-by-wire (USAF; Boeing): hangar's control laws with
# a transport's limits (estimate): +2.5 / -1 g, the angle of attack held to
# 14 deg (the stall is at 21), roll rate to 35 deg/s. Flown with direct
# controls the tables give a dutch roll damped 0.06, under MIL-F-8785C's 0.08:
# the real aircraft's yaw damper is part of its flight controls.
[flight_control]
type = "fbw"
n_max = 2.5
n_min = -1.0
alpha_max_deg = 14.0
roll_rate_deg_s = 35.0

[reference]
area = 353.0                  # m2: 3,800 ft2, published
span = 50.29                  # m: the published aspect ratio's, inside the winglets
chord = 7.86                  # m: the reference trapezoid's mean aerodynamic chord
aero_point = [20.10, 0.0, 4.60]   # at the loaded CG

[mass]
empty = 128100                # kg: 282,500 lb operating empty
empty_cg = [20.50, 0.0, 4.30] # estimate: placed from the neutral point the aero stage finds
# radii of gyration (estimate): the Boeing 747's (Heffley and Jewell, NASA
# CR-2144: Ixx 18.2, Iyy 33.1, Izz 49.7 million slug ft2 at 636,600 lb),
# reduced for the fuel the empty aircraft does not carry
gyration = [0.27, 0.36, 0.45]
[mass.component]              # kg, estimates: jet-transport weight fractions of the take-off weight (Roskam)
wing = 27000
htail = 3000
fin = 2800
fuselage = 33000
sponson = 2000
"wing fairing" = 600
"tail fairing" = 400
"inboard nacelle" = 2000
"outboard nacelle" = 2000
"Nose Gear" = 1400
"Main Gear Fwd" = 4800
"Main Gear Aft" = 4800
[[mass.payload]]
name = "pilots"
mass = 200
position = [3.600, 0.0, 5.300]
[[mass.payload]]
name = "loadmaster"
mass = 100
position = [9.000, -1.500, 2.200]
# 107,600 kg of fuel (35,546 US gal), in the wing (estimate: the split and
# where each tank's fuel sits)
[[mass.tank]]
name = "centre wing"
position = [16.900, 0.0, 6.600]
capacity = 17600
[[mass.tank]]
name = "left inboard"
position = [19.600, -6.500, 6.100]
capacity = 23000
[[mass.tank]]
name = "right inboard"
position = [19.600, 6.500, 6.100]
capacity = 23000
[[mass.tank]]
