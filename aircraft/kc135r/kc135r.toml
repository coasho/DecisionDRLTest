# Boeing KC-135R Stratotanker, built by hangar from public data: the C-135
# airframe (Boeing 717) re-engined with four CFM International F108-CF-100
# (CFM56-2B1) high-bypass turbofans, the flying boom under its tail.
#
# Frame: metres, x aft from the radome's tip, y right, z up from the wing
# root's chord plane (the ground is 2.11 m below it, parked).
#
# Sources:
# - USAF KC-135 fact sheet (via Wikipedia's KC-135R specifications): span
#   130 ft 10 in, length 136 ft 3 in, height 41 ft 8 in, wing area 2,433 ft2,
#   35 deg of sweep, MTOW 322,500 lb, 200,000 lb of fuel, 21,634 lbf engines,
#   530 mph at 30,000 ft, 50,000 ft ceiling.
# - The shape is measured off two public-domain USAF drawings: T.O.
#   1C-135(K)A-2-3's dimensioned three-view of the KC-135A (Wikimedia Commons,
#   "Boeing KC-135A Stratotanker 3-view line drawing.png": 128 ft 10 in nose
#   to tail cone, 134 ft 6 in to the stowed boom, 12 ft 0 in fuselage width,
#   13 ft 10 in depth, 17 ft 10 in to its top, 45 ft 8 in wheelbase, 22 ft 1 in
#   track, 39 ft 8 in stabilizer span, the engines 27 ft 2 in and 46 ft 1 in
#   out) and the USAF line drawing of a tall-finned C-135 (Wikimedia Commons,
#   "Boeing KC-135 Stratotanker line drawing - USAF medium res.png": 135 ft
#   1 in long, 41 ft 8 in high). Each view is scaled by its own dimension
#   lines (the scans stretch 1-4 % between views). The KC-135R's F108
#   nacelles are shaped from photographs (Wikimedia Commons: the KC-135R's
#   first flight, 4 Aug 1984, USAF; 62-3556 at Brussels; a Tennessee ANG
#   KC-135R head on, USAF).
# - The reference wing: a trapezoid to the centre line with the drawing's
#   37.9 deg leading edge (tan 0.7805) and the published area: root 8.554 m,
#   tip 2.780 m, so its MAC is 6.157 m with its leading edge 16.68 m behind the
#   nose - the KC-135's published MAC, 241.9 in, and LEMAC, body station
#   786.2 (the radome's tip is BS 130).
# - CFM56-2B1 / F108: 22,000 lbf class, bypass ratio 6.0, 1.73 m fan, 2,120 kg
#   dry, TSFC 0.37 static and 0.65 in cruise (Wikipedia, CFM International).
# - Tyres: 49x17 main, 38x11 nose (Goodyear's aviation application chart).

[aircraft]
name = "kc135r"
description = "Boeing KC-135R Stratotanker (hangar build)"
category = "transport"

[analysis]
speed = 150.0                 # m/s: the Reynolds numbers (climb and cruise)
max_mach = 1.2                # the tables' Mach range: through the transonic drag rise
induced_drag = "trefftz"      # a swept transport wing's induced drag from its loading (docs/hangar.md)

# The wing: 226.0 m2 (2,433 ft2), 39.88 m span, 35.3 deg quarter-chord sweep,
# taper 0.325 (the reference trapezoid above). Dihedral 7 deg, the 367-80's
# and every C-135's and 707's (This Day in Aviation; the drawings' ground
# views show 4.5-5.5 deg, the tanks full and the wing drooping). Washout 3
# deg, root +2 deg (estimate). Sections: Boeing's BAC
# 310-313 are not published; NACA 64A sections of the thickness such
# 1950s transport wings had stand in (12 % root, 9 % tip; estimate). Its
# round-nosed sections stall as sections do: no fighter's vortex regime,
# which hangar gives any wing swept 35 deg at the leading edge.
[[surface]]
name = "wing"
kind = "wing"
vortex = false
sections = [
  { le = [10.220, 0.000, 0.000], chord = 8.554, twist = 2.00, airfoil = "naca64a212" },
  { le = [16.683, 8.280, 1.017], chord = 6.156, twist = 0.75, airfoil = "naca64a210" },
  { le = [25.783, 19.940, 2.448], chord = 2.780, twist = -1.00, airfoil = "naca64a209" },
]
# Measured off the plan view: inboard flaps from the fuselage to the inboard
# engine, the inboard (high-speed) ailerons behind it, the outboard flaps to
# the outboard engine and the outboard ailerons to 18 m. Travel: flaps 50 deg,
# ailerons 20 deg (estimate). The spoilers that help the ailerons are not
# modelled.
controls = [
  { name = "inboard flap", channel = "flap", kind = "fowler", span = [0.092, 0.355], chord_fraction = 0.25, limits = [0, 50] },
  { name = "inboard aileron", channel = "aileron", span = [0.365, 0.445], chord_fraction = 0.22, limits = [-20, 20] },
  { name = "outboard flap", channel = "flap", kind = "fowler", span = [0.455, 0.655], chord_fraction = 0.25, limits = [0, 50] },
  { name = "outboard aileron", channel = "aileron", span = [0.665, 0.900], chord_fraction = 0.20, limits = [-20, 20] },
]

# The horizontal stabilizer: 47.3 m2 to the centre line, 12.09 m (39 ft 8 in)
# span, 39.4 deg leading edge, 7 deg dihedral (the 367-80's; the side and
# front views give 6-8 deg). The real one trims by its incidence; here it is
# fixed at -4 deg, mid-way through its trim range (estimate), and the elevator
# trims: 30 deg up, 20 deg down (estimate).
[[surface]]
name = "htail"
kind = "htail"
vortex = false                # a 10 % section, round-nosed: it stalls
airfoil = "naca64a010"
sections = [
  { le = [33.780, 0.000, 2.050], chord = 5.370, twist = -4.0 },
  { le = [38.737, 6.045, 2.792], chord = 2.462, twist = -4.0 },
]
controls = [
  { name = "elevator", channel = "elevator", span = [0.15, 0.95], chord_fraction = 0.30, limits = [-30, 20] },
]

# The tall fin every KC-135 carries now (41 ft 8 in over the ground, 40 in
# taller than the KC-135A's): 35 deg leading edge, 10 deg trailing edge,
# about 30 m2; the rudder to 79 % of its height, its chord growing from 30 %
# to 55 % (the USAF drawing). Its root reaches into the fuselage.
[[surface]]
name = "fin"
kind = "fin"
airfoil = "naca64a010"
sections = [
  { le = [32.419, 0.000, 3.100], chord = 6.185 },
  { le = [37.622, 0.000, 10.490], chord = 2.387 },
]
controls = [
  { name = "rudder", channel = "rudder", span = [0.03, 0.79], chord_fraction = [0.30, 0.55], limits = [-25, 25] },
]

