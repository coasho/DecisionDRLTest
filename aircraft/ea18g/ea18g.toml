# The pylons (drawn; their drag is in the pods'): the mid-board wing pylons
# and the centre-line one
[[strut]]
name = "wing pylon"
from = [11.800, 3.600, -0.040]
to = [11.800, 3.600, -0.600]
chord = 1.900
thickness = 0.140

[[strut]]
name = "centre-line pylon"
mirror = false
from = [10.550, 0.000, -0.900]
to = [10.550, 0.000, -1.480]
chord = 1.700
thickness = 0.140

[[engine]]
name = "F414-GE-400"
type = "turbofan"
mirror = true
thrust_dry_kn = 62.3          # 14,000 lbf military (USNA fact sheet; Wikipedia)
thrust_wet_kn = 97.9          # 22,000 lbf afterburner
bypass_ratio = 0.25           # General Electric (Wikipedia)
tsfc_dry = 0.84               # lb/(lbf h), military
tsfc_wet = 1.85               # full afterburner
throttle_ratio = 1.10         # calibrated below (calibration.toml)
design_mach = 1.8
position = [15.100, 0.530, -0.420]
mass = 1110                   # 2,445 lb dry (GE)
inlet_x = 8.8
[engine.nozzle]
position = [17.450, 0.530, -0.450]
diameter = 0.840              # as drawn

# The gear where the four-view draws its wheels (the axles 5.53 and 11.31 m
# behind the nose), the 3.19 m track (VRS/NATOPS: 10.45 ft), standing on the
# ground line that puts the fins' tips the published 4.88 m up. Tyres: twin
# 22x6.6-10 on the nose, 32x11.5-15 on the mains. The nose gear folds
# forward; the main legs fold aft into the fuselage, their wheels turning to
# lie flat under the intake ducts, as the Hornet's do.
[[gear]]
name = "Nose Gear"
position = [5.530, 0.0, -2.480]
steerable = true
max_steer = 75
wheel_diameter = 0.559
wheel_width = 0.168
retractable = true
retract = "forward"
wheels = 2
static_deflection = 0.14
attach = [5.450, 0.0, -0.600]

[[gear]]
name = "Main Gear"
mirror = true
position = [11.310, 1.593, -2.520]
wheel_diameter = 0.813
wheel_width = 0.292
retractable = true
retract = "aft"
wheel_turn = "flat"
static_deflection = 0.18
attach = [10.950, 1.050, -0.750]

[reference]
aero_point = [10.660, 0.0, 0.0]    # at the CG

# The Super Hornet's flight control system: 7.5 g (the published design load
# factor), -3 g; the angle of attack held to 35 deg (published: 35-40 in
# service with stores - the lower end with three pods; at 40 its relaxed
# pitch stability took the limiter 6 deg past it at 350 kt); roll rate 180
# deg/s (estimate: the E/F rolls slower than the C, and carries three pods)
[flight_control]
type = "fbw"
n_max = 7.5
n_min = -3.0
alpha_max_deg = 35.0
roll_rate_deg_s = 180.0

[mass]
empty = 15011                 # 33,094 lb, EA-18G (USNA; Wikipedia)
empty_cg = [10.750, 0.0, -0.200]
# no published inertia: the F/A-18 HARV's radii of gyration (NASA: Ixx
# 22,789, Iyy 176,809, Izz 191,744 slug ft2 at 33,310 lb), the roll and yaw
# ones raised for the receiver pods on the wing tips (estimate)
gyration = [0.275, 0.450, 0.575]
[mass.component]              # kg
"ALQ-218 pod" = 180           # both wing-tip pods (estimate)
"ALQ-99 pod" = 0              # the jamming pods are payload, below
"centre-line ALQ-99 pod" = 0
[[mass.payload]]
name = "pilot"
mass = 100
position = [4.800, 0.0, 0.600]
[[mass.payload]]
name = "electronic warfare officer"
mass = 100
position = [6.200, 0.0, 0.680]
[[mass.payload]]
name = "left ALQ-99 pod"      # about 960 lb each (estimate)
mass = 435
position = [11.900, -3.600, -0.850]
[[mass.payload]]
name = "right ALQ-99 pod"
mass = 435
position = [11.900, 3.600, -0.850]
[[mass.payload]]
name = "centre-line ALQ-99 pod"
mass = 435
position = [10.550, 0.0, -1.500]
# internal fuel 13,940 lb (6,323 kg; Wikipedia): four fuselage tanks and the
# wing tanks (the split is an estimate)
[[mass.tank]]
name = "fuselage 1"
position = [7.900, 0.0, 0.100]
capacity = 700
[[mass.tank]]
name = "fuselage 2"
position = [9.200, 0.0, 0.050]
capacity = 1300
[[mass.tank]]
name = "fuselage 3"
position = [10.600, 0.0, 0.000]
capacity = 1300
[[mass.tank]]
name = "fuselage 4"
position = [12.100, 0.0, -0.050]
capacity = 1100
[[mass.tank]]
name = "left wing"
position = [11.200, -2.600, -0.030]
capacity = 961.5
[[mass.tank]]
name = "right wing"
position = [11.200, 2.600, -0.030]
capacity = 961.5

[dimensions]                  # published, overall, gear down (USNA; Wikipedia: span with the wing-tip pods):
length = 18.31                 # m
span = 13.62
height = 4.88

[targets]
# EA-18G, published (US Navy; Wikipedia)
max_mach = 1.8                # at 40,000 ft, full afterburner (calibrates the engine and the wave drag)
max_mach_altitude_ft = 40000
operational_ceiling_ft = 50000 # published "50,000+": the clearance, not where the climb runs out
